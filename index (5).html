<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management - Integrated System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 50: '#fff1f2', 100: '#ffe4e6', 600: '#e11d48', 700: '#be123c', 800: '#9f1239', 900: '#881337' } }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 h-screen flex bg-slate-50">

    <div id="app-layer" class="flex w-full h-full relative overflow-hidden">
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col z-20 shadow-xl hidden md:flex">
            <div class="p-6 flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center text-white shadow-md"><i class="fas fa-clinic-medical"></i></div>
                <div><h1 class="font-black text-lg text-brand-800 tracking-tight">MMRC SYSTEM</h1><p class="text-[10px] font-bold text-slate-400">VERSI 17.5 (FULL)</p></div>
            </div>
            <nav class="flex-1 px-4 space-y-2 overflow-y-auto custom-scroll">
                <div class="text-[10px] font-bold text-brand-800/50 uppercase tracking-wider px-2 mt-4 mb-2">Menu Utama</div>
                <div onclick="app.renderDashboard()" class="nav-item active"><i class="fas fa-grid-2 w-6"></i> Dashboard</div>
                <div onclick="app.renderPatientList('detox')" class="nav-item"><i class="fas fa-procedures w-6"></i> Unit Detox</div>
                <div onclick="app.renderPatientList('rehab')" class="nav-item"><i class="fas fa-walking w-6"></i> Unit Rehab</div>
            </nav>
            <div class="p-4 border-t bg-slate-50">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center font-bold"><i class="fas fa-user-nurse"></i></div>
                    <div class="flex-1"><p class="text-xs font-bold text-slate-700">Staff Medis</p><p class="text-[10px] text-green-600 font-bold">● Online</p></div>
                    <button onclick="app.logout()" class="text-slate-400 hover:text-red-600 transition"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative w-full">
            <header class="h-16 bg-white border-b flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
                <h2 id="page-title" class="font-bold text-lg text-brand-800">DASHBOARD</h2>
                <div id="header-actions" class="flex items-center gap-3"></div>
            </header>
            <div id="main-content" class="flex-1 overflow-y-auto p-6 scroll-smooth relative bg-slate-50"></div>
        </main>
    </div>

    <div id="modal-container" class="hidden fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[90vh] animate-popup">
            <div class="p-5 border-b flex justify-between items-center bg-brand-50 rounded-t-3xl">
                <h3 id="modal-title" class="font-black text-brand-800 tracking-tight">FORM</h3>
                <button onclick="app.closeModal()" class="w-8 h-8 rounded-full bg-white hover:bg-red-50 text-slate-400 hover:text-red-500 transition shadow-sm">✕</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
