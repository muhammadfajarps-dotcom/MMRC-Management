<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management - Madani Mental Recovery Center</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .sidebar-active { background-color: #0f766e; border-right: 4px solid #34d399; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-gray-800">

    <div id="login-section" class="fixed inset-0 z-50 flex items-center justify-center bg-teal-900 bg-opacity-90 transition-opacity duration-500">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center transform transition-all scale-100">
            <div class="mb-6">
                <i class="fas fa-heartbeat text-5xl text-teal-600"></i>
                <h1 class="text-2xl font-bold text-gray-800 mt-2">MMRC Management</h1>
                <p class="text-sm text-gray-500">Madani Mental Recovery Center</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                <button type="submit" class="w-full bg-teal-600 text-white py-2 rounded-lg hover:bg-teal-700 transition shadow-lg">MASUK</button>
            </form>
            <p class="mt-4 text-xs text-gray-400">System v2.0 Secured</p>
        </div>
    </div>

    <div id="app-section" class="hidden flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl z-20">
            <div class="p-6 border-b border-slate-700 flex items-center gap-3">
                <i class="fas fa-hospital-user text-teal-400 text-2xl"></i>
                <div>
                    <h2 class="font-bold text-lg tracking-wider">MMRC</h2>
                    <p class="text-xs text-slate-400">Management System</p>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 space-y-1">
                <a href="#" onclick="showPage('dashboard')" id="nav-dashboard" class="flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 transition sidebar-active">
                    <i class="fas fa-th-large w-6"></i> Dashboard
                </a>
                <a href="#" onclick="showPage('medicine')" id="nav-medicine" class="flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 transition">
                    <i class="fas fa-pills w-6"></i> Medicine
                </a>
                <a href="#" onclick="showPage('ttv')" id="nav-ttv" class="flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 transition">
                    <i class="fas fa-stethoscope w-6"></i> TTV & GDS
                </a>
                <a href="#" onclick="showPage('visit')" id="nav-visit" class="flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 transition">
                    <i class="fas fa-user-md w-6"></i> Visit Dokter
                </a>
                <a href="#" onclick="showPage('crisis')" id="nav-crisis" class="flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 transition">
                    <i class="fas fa-exclamation-triangle w-6"></i> Pasien Crisis
                </a>
                <a href="#" onclick="showPage('program')" id="nav-program" class="flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 transition">
                    <i class="fas fa-calendar-check w-6"></i> Rencana Program
                </a>
                <a href="#" onclick="showPage('terapi')" id="nav-terapi" class="flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 transition">
                    <i class="fas fa-brain w-6"></i> Rencana Terapi
                </a>
            </nav>
            <div class="p-4 border-t border-slate-700">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white py-2 rounded transition">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-gray-100 relative overflow-hidden">
            <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10">
                <h2 id="page-title" class="text-2xl font-bold text-teal-800">Dashboard Pasien</h2>
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <input type="text" id="global-search" onkeyup="globalSearch()" placeholder="Cari data..." class="pl-10 pr-4 py-2 border rounded-full text-sm focus:ring-teal-500 w-64 transition-all focus:w-80">
                        <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
                    </div>
                    <button onclick="exportToExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 shadow flex items-center gap-2 text-sm">
                        <i class="fas fa-file-excel"></i> Export Data
                    </button>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-teal-100 flex items-center justify-center text-teal-700 font-bold">A</div>
                        <span class="text-sm font-semibold">Admin Ops</span>
                    </div>
                </div>
            </header>

            <div id="content-area" class="flex-1 overflow-auto p-6 space-y-6">
                </div>
        </main>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-auto m-4 animate-fade-in-up">
            <div class="flex justify-between items-center p-6 border-b bg-teal-50 rounded-t-xl">
                <h3 id="modal-title" class="text-xl font-bold text-teal-800">Form Input</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl">&times;</button>
            </div>
            <div id="modal-content" class="p-6">
                </div>
        </div>
    </div>

    <script>
        // ================= STATE MANAGEMENT (DATABASE) =================
        const CREDENTIALS = { user: "OPERASIONAL.MMRC", pass: "MADANI1999" };
        let CURRENT_PAGE = 'dashboard';
        
        // Load data from localStorage or initialize
        let DB = JSON.parse(localStorage.getItem('MMRC_DB')) || {
            patients: [], // id, regDate, photo, bio, history, diagnosis, medicines[], visits[], bpss[], program, therapy
        };

        function saveDB() {
            localStorage.setItem('MMRC_DB', JSON.stringify(DB));
        }

        // ================= AUTHENTICATION =================
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === CREDENTIALS.user && p === CREDENTIALS.pass) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                renderDashboard();
                Swal.fire({icon: 'success', title: 'Login Berhasil', timer: 1500, showConfirmButton: false});
            } else {
                Swal.fire('Error', 'Username atau Password salah!', 'error');
            }
        }

        function logout() {
            location.reload();
        }

        // ================= NAVIGATION & ROUTING =================
        function showPage(page) {
            CURRENT_PAGE = page;
            // Update Sidebar UI
            document.querySelectorAll('aside nav a').forEach(el => {
                el.classList.remove('sidebar-active', 'bg-slate-800', 'text-white');
                el.classList.add('text-slate-300');
            });
            const activeLink = document.getElementById(`nav-${page}`);
            if(activeLink) {
                activeLink.classList.add('sidebar-active', 'text-white');
                activeLink.classList.remove('text-slate-300');
            }

            // Render Page Content
            const content = document.getElementById('content-area');
            const title = document.getElementById('page-title');
            content.innerHTML = '';

            switch(page) {
                case 'dashboard': title.innerText = 'Dashboard & Registrasi'; renderDashboard(); break;
                case 'medicine': title.innerText = 'Medicine & Stok Obat'; renderMedicine(); break;
                case 'ttv': title.innerText = 'TTV & GDS Monitoring'; renderTTV(); break;
                case 'visit': title.innerText = 'Visit Dokter'; renderVisit(); break;
                case 'crisis': title.innerText = 'Pasien Crisis & BPSS'; renderCrisis(); break;
                case 'program': title.innerText = 'Rencana Program'; renderProgram(); break;
                case 'terapi': title.innerText = 'Rencana Terapi'; renderTerapi(); break;
            }
        }

        // ================= PAGE: DASHBOARD (REGISTRASI) =================
        function renderDashboard() {
            const container = document.getElementById('content-area');
            
            // Action Bar
            const actionBar = `<button onclick="openModal('add_patient')" class="bg-teal-600 text-white px-4 py-2 rounded shadow hover:bg-teal-700 mb-4"><i class="fas fa-plus"></i> Registrasi Pasien Baru</button>`;
            
            // Table
            let html = `
                ${actionBar}
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${DB.patients.map(p => `
                    <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-xl transition relative group">
                        <div class="h-32 bg-gradient-to-r from-teal-500 to-emerald-600 relative">
                            <img src="${p.photo || 'https://via.placeholder.com/150'}" class="w-24 h-24 rounded-full border-4 border-white absolute -bottom-12 left-6 object-cover bg-white">
                        </div>
                        <div class="pt-14 px-6 pb-6">
                            <h3 class="text-xl font-bold text-gray-800">${p.bio.name}</h3>
                            <p class="text-sm text-gray-500">${p.bio.diagnosis_entry || 'Belum diagnosa'}</p>
                            <div class="mt-4 space-y-2 text-sm">
                                <div class="flex justify-between border-b pb-1"><span>Usia:</span> <span class="font-semibold">${p.bio.age} Th</span></div>
                                <div class="flex justify-between border-b pb-1"><span>Masuk:</span> <span class="font-semibold">${p.regDate}</span></div>
                                <div class="flex justify-between"><span>Wali:</span> <span class="font-semibold">${p.bio.guardian}</span></div>
                            </div>
                            <div class="mt-4 flex gap-2">
                                <button onclick="editPatient('${p.id}')" class="flex-1 bg-yellow-500 text-white py-1 rounded text-sm hover:bg-yellow-600">Edit</button>
                                <button onclick="deletePatient('${p.id}')" class="flex-1 bg-red-500 text-white py-1 rounded text-sm hover:bg-red-600">Hapus</button>
                            </div>
                        </div>
                    </div>
                    `).join('')}
                </div>
            `;
            container.innerHTML = html;
        }

        // ================= PAGE: MEDICINE =================
        function renderMedicine() {
            const container = document.getElementById('content-area');
            if(DB.patients.length === 0) { container.innerHTML = '<p class="text-center text-gray-500">Belum ada data pasien.</p>'; return; }

            let html = `<div class="bg-white rounded-xl shadow p-6">`;
            
            DB.patients.forEach(p => {
                html += `
                <div class="mb-8 border-b pb-6 last:border-0">
                    <h3 class="text-lg font-bold text-teal-700 mb-4"><i class="fas fa-user-circle"></i> ${p.bio.name}</h3>
                    
                    <div class="mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="font-semibold text-sm text-gray-600">Stok Obat</h4>
                            <button onclick="openMedicineModal('${p.id}', 'add_stock')" class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded hover:bg-blue-200">+ Tambah Obat</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left text-gray-500">
                                <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                                    <tr>
                                        <th class="px-4 py-2">Nama Obat</th>
                                        <th class="px-4 py-2">Awal</th>
                                        <th class="px-4 py-2">Terpakai</th>
                                        <th class="px-4 py-2">Sisa</th>
                                        <th class="px-4 py-2">Est. Habis</th>
                                        <th class="px-4 py-2">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${(p.medicines || []).map((m, idx) => {
                                        const sisa = m.initial - m.used;
                                        const alertClass = sisa < 7 ? 'text-red-600 font-bold bg-red-50' : '';
                                        return `
                                        <tr class="border-b ${alertClass}">
                                            <td class="px-4 py-2 font-medium">${m.name}</td>
                                            <td class="px-4 py-2">${m.initial}</td>
                                            <td class="px-4 py-2">${m.used}</td>
                                            <td class="px-4 py-2">${sisa} ${sisa < 7 ? '<i class="fas fa-exclamation-circle animate-pulse"></i>' : ''}</td>
                                            <td class="px-4 py-2">${m.est_end || '-'}</td>
                                            <td class="px-4 py-2">
                                                <button onclick="useMedicine('${p.id}', ${idx})" class="text-green-600 hover:text-green-800 border border-green-600 rounded px-2 py-0.5">Minum</button>
                                            </td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div>
                        <h4 class="font-semibold text-sm text-gray-600 mb-2">Riwayat Penggunaan</h4>
                        <div class="max-h-40 overflow-y-auto bg-gray-50 rounded p-2 text-xs">
                             ${(p.med_logs || []).map(l => `
                                <div class="flex justify-between py-1 border-b border-gray-200 last:border-0">
                                    <span><b>${l.medName}</b> - ${l.time}</span>
                                    <span class="text-gray-500">PJ: ${l.pic}</span>
                                </div>
                             `).join('')}
                        </div>
                    </div>
                </div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // ================= PAGE: TTV & GDS =================
        function renderTTV() {
            // Simplification for brevity: List patients, click to add/view log
            const container = document.getElementById('content-area');
            let html = `<div class="grid grid-cols-1 gap-6">`;
            
            DB.patients.forEach(p => {
                html += `
                <div class="bg-white p-6 rounded-xl shadow">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-gray-800">${p.bio.name}</h3>
                        <button onclick="openTTVModal('${p.id}')" class="bg-teal-600 text-white px-3 py-1 rounded text-sm">Input TTV/GDS</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-gray-100 text-xs uppercase">
                                <tr>
                                    <th class="p-2">Waktu</th>
                                    <th class="p-2">TD (mmHg)</th>
                                    <th class="p-2">HR (bpm)</th>
                                    <th class="p-2">Suhu (°C)</th>
                                    <th class="p-2">GDS</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${(p.ttv || []).slice(-5).reverse().map(t => `
                                <tr class="border-b">
                                    <td class="p-2">${t.timestamp}</td>
                                    <td class="p-2">${t.td}</td>
                                    <td class="p-2">${t.hr}</td>
                                    <td class="p-2">${t.temp}</td>
                                    <td class="p-2">${t.gds || '-'}</td>
                                </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // ================= PAGE: PASIEN CRISIS (BPSS CHART) =================
        function renderCrisis() {
            const container = document.getElementById('content-area');
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;

            DB.patients.forEach((p, idx) => {
                // Get latest score
                const latest = p.bpss && p.bpss.length > 0 ? p.bpss[p.bpss.length-1] : {bio:0, psy:0, soc:0, spi:0};
                
                html += `
                <div class="bg-white p-6 rounded-xl shadow flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-gray-800">${p.bio.name}</h3>
                        <button onclick="openBPSSModal('${p.id}')" class="text-xs bg-indigo-100 text-indigo-600 px-2 py-1 rounded">Input Score</button>
                    </div>
                    <div class="flex-1 flex items-center justify-center relative h-64 w-full">
                        <canvas id="chart-bpss-${idx}"></canvas>
                    </div>
                    <div class="mt-4 text-xs text-center text-gray-500">
                        Total 7 Hari Terakhir
                    </div>
                </div>`;
                
                // Render chart after DOM update
                setTimeout(() => {
                    const ctx = document.getElementById(`chart-bpss-${idx}`).getContext('2d');
                    new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: ['Biological', 'Psychological', 'Social', 'Spiritual'],
                            datasets: [{
                                label: 'BPSS Score',
                                data: [latest.bio, latest.psy, latest.soc, latest.spi],
                                backgroundColor: 'rgba(45, 212, 191, 0.2)',
                                borderColor: 'rgba(13, 148, 136, 1)',
                                borderWidth: 2,
                                pointBackgroundColor: 'rgba(13, 148, 136, 1)'
                            }]
                        },
                        options: {
                            scales: { r: { beginAtZero: true, max: 25 } },
                            maintainAspectRatio: false
                        }
                    });
                }, 100);
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // ================= PAGE: VISIT DOKTER =================
        function renderVisit() {
             const container = document.getElementById('content-area');
             let html = `<div class="space-y-6">`;
             
             DB.patients.forEach(p => {
                 html += `
                 <div class="bg-white p-6 rounded-xl shadow">
                     <div class="flex justify-between mb-4 border-b pb-2">
                        <h3 class="font-bold text-lg">${p.bio.name}</h3>
                        <button onclick="openVisitModal('${p.id}')" class="bg-teal-600 text-white px-3 py-1 rounded text-sm hover:bg-teal-700">Tambah Visit</button>
                     </div>
                     <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${(p.visits || []).map(v => `
                            <div class="border rounded p-3 flex gap-4">
                                <div class="w-1/3">
                                    <img src="${v.photo || 'https://via.placeholder.com/100'}" class="w-full h-24 object-cover rounded bg-gray-200">
                                </div>
                                <div class="w-2/3 text-sm">
                                    <p class="font-bold text-teal-700">${v.date}</p>
                                    <p class="italic text-gray-600 my-1">"${v.notes}"</p>
                                    <div class="mt-2 border-t pt-1">
                                        <p class="text-xs text-gray-400">TTD Dokter:</p>
                                        <img src="${v.signature}" class="h-8 object-contain">
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                     </div>
                 </div>`;
             });
             html += `</div>`;
             container.innerHTML = html;
        }
        
        // Placeholder render functions for completeness
        function renderProgram() { document.getElementById('content-area').innerHTML = '<div class="p-6 bg-white rounded shadow">Fitur Rencana Program (Paket Reguler/Ekslusif) akan menampilkan tabel durasi 7-60 hari di sini. <br><br><i>Gunakan tombol Export untuk unduh data.</i></div>'; }
        function renderTerapi() { document.getElementById('content-area').innerHTML = '<div class="p-6 bg-white rounded shadow">Fitur Rencana Terapi akan menampilkan log harian terapi.</div>'; }

        // ================= MODAL LOGIC =================
        let activePatientId = null;
        let signaturePad = null;

        function openModal(type) {
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            const title = document.getElementById('modal-title');
            
            modal.classList.remove('hidden');

            if(type === 'add_patient') {
                title.innerText = 'Registrasi Pasien Masuk';
                content.innerHTML = `
                    <form onsubmit="savePatient(event)" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium">Nama Lengkap</label><input name="name" type="text" required class="w-full border rounded p-2"></div>
                            <div><label class="block text-sm font-medium">Tanggal Masuk</label><input name="regDate" type="datetime-local" required class="w-full border rounded p-2"></div>
                            <div><label class="block text-sm font-medium">Usia</label><input name="age" type="number" class="w-full border rounded p-2"></div>
                            <div><label class="block text-sm font-medium">Wali Pasien</label><input name="guardian" type="text" class="w-full border rounded p-2"></div>
                            <div class="col-span-2"><label class="block text-sm font-medium">Diagnosa Awal</label><textarea name="diagnosis_entry" class="w-full border rounded p-2"></textarea></div>
                            <div class="col-span-2"><label class="block text-sm font-medium">Foto Pasien</label><input id="patient_photo" type="file" accept="image/*" class="w-full text-sm"></div>
                        </div>
                        <button type="submit" class="bg-teal-600 text-white px-6 py-2 rounded w-full hover:bg-teal-700">Simpan Data</button>
                    </form>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        async function savePatient(e) {
            e.preventDefault();
            const form = e.target;
            const photoInput = document.getElementById('patient_photo');
            let photoBase64 = '';

            if(photoInput.files[0]) {
                photoBase64 = await toBase64(photoInput.files[0]);
            }

            const newPatient = {
                id: Date.now().toString(),
                regDate: form.regDate.value,
                photo: photoBase64,
                bio: {
                    name: form.name.value,
                    age: form.age.value,
                    guardian: form.guardian.value,
                    diagnosis_entry: form.diagnosis_entry.value,
                    address: '', job: '', edu: '', marriage: '' // Simplified for demo
                },
                medicines: [], med_logs: [], ttv: [], visits: [], bpss: []
            };

            DB.patients.push(newPatient);
            saveDB();
            closeModal();
            renderDashboard();
            Swal.fire('Sukses', 'Data pasien berhasil disimpan', 'success');
        }

        // ================= HELPER: MEDICINE & SIGNATURE =================
        function openMedicineModal(pid, action) {
            activePatientId = pid;
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = 'Tambah Stok Obat';
            document.getElementById('modal-content').innerHTML = `
                <form onsubmit="saveMedicine(event)" class="space-y-4">
                    <input type="text" name="med_name" placeholder="Nama Obat" required class="w-full border p-2 rounded">
                    <div class="flex gap-2">
                        <input type="number" name="med_qty" placeholder="Jumlah Awal" required class="w-full border p-2 rounded">
                        <input type="date" name="med_est" placeholder="Est Habis" class="w-full border p-2 rounded">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Simpan Stok</button>
                </form>
            `;
            modal.classList.remove('hidden');
        }

        function saveMedicine(e) {
            e.preventDefault();
            const p = DB.patients.find(x => x.id === activePatientId);
            if(p) {
                p.medicines.push({
                    name: e.target.med_name.value,
                    initial: parseInt(e.target.med_qty.value),
                    used: 0,
                    est_end: e.target.med_est.value
                });
                saveDB();
                closeModal();
                renderMedicine();
            }
        }

        function useMedicine(pid, medIdx) {
            Swal.fire({
                title: 'Konfirmasi Minum Obat',
                input: 'text',
                inputLabel: 'Nama Penanggung Jawab (PJ)',
                showCancelButton: true,
                confirmButtonText: 'Catat',
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    const p = DB.patients.find(x => x.id === pid);
                    p.medicines[medIdx].used++;
                    p.med_logs.push({
                        medName: p.medicines[medIdx].name,
                        time: new Date().toLocaleString(),
                        pic: result.value
                    });
                    saveDB();
                    renderMedicine();
                    
                    // Check stock
                    const sisa = p.medicines[medIdx].initial - p.medicines[medIdx].used;
                    if(sisa < 7) Swal.fire('Peringatan!', `Stok obat tersisa ${sisa}. Harap restock!`, 'warning');
                }
            });
        }

        // Visit Modal with Signature Pad
        function openVisitModal(pid) {
            activePatientId = pid;
            const modal = document.getElementById('modal-overlay');
            modal.classList.remove('hidden');
            document.getElementById('modal-title').innerText = 'Input Visit Dokter';
            document.getElementById('modal-content').innerHTML = `
                <div class="space-y-4">
                    <input type="file" id="visit_photo" class="w-full text-sm">
                    <textarea id="visit_notes" class="w-full border p-2 rounded h-24" placeholder="Keterangan Dokter..."></textarea>
                    <div class="border border-gray-300 rounded">
                        <p class="text-xs text-gray-500 p-2">Tanda Tangan Dokter:</p>
                        <canvas id="sig-canvas" class="w-full h-32 bg-gray-50"></canvas>
                        <button onclick="signaturePad.clear()" class="text-xs text-red-500 p-2">Clear</button>
                    </div>
                    <button onclick="saveVisit()" class="w-full bg-teal-600 text-white py-2 rounded">Simpan Visit</button>
                </div>
            `;
            
            setTimeout(() => {
                const canvas = document.getElementById('sig-canvas');
                // Fix canvas scaling for high DPI
                canvas.width = canvas.offsetWidth; 
                canvas.height = canvas.offsetHeight;
                signaturePad = new SignaturePad(canvas);
            }, 100);
        }

        async function saveVisit() {
            const p = DB.patients.find(x => x.id === activePatientId);
            const photoInput = document.getElementById('visit_photo');
            let photoBase64 = null;
            if(photoInput.files[0]) photoBase64 = await toBase64(photoInput.files[0]);

            p.visits.push({
                date: new Date().toLocaleString(),
                photo: photoBase64,
                notes: document.getElementById('visit_notes').value,
                signature: signaturePad.toDataURL()
            });
            saveDB();
            closeModal();
            renderVisit();
        }

        // ================= UTILITIES =================
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function deletePatient(id) {
            Swal.fire({
                title: 'Yakin hapus data?', text: "Data tidak bisa kembali!", icon: 'warning', showCancelButton: true
            }).then((result) => {
                if (result.isConfirmed) {
                    DB.patients = DB.patients.filter(p => p.id !== id);
                    saveDB();
                    renderDashboard();
                }
            })
        }

        function exportToExcel() {
            // Flatten data for export
            const data = DB.patients.map(p => ({
                ID: p.id,
                Nama: p.bio.name,
                Usia: p.bio.age,
                Masuk: p.regDate,
                Diagnosa: p.bio.diagnosis_entry,
                Wali: p.bio.guardian
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data Pasien");
            XLSX.writeFile(wb, "MMRC_Data_Export.xlsx");
        }

        function globalSearch() {
            const term = document.getElementById('global-search').value.toLowerCase();
            // Implement logic to filter DOM elements based on page context
            // Simple DOM filtering for Dashboard cards:
            if(CURRENT_PAGE === 'dashboard') {
                document.querySelectorAll('#content-area > div.grid > div').forEach(card => {
                    card.style.display = card.innerText.toLowerCase().includes(term) ? 'block' : 'none';
                });
            }
        }
    </script>
</body>
</html>
