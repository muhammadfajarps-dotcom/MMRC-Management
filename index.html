<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management - Madani Mental Recovery Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.1.0/docx.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar-active { background: #1e293b; border-left: 4px solid #3b82f6; color: white; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="mmrcApp()" x-init="init()">

    <template x-if="!isLoggedIn">
        <div class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 p-4">
            <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-slate-800">MMRC</h1>
                    <p class="text-slate-500 italic">Madani Mental Recovery Center</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                        <input type="text" x-model="loginForm.user" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                        <input type="password" x-model="loginForm.pass" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <button @click="doLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200">MASUK</button>
                    <p x-show="errorMsg" x-text="errorMsg" class="text-red-500 text-sm text-center font-medium"></p>
                </div>
            </div>
        </div>
    </template>

    <div x-show="isLoggedIn" x-cloak class="flex min-h-screen">
        <aside class="w-64 bg-slate-800 text-slate-300 hidden md:flex flex-col shadow-xl">
            <div class="p-6 bg-slate-900">
                <h2 class="text-xl font-bold text-white tracking-wider">MMRC MGMT</h2>
                <p class="text-xs text-blue-400">Operational System</p>
            </div>
            <nav class="flex-1 mt-4">
                <template x-for="menu in menus">
                    <button @click="activeMenu = menu.id; resetSearch()" 
                            class="w-full flex items-center px-6 py-4 transition-all hover:bg-slate-700 hover:text-white"
                            :class="activeMenu === menu.id ? 'sidebar-active' : ''">
                        <span x-text="menu.label" class="font-semibold uppercase text-xs tracking-widest"></span>
                    </button>
                </template>
            </nav>
            <button @click="isLoggedIn = false" class="p-6 text-sm text-red-400 hover:text-red-300 text-left border-t border-slate-700 uppercase font-bold tracking-tighter">Logout</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm border-b px-8 py-4 flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800" x-text="activeMenuLabel"></h3>
                <div class="flex space-x-3">
                    <button @click="exportToExcel()" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-md hover:bg-emerald-700">EXCEL</button>
                    <button @click="exportToWord()" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-md hover:bg-blue-700">WORD</button>
                </div>
            </header>

            <section class="p-8 overflow-y-auto h-full">
                <div x-show="activeMenu === 'dashboard'" class="space-y-6">
                    <div class="flex justify-between items-center">
                        <input type="text" x-model="searchQuery" placeholder="Cari nama pasien..." class="px-4 py-2 border rounded-lg w-1/3 outline-none focus:ring-2 focus:ring-blue-400">
                        <button @click="openModal('pasien')" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold shadow-md hover:bg-blue-700">+ Tambah Pasien</button>
                    </div>

                    <div class="grid grid-cols-1 gap-6">
                        <template x-for="(pasien, index) in filteredPasien" :key="index">
                            <div class="bg-white rounded-xl shadow-sm border p-6 hover:shadow-md transition relative">
                                <div class="absolute top-4 right-4 space-x-2">
                                    <button @click="editPasien(pasien)" class="text-blue-500 text-sm font-bold">Edit</button>
                                    <button @click="deletePasien(pasien.id)" class="text-red-500 text-sm font-bold">Hapus</button>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div>
                                        <h4 class="text-blue-600 font-bold uppercase text-xs mb-3 border-b pb-1">Registrasi Pasien</h4>
                                        <p class="text-sm font-bold text-slate-800" x-text="pasien.nama"></p>
                                        <div class="text-xs text-slate-500 mt-2 space-y-1">
                                            <p>Masuk: <span x-text="pasien.waktu"></span></p>
                                            <p>Usia: <span x-text="pasien.usia"></span> thn | <span x-text="pasien.pendidikan"></span></p>
                                            <p>Alamat: <span x-text="pasien.alamat"></span></p>
                                            <p>Wali: <span x-text="pasien.wali"></span></p>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 class="text-amber-600 font-bold uppercase text-xs mb-3 border-b pb-1">Riwayat Penyakit</h4>
                                        <div class="text-xs space-y-2">
                                            <p class="italic text-slate-600" x-text="pasien.riwayat"></p>
                                            <p><strong>Dosis:</strong> <span x-text="pasien.riwayatDosis"></span></p>
                                            <p><strong>Kondisi:</strong> <span x-text="pasien.kondisiTerkini"></span></p>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 class="text-emerald-600 font-bold uppercase text-xs mb-3 border-b pb-1">Diagnosa Dokter</h4>
                                        <div class="text-xs space-y-2">
                                            <p><strong>Dokter:</strong> <span x-text="pasien.dokter"></span></p>
                                            <p><strong>Diagnosa:</strong> <span x-text="pasien.diagnosa"></span></p>
                                            <div class="flex space-x-2 mt-2">
                                                <span :class="pasien.intervensi.injeksi ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'" class="px-2 py-1 rounded">Injeksi</span>
                                                <span :class="pasien.intervensi.urine ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'" class="px-2 py-1 rounded">Urine</span>
                                                <span :class="pasien.intervensi.fiksasi ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'" class="px-2 py-1 rounded">Fiksasi</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-6 pt-4 border-t border-dashed grid grid-cols-2 gap-4">
                                    <div class="bg-blue-50 p-3 rounded-lg">
                                        <p class="text-[10px] font-bold text-blue-800 uppercase">Stok Obat Personal</p>
                                        <div class="flex items-center justify-between">
                                            <p class="text-lg font-bold" :class="pasien.stokObat.akhir <= 7 ? 'text-red-600' : 'text-slate-800'">
                                                Sisa: <span x-text="pasien.stokObat.akhir"></span> Tablet
                                            </p>
                                            <span x-show="pasien.stokObat.akhir <= 7" class="animate-pulse bg-red-600 text-white text-[10px] px-2 py-1 rounded-full font-bold">Low Stok</span>
                                        </div>
                                        <button @click="openMedLogModal(pasien)" class="mt-2 text-[10px] bg-white border border-blue-400 text-blue-600 px-2 py-1 rounded">+ Catat Penggunaan</button>
                                    </div>
                                    <div class="bg-slate-50 p-3 rounded-lg overflow-y-auto max-h-24">
                                        <p class="text-[10px] font-bold text-slate-600 uppercase mb-1">Log Penggunaan Terakhir</p>
                                        <template x-for="log in pasien.logs" :key="log.id">
                                            <div class="text-[9px] border-b py-1">
                                                <span x-text="log.waktu" class="font-bold"></span> - <span x-text="log.obat"></span> (<span x-text="log.pj"></span>)
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="activeMenu === 'ttv'" class="bg-white rounded-xl shadow border p-6">
                    <div class="flex justify-between mb-4">
                        <input type="text" x-model="searchQuery" placeholder="Cari..." class="px-4 py-2 border rounded-lg">
                        <button @click="openModal('ttv')" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">Input TTV</button>
                    </div>
                    <table class="w-full text-left text-sm border-collapse">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-4 border">Waktu</th>
                                <th class="p-4 border">Pasien</th>
                                <th class="p-4 border">Tensi</th>
                                <th class="p-4 border">Saturasi</th>
                                <th class="p-4 border">RR</th>
                                <th class="p-4 border">TB/BB</th>
                                <th class="p-4 border">GDS</th>
                                <th class="p-4 border">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="t in filteredTTV">
                                <tr>
                                    <td class="p-4 border" x-text="t.waktu"></td>
                                    <td class="p-4 border font-bold" x-text="getPasienName(t.pasienId)"></td>
                                    <td class="p-4 border" x-text="t.tensi"></td>
                                    <td class="p-4 border" x-text="t.sat"></td>
                                    <td class="p-4 border" x-text="t.rr"></td>
                                    <td class="p-4 border" x-text="t.tb + '/' + t.bb"></td>
                                    <td class="p-4 border" x-text="t.gds"></td>
                                    <td class="p-4 border">
                                        <button @click="deleteTTV(t.id)" class="text-red-500">Hapus</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div x-show="activeMenu === 'visit'" class="space-y-4">
                    <button @click="openModal('visit')" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Input Visit Baru</button>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <template x-for="v in filteredVisit">
                            <div class="bg-white p-6 rounded-xl border shadow-sm">
                                <div class="flex justify-between mb-4">
                                    <span class="text-xs font-bold text-slate-400" x-text="v.waktu"></span>
                                    <button @click="deleteVisit(v.id)" class="text-red-500 text-xs">Hapus</button>
                                </div>
                                <h4 class="font-bold text-blue-600" x-text="getPasienName(v.pasienId)"></h4>
                                <div class="mt-3 flex space-x-4">
                                    <div class="w-24 h-24 bg-slate-100 rounded border flex items-center justify-center text-[10px] text-slate-400">
                                        <template x-if="v.foto">
                                            <img :src="v.foto" class="w-full h-full object-cover">
                                        </template>
                                        <template x-if="!v.foto">
                                            <span>No Image</span>
                                        </template>
                                    </div>
                                    <div class="flex-1 bg-slate-50 p-3 rounded italic text-xs text-slate-600" x-text="v.keterangan"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="activeMenu === 'crisis'" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-xl border shadow-sm h-fit">
                        <div class="flex justify-between items-center mb-6">
                            <h4 class="font-bold text-slate-700">BPSS Score Tracker</h4>
                            <button @click="openModal('crisis')" class="bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg">Input Skor Baru</button>
                        </div>
                        <div class="space-y-4 max-h-[500px] overflow-y-auto">
                            <template x-for="s in filteredCrisis">
                                <div @click="renderChart(s)" class="cursor-pointer hover:border-blue-300 transition border-l-4 border-l-red-500 bg-slate-50 p-4 rounded-r-lg shadow-sm">
                                    <div class="flex justify-between text-[10px] mb-2 font-bold text-slate-400">
                                        <span x-text="s.waktu"></span>
                                        <button @click.stop="deleteCrisis(s.id)" class="text-red-500">Hapus</button>
                                    </div>
                                    <p class="font-bold text-sm text-slate-800" x-text="getPasienName(s.pasienId)"></p>
                                    <div class="grid grid-cols-4 gap-2 mt-2 text-center text-[9px]">
                                        <div class="bg-red-100 p-1 rounded">BIO: <span x-text="s.bio"></span></div>
                                        <div class="bg-blue-100 p-1 rounded">PSY: <span x-text="s.psy"></span></div>
                                        <div class="bg-emerald-100 p-1 rounded">SOC: <span x-text="s.soc"></span></div>
                                        <div class="bg-amber-100 p-1 rounded">SPI: <span x-text="s.spi"></span></div>
                                    </div>
                                    <div class="mt-2 text-[10px] bg-white p-2 border rounded italic text-slate-500">
                                        Change (7 Hari): <span x-text="s.change"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="bg-white p-8 rounded-xl border shadow-sm flex flex-col items-center">
                        <h4 class="font-bold text-slate-700 mb-8 self-start">Grafik Polygon BPSS</h4>
                        <div class="w-full h-[400px]">
                            <canvas id="bpssRadarChart"></canvas>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-4 italic">*Pilih data di sebelah kiri untuk memuat grafik</p>
                    </div>
                </div>

                <div x-show="['program', 'terapi'].includes(activeMenu)" class="bg-white rounded-xl shadow border p-8">
                    <div class="flex justify-between mb-8">
                        <h4 class="font-bold text-slate-700 uppercase" x-text="'Planning ' + activeMenu"></h4>
                        <button @click="openModal(activeMenu)" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold" x-text="'+ Input ' + activeMenu"></button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <template x-for="plan in filteredPlans">
                            <div class="p-6 rounded-xl border-l-4" :class="activeMenu === 'program' ? 'border-l-indigo-500 bg-indigo-50' : 'border-l-teal-500 bg-teal-50'">
                                <div class="flex justify-between items-start">
                                    <h5 class="font-bold text-slate-800" x-text="getPasienName(plan.pasienId)"></h5>
                                    <button @click="deletePlan(plan.id)" class="text-red-400 hover:text-red-600 text-xs font-bold">Hapus</button>
                                </div>
                                <template x-if="activeMenu === 'program'">
                                    <div class="mt-4 space-y-1">
                                        <p class="text-xs font-bold text-indigo-700">PAKET: <span x-text="plan.paket"></span></p>
                                        <p class="text-xs text-indigo-600 font-medium">DURASI: <span x-text="plan.durasi"></span></p>
                                    </div>
                                </template>
                                <template x-if="activeMenu === 'terapi'">
                                    <p class="mt-4 text-xs italic text-teal-700 leading-relaxed" x-text="plan.keterangan"></p>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <template x-if="modalOpen">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
                <div class="p-6 border-b bg-slate-50 flex justify-between items-center">
                    <h3 class="font-bold text-xl text-slate-800 uppercase tracking-tight" x-text="'Input Data ' + modalTarget"></h3>
                    <button @click="modalOpen = false" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
                </div>
                <div class="p-8 overflow-y-auto">
                    <template x-if="modalTarget === 'pasien'">
                        <div class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="col-span-2"><label class="text-xs font-bold text-slate-500">NAMA LENGKAP</label><input type="text" x-model="formData.nama" class="w-full border p-2 rounded"></div>
                                <div><label class="text-xs font-bold text-slate-500">TTL</label><input type="text" x-model="formData.ttl" class="w-full border p-2 rounded"></div>
                                <div><label class="text-xs font-bold text-slate-500">USIA</label><input type="number" x-model="formData.usia" class="w-full border p-2 rounded"></div>
                                <div><label class="text-xs font-bold text-slate-500">STATUS</label><select x-model="formData.status" class="w-full border p-2 rounded"><option value="Belum Menikah">Belum Menikah</option><option value="Menikah">Menikah</option></select></div>
                                <div><label class="text-xs font-bold text-slate-500">PENDIDIKAN</label><input type="text" x-model="formData.pendidikan" class="w-full border p-2 rounded"></div>
                                <div class="col-span-2"><label class="text-xs font-bold text-slate-500">ALAMAT</label><textarea x-model="formData.alamat" class="w-full border p-2 rounded"></textarea></div>
                                <div><label class="text-xs font-bold text-slate-500">WALI</label><input type="text" x-model="formData.wali" class="w-full border p-2 rounded"></div>
                                <div><label class="text-xs font-bold text-slate-500">STOK OBAT AWAL</label><input type="number" x-model="formData.stokAwal" class="w-full border p-2 rounded"></div>
                            </div>
                            <div class="border-t pt-4">
                                <label class="text-xs font-bold text-slate-500">RIWAYAT PENYAKIT & DIAGNOSA</label>
                                <textarea x-model="formData.riwayat" class="w-full border p-2 rounded mt-2" placeholder="Fisik, psikis, diagnosa sebelumnya..."></textarea>
                                <div class="grid grid-cols-2 gap-4 mt-2">
                                    <input type="text" x-model="formData.dokter" placeholder="Nama Dokter" class="w-full border p-2 rounded">
                                    <input type="text" x-model="formData.diagnosa" placeholder="Diagnosa Sekarang" class="w-full border p-2 rounded">
                                </div>
                                <div class="mt-4 flex space-x-6">
                                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" x-model="formData.injeksi"> <span>Injeksi</span></label>
                                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" x-model="formData.urine"> <span>Urine Test</span></label>
                                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" x-model="formData.fiksasi"> <span>Fiksasi</span></label>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template x-if="modalTarget === 'ttv'">
                        <div class="space-y-4">
                            <label class="text-xs font-bold text-slate-500">PILIH PASIEN</label>
                            <select x-model="formData.pasienId" class="w-full border p-2 rounded">
                                <option value="">- Pilih -</option>
                                <template x-for="p in pasienList"><option :value="p.id" x-text="p.nama"></option></template>
                            </select>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" x-model="formData.tensi" placeholder="Tensi (e.g 120/80)" class="border p-2 rounded">
                                <input type="text" x-model="formData.sat" placeholder="Saturasi" class="border p-2 rounded">
                                <input type="text" x-model="formData.rr" placeholder="RR" class="border p-2 rounded">
                                <input type="text" x-model="formData.gds" placeholder="GDS (Keterangan)" class="border p-2 rounded col-span-2">
                            </div>
                        </div>
                    </template>

                    <template x-if="modalTarget === 'visit'">
                        <div class="space-y-4">
                            <select x-model="formData.pasienId" class="w-full border p-2 rounded">
                                <option value="">- Pilih Pasien -</option>
                                <template x-for="p in pasienList"><option :value="p.id" x-text="p.nama"></option></template>
                            </select>
                            <label class="text-xs font-bold text-slate-500">UPLOAD FOTO</label>
                            <input type="file" @change="handleFileUpload" class="w-full text-xs">
                            <textarea x-model="formData.keterangan" placeholder="Keterangan dokter..." class="w-full border p-2 rounded h-32"></textarea>
                        </div>
                    </template>

                    <template x-if="modalTarget === 'crisis'">
                        <div class="space-y-4">
                            <select x-model="formData.pasienId" class="w-full border p-2 rounded">
                                <option value="">- Pilih Pasien -</option>
                                <template x-for="p in pasienList"><option :value="p.id" x-text="p.nama"></option></template>
                            </select>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="text-[10px] font-bold">BIO (0-25)</label><input type="number" x-model="formData.bio" class="w-full border p-2 rounded"></div>
                                <div><label class="text-[10px] font-bold">PSY (0-25)</label><input type="number" x-model="formData.psy" class="w-full border p-2 rounded"></div>
                                <div><label class="text-[10px] font-bold">SOC (0-25)</label><input type="number" x-model="formData.soc" class="w-full border p-2 rounded"></div>
                                <div><label class="text-[10px] font-bold">SPI (0-25)</label><input type="number" x-model="formData.spi" class="w-full border p-2 rounded"></div>
                            </div>
                            <input type="text" x-model="formData.change" placeholder="Perubahan Selama 7 Hari Detox" class="w-full border p-2 rounded">
                            <textarea x-model="formData.discharge" placeholder="Evaluasi Score (Discharge)" class="w-full border p-2 rounded"></textarea>
                        </div>
                    </template>

                    <template x-if="modalTarget === 'medlog'">
                        <div class="space-y-4">
                            <p class="font-bold text-blue-600" x-text="'Pasien: ' + formData.nama"></p>
                            <input type="text" x-model="formData.obat" placeholder="Nama Obat" class="w-full border p-2 rounded">
                            <input type="number" x-model="formData.jumlah" placeholder="Jumlah Tablet Digunakan" class="w-full border p-2 rounded">
                            <input type="text" x-model="formData.pj" placeholder="Nama Penanggung Jawab (PJ)" class="w-full border p-2 rounded">
                            <p class="text-[10px] text-amber-600">* Stok akan berkurang otomatis setelah disimpan</p>
                        </div>
                    </template>
                    
                    <template x-if="modalTarget === 'program'">
                        <div class="space-y-4">
                            <select x-model="formData.pasienId" class="w-full border p-2 rounded">
                                <template x-for="p in pasienList"><option :value="p.id" x-text="p.nama"></option></template>
                            </select>
                            <select x-model="formData.paket" class="w-full border p-2 rounded">
                                <option value="Reguler">Reguler</option>
                                <option value="Ekslusif">Ekslusif</option>
                            </select>
                            <select x-model="formData.durasi" class="w-full border p-2 rounded">
                                <option value="7 Hari (Detox)">7 Hari (Detox)</option>
                                <option value="14 Hari">14 Hari</option>
                                <option value="30 Hari">30 Hari</option>
                                <option value="60 Hari">60 Hari</option>
                            </select>
                        </div>
                    </template>

                    <template x-if="modalTarget === 'terapi'">
                        <div class="space-y-4">
                            <select x-model="formData.pasienId" class="w-full border p-2 rounded">
                                <template x-for="p in pasienList"><option :value="p.id" x-text="p.nama"></option></template>
                            </select>
                            <textarea x-model="formData.keterangan" placeholder="Rencana Terapi..." class="w-full border p-2 rounded h-32"></textarea>
                        </div>
                    </template>

                </div>
                <div class="p-6 border-t bg-slate-50 flex justify-end space-x-3">
                    <button @click="modalOpen = false" class="px-6 py-2 border font-bold rounded-lg text-slate-400">Batal</button>
                    <button @click="saveData()" class="px-10 py-2 bg-blue-600 text-white font-bold rounded-lg shadow-lg">SIMPAN DATA</button>
                </div>
            </div>
        </div>
    </template>

    <script>
        function mmrcApp() {
            return {
                isLoggedIn: false,
                loginForm: { user: '', pass: '' },
                errorMsg: '',
                activeMenu: 'dashboard',
                searchQuery: '',
                modalOpen: false,
                modalTarget: '',
                formData: {},
                pasienList: [],
                ttvList: [],
                visitList: [],
                crisisList: [],
                programList: [],
                terapiList: [],
                menus: [
                    { id: 'dashboard', label: 'Dashboard' },
                    { id: 'ttv', label: 'TTV & GDS' },
                    { id: 'visit', label: 'Visit Dokter' },
                    { id: 'crisis', label: 'Pasien Crisis' },
                    { id: 'program', label: 'Rencana Program' },
                    { id: 'terapi', label: 'Rencana Terapi' },
                ],
                
                init() {
                    const saved = localStorage.getItem('mmrc_data');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.pasienList = data.pasien || [];
                        this.ttvList = data.ttv || [];
                        this.visitList = data.visit || [];
                        this.crisisList = data.crisis || [];
                        this.programList = data.program || [];
                        this.terapiList = data.terapi || [];
                    }
                },

                doLogin() {
                    if (this.loginForm.user === 'OPERASIONAL.MMRC' && this.loginForm.pass === 'MADANI1999') {
                        this.isLoggedIn = true;
                        this.errorMsg = '';
                    } else {
                        this.errorMsg = 'Username atau Password salah!';
                    }
                },

                get activeMenuLabel() {
                    return this.menus.find(m => m.id === this.activeMenu).label;
                },

                openModal(target) {
                    this.modalTarget = target;
                    this.formData = target === 'pasien' ? { intervensi: {}, stokObat: { awal: 0, terpakai: 0, akhir: 0 }, logs: [] } : {};
                    this.modalOpen = true;
                },

                openMedLogModal(pasien) {
                    this.modalTarget = 'medlog';
                    this.formData = { pasienId: pasien.id, nama: pasien.nama, obat: '', jumlah: 1, pj: '' };
                    this.modalOpen = true;
                },

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onloadend = () => { this.formData.foto = reader.result; };
                    if (file) reader.readAsDataURL(file);
                },

                saveData() {
                    const now = new Date();
                    const timestamp = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()} ${now.getHours()}:${now.getMinutes()}`;

                    if (this.modalTarget === 'pasien') {
                        this.formData.id = this.formData.id || Date.now();
                        this.formData.waktu = timestamp;
                        this.formData.stokObat = { awal: this.formData.stokAwal, terpakai: 0, akhir: this.formData.stokAwal };
                        this.formData.logs = this.formData.logs || [];
                        const idx = this.pasienList.findIndex(p => p.id === this.formData.id);
                        if (idx > -1) this.pasienList[idx] = this.formData;
                        else this.pasienList.push(this.formData);
                    } else if (this.modalTarget === 'ttv') {
                        this.ttvList.push({...this.formData, id: Date.now(), waktu: timestamp});
                    } else if (this.modalTarget === 'visit') {
                        this.visitList.push({...this.formData, id: Date.now(), waktu: timestamp});
                    } else if (this.modalTarget === 'crisis') {
                        this.crisisList.push({...this.formData, id: Date.now(), waktu: timestamp});
                    } else if (this.modalTarget === 'program') {
                        this.programList.push({...this.formData, id: Date.now()});
                    } else if (this.modalTarget === 'terapi') {
                        this.terapiList.push({...this.formData, id: Date.now()});
                    } else if (this.modalTarget === 'medlog') {
                        const p = this.pasienList.find(px => px.id === this.formData.pasienId);
                        if (p) {
                            p.stokObat.terpakai = parseInt(p.stokObat.terpakai) + parseInt(this.formData.jumlah);
                            p.stokObat.akhir = p.stokObat.awal - p.stokObat.terpakai;
                            p.logs.unshift({ id: Date.now(), waktu: timestamp, obat: this.formData.obat, pj: this.formData.pj });
                        }
                    }

                    this.persist();
                    this.modalOpen = false;
                },

                persist() {
                    localStorage.setItem('mmrc_data', JSON.stringify({
                        pasien: this.pasienList,
                        ttv: this.ttvList,
                        visit: this.visitList,
                        crisis: this.crisisList,
                        program: this.programList,
                        terapi: this.terapiList
                    }));
                },

                // Filters
                get filteredPasien() {
                    return this.pasienList.filter(p => p.nama.toLowerCase().includes(this.searchQuery.toLowerCase()));
                },
                get filteredTTV() { return this.ttvList.filter(t => this.getPasienName(t.pasienId).toLowerCase().includes(this.searchQuery.toLowerCase())); },
                get filteredVisit() { return this.visitList.filter(v => this.getPasienName(v.pasienId).toLowerCase().includes(this.searchQuery.toLowerCase())); },
                get filteredCrisis() { return this.crisisList.filter(c => this.getPasienName(c.pasienId).toLowerCase().includes(this.searchQuery.toLowerCase())); },
                get filteredPlans() {
                    const list = this.activeMenu === 'program' ? this.programList : this.terapiList;
                    return list.filter(p => this.getPasienName(p.pasienId).toLowerCase().includes(this.searchQuery.toLowerCase()));
                },

                getPasienName(id) {
                    const p = this.pasienList.find(px => px.id == id);
                    return p ? p.nama : 'Unknown';
                },

                // Deletions
                deletePasien(id) { if(confirm('Hapus pasien?')) { this.pasienList = this.pasienList.filter(p => p.id !== id); this.persist(); }},
                deleteTTV(id) { this.ttvList = this.ttvList.filter(t => t.id !== id); this.persist(); },
                deleteVisit(id) { this.visitList = this.visitList.filter(v => v.id !== id); this.persist(); },
                deleteCrisis(id) { this.crisisList = this.crisisList.filter(c => c.id !== id); this.persist(); },
                deletePlan(id) { 
                    if (this.activeMenu === 'program') this.programList = this.programList.filter(p => p.id !== id);
                    else this.terapiList = this.terapiList.filter(p => p.id !== id);
                    this.persist();
                },

                editPasien(pasien) {
                    this.formData = JSON.parse(JSON.stringify(pasien));
                    this.modalTarget = 'pasien';
                    this.modalOpen = true;
                },

                renderChart(data) {
                    const ctx = document.getElementById('bpssRadarChart').getContext('2d');
                    if (window.myRadarChart) window.myRadarChart.destroy();
                    
                    window.myRadarChart = new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: ['Biological', 'Psychological', 'Social', 'Spiritual'],
                            datasets: [{
                                label: this.getPasienName(data.pasienId),
                                data: [data.bio, data.psy, data.soc, data.spi],
                                fill: true,
                                backgroundColor: 'rgba(59, 130, 246, 0.2)',
                                borderColor: 'rgb(59, 130, 246)',
                                pointBackgroundColor: 'rgb(59, 130, 246)',
                            }]
                        },
                        options: {
                            scales: { r: { min: 0, max: 25, ticks: { stepSize: 5 } } }
                        }
                    });
                },

                resetSearch() { this.searchQuery = ''; },

                exportToExcel() {
                    const data = this.pasienList.map(p => ({
                        Nama: p.nama, Masuk: p.waktu, Usia: p.usia, Alamat: p.alamat, Stok_Akhir: p.stokObat.akhir, Dokter: p.dokter, Diagnosa: p.diagnosa
                    }));
                    const ws = XLSX.utils.json_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Data Pasien MMRC");
                    XLSX.writeFile(wb, "MMRC_Management_Export.xlsx");
                },

                exportToWord() {
                    alert("Fitur Word Export memerlukan template khusus. Gunakan Print (Ctrl+P) dan Save as PDF untuk hasil rapi secara instan.");
                }
            }
        }
    </script>
</body>
</html>
