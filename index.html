<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMHC PRO V4.4 - Full CRUD System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .input-medis { border: 1.5px solid #E2E8F0; border-radius: 1rem; padding: 0.8rem 1rem; font-weight: 600; width: 100%; background: #F8FAFC; outline: none; transition: 0.2s; }
        .input-medis:focus { border-color: #4F46E5; background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .glass-header { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); }
        .critical-alert { animation: pulse-red 1.5s infinite; color: #ef4444; font-weight: 800; }
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-900 min-h-screen">

    <div id="login-page" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-10 text-center shadow-2xl">
            <h1 class="text-3xl font-black text-indigo-600 mb-2 italic">MMHC PRO <span class="text-slate-800">V4.4</span></h1>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mb-8">Clinical Database Management</p>
            <form id="login-form" class="space-y-4">
                <input type="text" id="user-input" placeholder="ID Admin" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold" required>
                <input type="password" id="pass-input" placeholder="Passcode" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold" required>
                <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl">MASUK SISTEM</button>
            </form>
        </div>
    </div>

    <div id="main-content" class="hidden flex flex-col min-h-screen">
        <header class="glass-header text-white p-5 sticky top-0 z-40 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-hospital-user text-indigo-400 text-xl"></i>
                <h1 class="text-lg font-black tracking-tighter uppercase italic">MMHC <span class="text-indigo-400">DATABASE</span></h1>
            </div>
            <button onclick="location.reload()" class="bg-red-500/20 px-4 py-2 rounded-xl text-xs font-black">LOGOUT</button>
        </header>

        <main class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full">
            <div id="view-list" class="space-y-6">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-pasien" oninput="renderPasien()" placeholder="Cari Nama Pasien / Diagnosa..." class="w-full bg-white p-5 pl-14 rounded-3xl shadow-sm outline-none font-bold">
                    </div>
                    <button onclick="openModalPasien()" class="bg-indigo-600 text-white px-8 py-5 rounded-3xl font-black shadow-lg">+ REGISTER PASIEN</button>
                </div>
                <div id="list-pasien" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div id="view-detail" class="hidden space-y-6">
                <div class="flex flex-wrap justify-between items-center bg-white p-4 rounded-3xl shadow-sm gap-4">
                    <button onclick="closeDetail()" class="text-slate-600 font-black flex items-center gap-2 px-4"><i class="fas fa-arrow-left"></i> KEMBALI</button>
                    <div class="flex gap-2">
                        <button id="btn-edit-pasien" class="bg-amber-500 text-white px-4 py-2 rounded-xl text-[10px] font-black italic">EDIT BIODATA</button>
                        <button id="btn-hapus-pasien" class="bg-red-600 text-white px-4 py-2 rounded-xl text-[10px] font-black italic">HAPUS PASIEN</button>
                    </div>
                </div>
                <div id="detail-render"></div>
            </div>
        </main>
    </div>

    <div id="modal-pasien" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] w-full max-w-6xl p-8 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <h3 id="modal-title" class="text-2xl font-black mb-8 border-l-8 border-indigo-600 pl-4 uppercase italic italic">Form Biodata Pasien</h3>
            <form id="form-pasien" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <input type="hidden" id="p-id">
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-indigo-500 uppercase border-b pb-2 italic">I. Identitas</p>
                    <input type="text" id="p-nama" placeholder="Nama Lengkap" class="input-medis" required>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="p-ttl" placeholder="TTL" class="input-medis">
                        <input type="number" id="p-umur" placeholder="Usia" class="input-medis">
                    </div>
                    <select id="p-jk" class="input-medis"><option>Laki-laki</option><option>Perempuan</option></select>
                    <input type="text" id="p-pekerjaan" placeholder="Pekerjaan" class="input-medis">
                    <textarea id="p-alamat" placeholder="Alamat" class="input-medis h-24"></textarea>
                </div>
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-red-500 uppercase border-b pb-2 italic">II. Klinis</p>
                    <input type="text" id="p-diagnosa" placeholder="Diagnosa" class="input-medis font-black italic">
                    <textarea id="p-riwayat" placeholder="Riwayat Penyakit" class="input-medis h-24"></textarea>
                    <textarea id="p-planning" placeholder="Planning Dokter" class="input-medis h-24"></textarea>
                </div>
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-orange-500 uppercase border-b pb-2 italic">III. Injeksi & Foto</p>
                    <input type="text" id="p-injeksi" placeholder="Input Injeksi" class="input-medis">
                    <input type="text" id="i-urine" placeholder="Input Urine" class="input-medis">
                    <textarea id="p-resep" placeholder="Resep Obat" class="input-medis h-24"></textarea>
                    <input type="file" id="p-foto" class="text-xs">
                    <input type="hidden" id="p-foto-base64">
                    <div class="flex gap-2 pt-4">
                        <button type="button" onclick="closeModals()" class="flex-1 bg-slate-100 py-4 rounded-2xl font-black">BATAL</button>
                        <button type="submit" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-black">SIMPAN DATA</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-ttv" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 id="ttv-title" class="text-xl font-black mb-6 uppercase text-indigo-600 italic">Input TTV & GDS</h3>
            <form id="form-ttv" class="space-y-4">
                <input type="hidden" id="v-id">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="v-td" placeholder="TD" class="input-medis">
                    <input type="text" id="v-suhu" placeholder="Suhu" class="input-medis">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="v-bb" placeholder="BB kg" class="input-medis">
                    <input type="number" id="v-tb" placeholder="TB cm" class="input-medis">
                </div>
                <input type="text" id="v-gds" placeholder="Keterangan GDS (Contoh: 150 mg/dL)" class="input-medis bg-orange-50">
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="v-tgl" class="input-medis text-xs">
                    <input type="time" id="v-jam" class="input-medis text-xs">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black">SIMPAN</button>
            </form>
        </div>
    </div>

    <div id="modal-obat" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 id="obat-title" class="text-xl font-black mb-6 uppercase text-indigo-600 italic">Input/Edit Stok</h3>
            <form id="form-obat" class="space-y-4">
                <input type="hidden" id="o-id">
                <input type="text" id="o-nama" placeholder="Nama Obat" class="input-medis" required>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="o-stok-awal" placeholder="Stok Awal" class="input-medis">
                    <input type="number" id="o-stok-pakai" placeholder="Stok Digunakan" class="input-medis bg-slate-100" readonly>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black">SIMPAN STOK</button>
            </form>
        </div>
    </div>

    <div id="modal-penggunaan" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 id="use-title" class="text-xl font-black mb-6 uppercase text-emerald-600 italic">Log Penggunaan</h3>
            <form id="form-penggunaan" class="space-y-4">
                <input type="hidden" id="u-id">
                <input type="hidden" id="u-old-jml" value="0">
                <select id="u-nama" class="input-medis" required><option value="">Pilih Obat...</option></select>
                <input type="number" id="u-jml" placeholder="Jumlah Digunakan" class="input-medis" required>
                <textarea id="u-ket" placeholder="Keterangan..." class="input-medis h-24"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="u-tgl" class="input-medis text-xs">
                    <input type="time" id="u-jam" class="input-medis text-xs">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-black">SIMPAN LOG</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdzWrKOBqrcu6talld7MN-2flHNibEWnE",
            authDomain: "mmrc-stock.firebaseapp.com",
            projectId: "mmrc-stock",
            storageBucket: "mmrc-stock.firebasestorage.app",
            messagingSenderId: "722563453659",
            appId: "1:722563453659:web:b9f867367ecadb7a1df2fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let PASIEN = [], OBAT = [], TTV = [], USE = [], SELECTED_ID = null;

        // AUTH
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            if(document.getElementById('user-input').value === "MMRC.Stock1999" && document.getElementById('pass-input').value === "Madani1999") {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                startSync();
            }
        };

        function startSync() {
            onSnapshot(collection(db, "pasien_v44"), s => { PASIEN = s.docs.map(d => ({id:d.id, ...d.data()})); renderPasien(); if(SELECTED_ID) renderDetail(); });
            onSnapshot(collection(db, "obat_v44"), s => { OBAT = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) renderDetail(); });
            onSnapshot(collection(db, "ttv_v44"), s => { TTV = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) renderDetail(); });
            onSnapshot(collection(db, "penggunaan_v44"), s => { USE = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) renderDetail(); });
        }

        // BIODATA CRUD
        window.openModalPasien = (id = null) => {
            const f = document.getElementById('form-pasien'); f.reset();
            document.getElementById('p-id').value = id || '';
            document.getElementById('modal-title').innerText = id ? "Edit Biodata" : "Register Pasien Baru";
            if(id) {
                const p = PASIEN.find(x => x.id === id);
                Object.keys(p).forEach(k => { if(document.getElementById(`p-${k}`)) document.getElementById(`p-${k}`).value = p[k]; });
            }
            document.getElementById('modal-pasien').classList.remove('hidden');
        };

        document.getElementById('p-foto').onchange = (e) => {
            const r = new FileReader(); r.onload = () => document.getElementById('p-foto-base64').value = r.result;
            if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
        };

        document.getElementById('form-pasien').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = {
                nama: document.getElementById('p-nama').value, ttl: document.getElementById('p-ttl').value,
                umur: document.getElementById('p-umur').value, jk: document.getElementById('p-jk').value,
                pekerjaan: document.getElementById('p-pekerjaan').value, alamat: document.getElementById('p-alamat').value,
                riwayat: document.getElementById('p-riwayat').value, planning: document.getElementById('p-planning').value,
                diagnosa: document.getElementById('p-diagnosa').value, injeksi: document.getElementById('p-injeksi').value,
                urine: document.getElementById('i-urine').value, resep: document.getElementById('p-resep').value,
                foto: document.getElementById('p-foto-base64').value || (id ? PASIEN.find(x => x.id === id).foto : '')
            };
            id ? await updateDoc(doc(db, "pasien_v44", id), data) : await addDoc(collection(db, "pasien_v44"), data);
            closeModals();
        };

        window.renderPasien = () => {
            const s = document.getElementById('search-pasien').value.toLowerCase();
            document.getElementById('list-pasien').innerHTML = PASIEN.filter(p => p.nama.toLowerCase().includes(s))
            .map(p => `
                <div onclick="openDetail('${p.id}')" class="bg-white p-6 rounded-[2.5rem] shadow-sm hover:shadow-xl cursor-pointer flex gap-4 items-center border border-transparent hover:border-indigo-600 transition-all">
                    <img src="${p.foto}" class="w-16 h-16 rounded-2xl object-cover" onerror="this.src='https://ui-avatars.com/api/?name=${p.nama}'">
                    <div><h4 class="font-black">${p.nama}</h4><p class="text-[9px] font-black text-indigo-500 uppercase italic">${p.diagnosa || 'Diagnosa Belum Ada'}</p></div>
                </div>
            `).join('');
        };

        window.openDetail = (id) => { 
            SELECTED_ID = id; 
            document.getElementById('view-list').classList.add('hidden'); 
            document.getElementById('view-detail').classList.remove('hidden'); 
            document.getElementById('btn-edit-pasien').onclick = () => openModalPasien(id);
            document.getElementById('btn-hapus-pasien').onclick = () => deleteData('pasien_v44', id, true);
            renderDetail(); 
        };
        window.closeDetail = () => { SELECTED_ID = null; document.getElementById('view-list').classList.remove('hidden'); document.getElementById('view-detail').classList.add('hidden'); };

        function renderDetail() {
            const p = PASIEN.find(x => x.id === SELECTED_ID);
            if(!p) return;

            const qTTV = (document.getElementById('sh-ttv')?.value || "").toLowerCase();
            const qStok = (document.getElementById('sh-stok')?.value || "").toLowerCase();
            const qUse = (document.getElementById('sh-use')?.value || "").toLowerCase();

            const ttvP = TTV.filter(t => t.pasienId === SELECTED_ID && t.tgl.includes(qTTV)).reverse();
            const obatP = OBAT.filter(o => o.pasienId === SELECTED_ID && o.nama.toLowerCase().includes(qStok));
            const useP = USE.filter(u => u.pasienId === SELECTED_ID && u.nama.toLowerCase().includes(qUse)).reverse();

            document.getElementById('detail-render').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white p-8 rounded-[3rem] shadow-sm flex flex-col md:flex-row gap-8">
                            <img src="${p.foto}" class="w-32 h-32 rounded-[2rem] object-cover">
                            <div class="flex-1">
                                <h2 class="text-3xl font-black">${p.nama}</h2>
                                <p class="text-xs font-black text-indigo-500 mb-4 italic uppercase">${p.pekerjaan} | ${p.umur} TH</p>
                                <div class="grid grid-cols-2 gap-2 text-[10px] font-bold border-t pt-4">
                                    <p><span class="text-slate-400">ALAMAT:</span> ${p.alamat}</p>
                                    <p><span class="text-slate-400">DIAGNOSA:</span> ${p.diagnosa}</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-8 rounded-[3rem] shadow-sm">
                            <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
                                <h5 class="text-[11px] font-black uppercase text-emerald-600 italic">Penggunaan Obat</h5>
                                <div class="flex gap-2">
                                    <input type="text" id="sh-use" oninput="renderDetail()" placeholder="Cari Log..." class="text-[10px] p-2 bg-slate-50 rounded-lg outline-none border">
                                    <button onclick="openModalPenggunaan()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-[10px] font-black">+ LOG</button>
                                </div>
                            </div>
                            <div class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
                                ${useP.map(u => `
                                    <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center group">
                                        <div><p class="text-xs font-black">${u.nama} (-${u.jml})</p><p class="text-[8px] text-slate-400">${u.tgl} | ${u.jam}</p></div>
                                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                            <button onclick="openModalPenggunaan('${u.id}')" class="text-blue-500 text-xs"><i class="fas fa-edit"></i></button>
                                            <button onclick="deleteData('penggunaan_v44','${u.id}')" class="text-red-400 text-xs"><i class="fas fa-trash"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-white p-8 rounded-[3rem] shadow-sm">
                            <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
                                <h5 class="text-[11px] font-black text-slate-400 uppercase italic">Stok Obat</h5>
                                <button onclick="openModalObat()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[10px] font-black">+ STOK</button>
                            </div>
                            <input type="text" id="sh-stok" oninput="renderDetail()" placeholder="Cari Obat..." class="w-full text-[10px] p-2 bg-slate-50 rounded-lg mb-4 outline-none border">
                            <div class="space-y-3">
                                ${obatP.map(o => {
                                    const sisa = o.stokAwal - (o.stokPakai || 0);
                                    return `
                                    <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center group">
                                        <div>
                                            <p class="text-xs font-black">${o.nama}</p>
                                            <p class="text-[8px] font-bold text-slate-400">Sisa: ${sisa}</p>
                                            ${sisa <= 5 ? '<p class="critical-alert text-[7px]">⚠️ KRITIS</p>' : ''}
                                        </div>
                                        <div class="flex gap-2 opacity-0 group-hover:opacity-100">
                                            <button onclick="openModalObat('${o.id}')" class="text-blue-500 text-xs"><i class="fas fa-edit"></i></button>
                                            <button onclick="deleteData('obat_v44','${o.id}')" class="text-red-400 text-xs"><i class="fas fa-trash"></i></button>
                                        </div>
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>

                        <div class="bg-white p-8 rounded-[3rem] shadow-sm">
                             <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
                                <h5 class="text-[11px] font-black text-slate-400 uppercase italic">TTV GDS Log</h5>
                                <button onclick="openModalTTV()" class="bg-red-500 text-white px-4 py-2 rounded-xl text-[10px] font-black">+ TTV</button>
                            </div>
                            <input type="text" id="sh-ttv" oninput="renderDetail()" placeholder="Cari Tanggal..." class="w-full text-[10px] p-2 bg-slate-50 rounded-lg mb-4 outline-none border">
                            <div class="space-y-4">
                                ${ttvP.map(t => `
                                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm relative group">
                                        <p class="text-[9px] font-black text-slate-400">${t.tgl} | ${t.jam}</p>
                                        <p class="text-[10px] font-black text-orange-600">GDS: ${t.gds}</p>
                                        <p class="text-[8px] font-bold">BB: ${t.bb}kg | TB: ${t.tb}cm</p>
                                        <div class="absolute top-2 right-2 flex gap-2 opacity-0 group-hover:opacity-100">
                                            <button onclick="openModalTTV('${t.id}')" class="text-blue-500 text-xs"><i class="fas fa-edit"></i></button>
                                            <button onclick="deleteData('ttv_v44','${t.id}')" class="text-red-400 text-xs"><i class="fas fa-trash"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // TTV CRUD
        window.openModalTTV = (id = null) => {
            const f = document.getElementById('form-ttv'); f.reset();
            document.getElementById('v-id').value = id || '';
            document.getElementById('ttv-title').innerText = id ? "Edit TTV & GDS" : "Input TTV & GDS";
            if(id) {
                const t = TTV.find(x => x.id === id);
                Object.keys(t).forEach(k => { if(document.getElementById(`v-${k}`)) document.getElementById(`v-${k}`).value = t[k]; });
            } else {
                document.getElementById('v-tgl').value = new Date().toISOString().split('T')[0];
            }
            document.getElementById('modal-ttv').classList.remove('hidden');
        };

        document.getElementById('form-ttv').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('v-id').value;
            const data = {
                pasienId: SELECTED_ID, td: document.getElementById('v-td').value, suhu: document.getElementById('v-suhu').value,
                bb: document.getElementById('v-bb').value, tb: document.getElementById('v-tb').value,
                gds: document.getElementById('v-gds').value, tgl: document.getElementById('v-tgl').value, jam: document.getElementById('v-jam').value
            };
            id ? await updateDoc(doc(db, "ttv_v44", id), data) : await addDoc(collection(db, "ttv_v44"), data);
            closeModals();
        };

        // OBAT CRUD
        window.openModalObat = (id = null) => {
            const f = document.getElementById('form-obat'); f.reset();
            document.getElementById('o-id').value = id || '';
            document.getElementById('obat-title').innerText = id ? "Edit Master Stok" : "Input Master Stok";
            if(id) {
                const o = OBAT.find(x => x.id === id);
                document.getElementById('o-nama').value = o.nama;
                document.getElementById('o-stok-awal').value = o.stokAwal;
                document.getElementById('o-stok-pakai').value = o.stokPakai || 0;
            }
            document.getElementById('modal-obat').classList.remove('hidden');
        };

        document.getElementById('form-obat').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('o-id').value;
            const data = {
                pasienId: SELECTED_ID, nama: document.getElementById('o-nama').value,
                stokAwal: parseInt(document.getElementById('o-stok-awal').value),
                stokPakai: parseInt(document.getElementById('o-stok-pakai').value) || 0
            };
            id ? await updateDoc(doc(db, "obat_v44", id), data) : await addDoc(collection(db, "obat_v44"), data);
            closeModals();
        };

        // PENGGUNAAN CRUD
        window.openModalPenggunaan = (id = null) => {
            const f = document.getElementById('form-penggunaan'); f.reset();
            const sel = document.getElementById('u-nama'); sel.innerHTML = '<option value="">Pilih Obat...</option>';
            OBAT.filter(o => o.pasienId === SELECTED_ID).forEach(o => { sel.innerHTML += `<option value="${o.id}">${o.nama}</option>`; });
            
            document.getElementById('u-id').value = id || '';
            document.getElementById('use-title').innerText = id ? "Edit Log Penggunaan" : "Input Log Penggunaan";
            
            if(id) {
                const u = USE.find(x => x.id === id);
                document.getElementById('u-nama').value = OBAT.find(o => o.nama === u.nama && o.pasienId === SELECTED_ID)?.id || "";
                document.getElementById('u-jml').value = u.jml;
                document.getElementById('u-old-jml').value = u.jml;
                document.getElementById('u-ket').value = u.ket;
                document.getElementById('u-tgl').value = u.tgl;
                document.getElementById('u-jam').value = u.jam;
            } else {
                document.getElementById('u-tgl').value = new Date().toISOString().split('T')[0];
            }
            document.getElementById('modal-penggunaan').classList.remove('hidden');
        };

        document.getElementById('form-penggunaan').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('u-id').value;
            const obatId = document.getElementById('u-nama').value;
            const jml = parseInt(document.getElementById('u-jml').value);
            const oldJml = parseInt(document.getElementById('u-old-jml').value);
            const oRef = OBAT.find(x => x.id === obatId);

            if(id) {
                // Edit: Hitung selisih stok
                const diff = jml - oldJml;
                await updateDoc(doc(db, "obat_v44", obatId), { stokPakai: (oRef.stokPakai || 0) + diff });
                await updateDoc(doc(db, "penggunaan_v44", id), {
                    nama: oRef.nama, jml: jml, ket: document.getElementById('u-ket').value,
                    tgl: document.getElementById('u-tgl').value, jam: document.getElementById('u-jam').value
                });
            } else {
                // Input Baru
                await updateDoc(doc(db, "obat_v44", obatId), { stokPakai: (oRef.stokPakai || 0) + jml });
                await addDoc(collection(db, "penggunaan_v44"), {
                    pasienId: SELECTED_ID, nama: oRef.nama, jml: jml, ket: document.getElementById('u-ket').value,
                    tgl: document.getElementById('u-tgl').value, jam: document.getElementById('u-jam').value
                });
            }
            closeModals();
        };

        window.deleteData = async (col, id, isPasien = false) => {
            if(confirm('Hapus data ini secara permanen?')) {
                // Logika khusus hapus log penggunaan: kembalikan stok
                if(col === 'penggunaan_v44') {
                    const u = USE.find(x => x.id === id);
                    const o = OBAT.find(x => x.nama === u.nama && x.pasienId === SELECTED_ID);
                    if(o) await updateDoc(doc(db, "obat_v44", o.id), { stokPakai: Math.max(0, o.stokPakai - u.jml) });
                }
                await deleteDoc(doc(db, col, id));
                if(isPasien) closeDetail();
            }
        };

        window.closeModals = () => document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));

    </script>
</body>
</html>
