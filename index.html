<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50">

    <div id="auth-layer" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-teal-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-hand-holding-medical text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">MMRC OPERASIONAL</h1>
                <p class="text-sm text-slate-500">Madani Mental Recovery Center</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="login-user" class="input-field" placeholder="Username">
                <input type="password" id="login-pass" class="input-field" placeholder="Password">
                <button onclick="app.login()" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold hover:bg-teal-700 transition">LOGIN SYSTEM</button>
            </div>
        </div>
    </div>

    <div id="app-layer" class="hidden h-screen flex overflow-hidden">
        <aside class="w-64 bg-white border-r flex flex-col shadow-lg">
            <div class="p-6 border-b font-bold text-teal-700 text-xl tracking-tight">MMRC SYSTEM</div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-1">
                <button onclick="app.nav('dashboard')" class="nav-btn active" id="btn-dashboard"><i class="fas fa-user-injured w-6"></i> Dashboard</button>
                <button onclick="app.nav('medicine')" class="nav-btn" id="btn-medicine"><i class="fas fa-pills w-6"></i> Medicine</button>
                <button onclick="app.nav('ttv')" class="nav-btn" id="btn-ttv"><i class="fas fa-heartbeat w-6"></i> TTV & GDS</button>
                <button onclick="app.nav('visit')" class="nav-btn" id="btn-visit"><i class="fas fa-user-md w-6"></i> Visit Dokter</button>
                <button onclick="app.nav('crisis')" class="nav-btn" id="btn-crisis"><i class="fas fa-exclamation-triangle w-6"></i> Pasien Crisis</button>
                <button onclick="app.nav('program')" class="nav-btn" id="btn-program"><i class="fas fa-calendar-alt w-6"></i> Rencana Program</button>
                <button onclick="app.nav('therapy')" class="nav-btn" id="btn-therapy"><i class="fas fa-notes-medical w-6"></i> Rencana Terapi</button>
            </nav>
            <div class="p-4 border-t">
                <button onclick="location.reload()" class="w-full text-left p-2 text-red-500 text-sm font-bold"><i class="fas fa-sign-out-alt mr-2"></i> LOGOUT</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white border-b flex items-center justify-between px-8">
                <h2 id="page-title" class="text-lg font-bold text-slate-700 uppercase tracking-wider">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <input type="text" id="global-search" onkeyup="app.search()" placeholder="Cari Pasien..." class="border rounded-full px-4 py-1 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
                    <button onclick="app.exportAllExcel()" class="bg-emerald-600 text-white px-4 py-1 rounded-full text-xs font-bold hover:bg-emerald-700">
                        <i class="fas fa-file-excel mr-1"></i> EXPORT EXCEL
                    </button>
                </div>
            </header>
            <div id="main-content" class="p-8 overflow-y-auto flex-1">
                </div>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-5xl max-h-[90vh] rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
                <h3 id="modal-title" class="font-bold text-teal-800">Form Input</h3>
                <button onclick="app.closeModal()" class="text-slate-400 hover:text-red-500 text-2xl">&times;</button>
            </div>
            <div id="modal-body" class="p-8 overflow-y-auto"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
