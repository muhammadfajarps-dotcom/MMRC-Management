<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Pro - Management Stock Medicine client Health Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .nav-active { @apply bg-blue-600 text-white shadow-lg shadow-blue-200; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { @apply bg-gray-200 rounded-full; }
        .page-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen">

    <div id="login-page" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl text-center">
            <div class="w-20 h-20 bg-blue-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-200">
                <i class="fas fa-hospital-symbol text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 mb-2">MMHC <span class="text-blue-600">STOCK</span></h1>
            <p class="text-slate-400 text-sm mb-8 font-medium">Monitoring Persediaan Obat Madani</p>
            <form id="login-form" class="space-y-4 text-left">
                <input type="text" id="user-input" placeholder="Username" class="w-full bg-slate-50 border-2 border-slate-50 p-4 rounded-2xl outline-none focus:border-blue-500 transition-all font-semibold" required>
                <input type="password" id="pass-input" placeholder="Password" class="w-full bg-slate-50 border-2 border-slate-50 p-4 rounded-2xl outline-none focus:border-blue-500 transition-all font-semibold" required>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-100 hover:bg-blue-700 transition-all mt-4">Masuk Sistem</button>
            </form>
        </div>
    </div>

    <div id="main-content" class="hidden flex flex-col md:flex-row min-h-screen">
        
        <aside class="w-full md:w-72 bg-white border-r border-slate-100 flex flex-col z-20">
            <div class="p-8">
                <h1 class="text-xl font-black text-slate-800 tracking-tight flex items-center gap-2">
                    <span class="text-blue-600"><i class="fas fa-shield-virus"></i></span> MMHC PRO
                </h1>
            </div>
            
            <nav class="flex-1 px-4 space-y-2">
                <button onclick="showPage('dashboard')" class="nav-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-bold transition-all nav-active">
                    <i class="fas fa-chart-pie"></i> Monitoring
                </button>
                <button onclick="showPage('obat')" class="nav-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-bold transition-all">
                    <i class="fas fa-pills"></i> Manajemen Obat
                </button>
                <button onclick="showPage('pasien')" class="nav-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-bold transition-all">
                    <i class="fas fa-user-md"></i> Database Pasien
                </button>
                <button onclick="showPage('penggunaan')" class="nav-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-bold transition-all">
                    <i class="fas fa-exchange-alt"></i> Log Penggunaan
                </button>
            </nav>

            <div class="p-8">
                <button onclick="location.reload()" class="flex items-center gap-3 text-slate-400 font-bold hover:text-red-500 transition-all">
                    <i class="fas fa-power-off"></i> Keluar
                </button>
            </div>
        </aside>

        <main class="flex-1 h-screen overflow-y-auto custom-scroll p-4 md:p-10">
            
            <section id="page-dashboard" class="page-content space-y-8">
                <header>
                    <h2 class="text-3xl font-black text-slate-800 tracking-tight">Status Stok Obat</h2>
                    <p class="text-slate-400 font-semibold">Pantau sisa stok setiap obat secara mandiri</p>
                </header>
                <div id="dashboard-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    </div>
            </section>

            <section id="page-obat" class="page-content hidden space-y-6">
                <div class="flex flex-col md:flex-row justify-between gap-4">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="text" id="search-obat" oninput="renderObat()" placeholder="Cari nama obat..." class="w-full bg-white border border-slate-100 p-4 pl-12 rounded-2xl outline-none focus:ring-2 focus:ring-blue-100 shadow-sm">
                    </div>
                    <button onclick="prepareModal('obat')" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-blue-100 hover:scale-105 transition-all">+ Tambah Obat</button>
                </div>
                <div class="bg-white rounded-[2rem] border border-slate-100 overflow-hidden shadow-sm">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50/50 text-slate-400 text-[10px] font-black uppercase tracking-widest">
                            <tr>
                                <th class="p-6">Detail Obat</th>
                                <th class="p-6 text-center">Stok Awal</th>
                                <th class="p-6 text-center">Sisa Stok</th>
                                <th class="p-6 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="list-obat" class="divide-y divide-slate-50 font-semibold text-slate-600"></tbody>
                    </table>
                </div>
            </section>

            <section id="page-pasien" class="page-content hidden space-y-6">
                <div class="flex flex-col md:flex-row justify-between gap-4">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="text" id="search-pasien" oninput="renderPasien()" placeholder="Cari nama pasien..." class="w-full bg-white border border-slate-100 p-4 pl-12 rounded-2xl outline-none focus:ring-2 focus:ring-blue-100 shadow-sm">
                    </div>
                    <button onclick="prepareModal('pasien')" class="bg-green-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-green-100 hover:scale-105 transition-all">+ Pasien Baru</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="list-pasien"></div>
            </section>

            <section id="page-penggunaan" class="page-content hidden space-y-6">
                <div class="flex flex-col md:flex-row justify-between gap-4 items-center">
                    <div class="flex gap-4 w-full md:w-auto">
                        <input type="date" id="filter-date" class="bg-white border border-slate-100 p-4 rounded-2xl font-bold text-slate-600 outline-none" onchange="renderPenggunaan()">
                        <div class="relative flex-1 md:w-64">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                            <input type="text" id="search-penggunaan" oninput="renderPenggunaan()" placeholder="Cari riwayat..." class="w-full bg-white border border-slate-100 p-4 pl-12 rounded-2xl outline-none">
                        </div>
                    </div>
                    <button onclick="prepareModal('pakai')" class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100">+ Catat Penggunaan</button>
                </div>
                <div class="bg-white rounded-[2rem] border border-slate-100 overflow-hidden shadow-sm">
                    <table class="w-full text-left">
                        <tbody id="list-penggunaan" class="divide-y divide-slate-50 font-semibold"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-obat" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-10">
            <h3 id="title-obat" class="text-2xl font-black text-slate-800 mb-6">Input Obat</h3>
            <form id="form-obat" class="space-y-4">
                <input type="hidden" id="o-id">
                <input type="text" id="o-nama" placeholder="Nama Obat" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border-2 border-transparent focus:border-blue-500" required>
                <div class="grid grid-cols-2 gap-4">
                    <select id="o-satuan" class="w-full bg-slate-50 p-4 rounded-2xl outline-none">
                        <option>Tablet</option><option>Botol</option><option>Ampul</option><option>Sachet</option>
                    </select>
                    <input type="number" id="o-stok" placeholder="Stok Awal" class="w-full bg-slate-50 p-4 rounded-2xl outline-none" required>
                </div>
                <input type="date" id="o-exp" class="w-full bg-slate-50 p-4 rounded-2xl outline-none" required>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModal('modal-obat')" class="flex-1 py-4 font-bold text-slate-400">Batal</button>
                    <button type="submit" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg shadow-blue-100">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-pasien" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-10">
            <h3 id="title-pasien" class="text-2xl font-black text-slate-800 mb-6">Input Pasien</h3>
            <form id="form-pasien" class="space-y-4">
                <input type="hidden" id="p-id">
                <input type="text" id="p-nama" placeholder="Nama Lengkap" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border-2 border-transparent focus:border-green-500" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="p-umur" placeholder="Umur" class="w-full bg-slate-50 p-4 rounded-2xl outline-none" required>
                    <select id="p-jk" class="w-full bg-slate-50 p-4 rounded-2xl outline-none">
                        <option value="L">Laki-laki</option><option value="P">Perempuan</option>
                    </select>
                </div>
                <textarea id="p-diag" placeholder="Diagnosa Medis" class="w-full bg-slate-50 p-4 rounded-2xl outline-none h-32"></textarea>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModal('modal-pasien')" class="flex-1 py-4 font-bold text-slate-400">Batal</button>
                    <button type="submit" class="flex-1 py-4 bg-green-600 text-white rounded-2xl font-black shadow-lg shadow-green-100">Simpan Pasien</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-pakai" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-10">
            <h3 class="text-2xl font-black text-slate-800 mb-6">Catat Penggunaan</h3>
            <form id="form-pakai" class="space-y-4">
                <select id="tr-pasien" class="w-full bg-slate-50 p-4 rounded-2xl outline-none" required></select>
                <select id="tr-obat" class="w-full bg-slate-50 p-4 rounded-2xl outline-none" required></select>
                <div class="grid grid-cols-3 gap-2 bg-indigo-50 p-4 rounded-2xl">
                    <input type="number" id="tr-pagi" value="0" placeholder="Pagi" class="w-full p-2 rounded-xl text-center font-bold">
                    <input type="number" id="tr-siang" value="0" placeholder="Siang" class="w-full p-2 rounded-xl text-center font-bold">
                    <input type="number" id="tr-malam" value="0" placeholder="Malam" class="w-full p-2 rounded-xl text-center font-bold">
                </div>
                <input type="text" id="tr-ket" placeholder="Keterangan..." class="w-full bg-slate-50 p-4 rounded-2xl outline-none">
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModal('modal-pakai')" class="flex-1 py-4 font-bold text-slate-400">Batal</button>
                    <button type="submit" class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-100">Kirim Data</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdzWrKOBqrcu6talld7MN-2flHNibEWnE",
            authDomain: "mmrc-stock.firebaseapp.com",
            projectId: "mmrc-stock",
            storageBucket: "mmrc-stock.firebasestorage.app",
            messagingSenderId: "722563453659",
            appId: "1:722563453659:web:b9f867367ecadb7a1df2fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let OBAT = [], PASIEN = [], TRANSAKSI = [];

        // AUTH
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            if(document.getElementById('user-input').value === "MMRC.Stock1999" && document.getElementById('pass-input').value === "Madani1999") {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                syncData();
            } else { alert("Akses Ditolak!"); }
        };

        function syncData() {
            onSnapshot(collection(db, "obat"), s => { OBAT = s.docs.map(d => ({id:d.id, ...d.data()})); renderAll(); });
            onSnapshot(collection(db, "pasien"), s => { PASIEN = s.docs.map(d => ({id:d.id, ...d.data()})); renderAll(); });
            onSnapshot(query(collection(db, "transaksi"), orderBy("tanggal", "desc")), s => { TRANSAKSI = s.docs.map(d => ({id:d.id, ...d.data()})); renderAll(); });
        }

        window.showPage = (id) => {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('nav-active'));
            event.currentTarget.classList.add('nav-active');
        };

        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        // CRUD PREPARE
        window.prepareModal = (type, dataId = null) => {
            const form = document.getElementById('form-' + type);
            form.reset();
            document.getElementById(type.charAt(0) + '-id').value = dataId || '';
            if(type === 'pakai') {
                document.getElementById('tr-pasien').innerHTML = PASIEN.map(p => `<option value="${p.id}">${p.nama}</option>`).join('');
                document.getElementById('tr-obat').innerHTML = OBAT.map(o => `<option value="${o.id}">${o.nama}</option>`).join('');
            }
            if(dataId) {
                const data = type === 'obat' ? OBAT.find(x => x.id === dataId) : PASIEN.find(x => x.id === dataId);
                if(type === 'obat') {
                    document.getElementById('o-nama').value = data.nama;
                    document.getElementById('o-satuan').value = data.satuan;
                    document.getElementById('o-stok').value = data.stokAwal;
                    document.getElementById('o-exp').value = data.exp;
                } else {
                    document.getElementById('p-nama').value = data.nama;
                    document.getElementById('p-umur').value = data.umur;
                    document.getElementById('p-jk').value = data.jk;
                    document.getElementById('p-diag').value = data.diag;
                }
            }
            document.getElementById('modal-' + type).classList.remove('hidden');
        };

        // SUBMIT ACTIONS
        document.getElementById('form-obat').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('o-id').value;
            const data = { nama: document.getElementById('o-nama').value, satuan: document.getElementById('o-satuan').value, stokAwal: parseInt(document.getElementById('o-stok').value), exp: document.getElementById('o-exp').value };
            id ? await updateDoc(doc(db, "obat", id), data) : await addDoc(collection(db, "obat"), data);
            closeModal('modal-obat');
        };

        document.getElementById('form-pasien').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = { nama: document.getElementById('p-nama').value, umur: document.getElementById('p-umur').value, jk: document.getElementById('p-jk').value, diag: document.getElementById('p-diag').value };
            id ? await updateDoc(doc(db, "pasien", id), data) : await addDoc(collection(db, "pasien"), data);
            closeModal('modal-pasien');
        };

        document.getElementById('form-pakai').onsubmit = async (e) => {
            e.preventDefault();
            const p = parseInt(document.getElementById('tr-pagi').value) || 0, s = parseInt(document.getElementById('tr-siang').value) || 0, m = parseInt(document.getElementById('tr-malam').value) || 0;
            await addDoc(collection(db, "transaksi"), { tanggal: new Date().toISOString().split('T')[0], pasienId: document.getElementById('tr-pasien').value, obatId: document.getElementById('tr-obat').value, pagi: p, siang: s, malam: m, total: p+s+m, ket: document.getElementById('tr-ket').value });
            closeModal('modal-pakai');
        };

        window.deleteItem = async (type, id) => { if(confirm("Hapus Permanen?")) await deleteDoc(doc(db, type, id)); };

        // RENDERING
        function renderAll() { renderDashboard(); renderObat(); renderPasien(); renderPenggunaan(); }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = OBAT.map(o => {
                const used = TRANSAKSI.filter(t => t.obatId === o.id).reduce((a, b) => a + b.total, 0);
                const sisa = o.stokAwal - used;
                const pct = Math.min((sisa / o.stokAwal) * 100, 100);
                return `
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-50 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-blue-50/50 rounded-bl-full -mr-8 -mt-8"></div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter mb-1">${o.satuan}</p>
                    <h4 class="text-xl font-black text-slate-800 mb-4">${o.nama}</h4>
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-3xl font-black ${sisa < 10 ? 'text-red-500' : 'text-blue-600'}">${sisa}</span>
                        <span class="text-[10px] font-bold text-slate-400 mb-1">DARI ${o.stokAwal}</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div class="h-full ${sisa < 10 ? 'bg-red-500' : 'bg-blue-500'}" style="width: ${pct}%"></div>
                    </div>
                </div>`;
            }).join('');
        }

        window.renderObat = () => {
            const search = document.getElementById('search-obat').value.toLowerCase();
            document.getElementById('list-obat').innerHTML = OBAT.filter(o => o.nama.toLowerCase().includes(search)).map(o => {
                const used = TRANSAKSI.filter(t => t.obatId === o.id).reduce((a, b) => a + b.total, 0);
                const sisa = o.stokAwal - used;
                return `
                <tr>
                    <td class="p-6"><p class="font-black text-slate-800">${o.nama}</p><p class="text-[10px] text-slate-400 uppercase">${o.satuan} • EXP: ${o.exp}</p></td>
                    <td class="p-6 text-center text-slate-400">${o.stokAwal}</td>
                    <td class="p-6 text-center font-black ${sisa < 10 ? 'text-red-500' : 'text-blue-600'}">${sisa}</td>
                    <td class="p-6 text-center space-x-2">
                        <button onclick="prepareModal('obat', '${o.id}')" class="text-blue-500 hover:scale-110 transition-all"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteItem('obat', '${o.id}')" class="text-slate-200 hover:text-red-500 transition-all"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        };

        window.renderPasien = () => {
            const search = document.getElementById('search-pasien').value.toLowerCase();
            document.getElementById('list-pasien').innerHTML = PASIEN.filter(p => p.nama.toLowerCase().includes(search)).map(p => `
            <div class="bg-white p-8 rounded-[2rem] border border-slate-100 relative group">
                <div class="flex justify-between items-start mb-4">
                    <div class="bg-slate-50 w-12 h-12 rounded-2xl flex items-center justify-center text-slate-300"><i class="fas fa-id-badge text-xl"></i></div>
                    <div class="flex gap-4 opacity-0 group-hover:opacity-100 transition-all">
                        <button onclick="prepareModal('pasien', '${p.id}')" class="text-blue-500"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteItem('pasien', '${p.id}')" class="text-red-300"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <h4 class="text-xl font-black text-slate-800">${p.nama}</h4>
                <p class="text-blue-500 font-bold text-xs mb-4 uppercase">${p.umur} THN • ${p.jk}</p>
                <div class="bg-slate-50/50 p-4 rounded-2xl text-xs text-slate-500 font-medium">${p.diag || 'Tidak ada diagnosa'}</div>
            </div>`).join('');
        };

        window.renderPenggunaan = () => {
            const date = document.getElementById('filter-date').value;
            const search = document.getElementById('search-penggunaan').value.toLowerCase();
            document.getElementById('list-penggunaan').innerHTML = TRANSAKSI.filter(t => {
                const matchDate = date ? t.tanggal === date : true;
                const p = PASIEN.find(x => x.id === t.pasienId)?.nama.toLowerCase() || "";
                const o = OBAT.find(x => x.id === t.obatId)?.nama.toLowerCase() || "";
                return matchDate && (p.includes(search) || o.includes(search));
            }).map(t => {
                const p = PASIEN.find(x => x.id === t.pasienId)?.nama || 'N/A';
                const o = OBAT.find(x => x.id === t.obatId)?.nama || 'N/A';
                return `
                <tr class="hover:bg-slate-50/30 transition-all">
                    <td class="p-6">
                        <div class="flex items-center gap-4">
                            <div class="w-2 h-10 bg-indigo-500 rounded-full"></div>
                            <div><p class="text-slate-800 font-black">${p}</p><p class="text-[10px] text-slate-400 font-bold uppercase">${o} • ${t.tanggal}</p></div>
                        </div>
                    </td>
                    <td class="p-6 text-center text-slate-400 font-bold">${t.pagi}/${t.siang}/${t.malam}</td>
                    <td class="p-6 text-center"><span class="bg-slate-900 text-white px-4 py-1 rounded-full text-xs font-black">${t.total}</span></td>
                    <td class="p-6 text-slate-400 text-sm italic font-medium">${t.ket || '-'}</td>
                    <td class="p-6 text-center">
                        <button onclick="deleteItem('transaksi', '${t.id}')" class="text-slate-200 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>`;
            }).join('');
        };
    </script>
</body>
