<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMHC PRO V3.5 - Advanced Clinical System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F1F5F9; scroll-behavior: smooth; }
        .glass-header { background: rgba(79, 70, 229, 0.95); backdrop-filter: blur(12px); }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
        .btn-action { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-action:active { transform: scale(0.95); }
        input, textarea, select { border: 2px solid transparent !important; transition: all 0.2s; }
        input:focus { border-color: #4f46e5 !important; background: white !important; }
    </style>
</head>
<body class="text-slate-900 min-h-screen">

    <div id="login-page" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-10 text-center shadow-2xl">
            <h1 class="text-3xl font-black text-indigo-600 mb-2 italic">MMHC PRO <span class="text-slate-800">V3.5</span></h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-8">Clinical Integrated System</p>
            <form id="login-form" class="space-y-4">
                <input type="text" id="user-input" placeholder="ID Admin" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold" required>
                <input type="password" id="pass-input" placeholder="Passcode" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold" required>
                <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200">MASUK SISTEM</button>
            </form>
        </div>
    </div>

    <div id="main-content" class="hidden flex flex-col min-h-screen">
        <header class="glass-header text-white p-5 sticky top-0 z-40 flex justify-between items-center shadow-xl">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-lg"><i class="fas fa-notes-medical text-xl"></i></div>
                <h1 class="text-lg font-black tracking-tighter uppercase">MMHC Database</h1>
            </div>
            <button onclick="location.reload()" class="bg-red-500/20 px-4 py-2 rounded-xl text-xs font-black hover:bg-red-500 transition-colors">LOGOUT</button>
        </header>

        <main class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full">
            <div id="view-list" class="space-y-6">
                <div class="flex flex-col md:flex-row gap-4 items-center">
                    <div class="relative flex-1 w-full">
                        <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-pasien" oninput="renderPasien()" placeholder="Cari Pasien..." class="w-full bg-white p-5 pl-14 rounded-3xl shadow-sm outline-none font-bold">
                    </div>
                    <button onclick="openModalPasien()" class="w-full md:w-auto bg-indigo-600 text-white px-8 py-5 rounded-3xl font-black shadow-lg btn-action">+ REGISTRASI BARU</button>
                </div>
                <div id="list-pasien" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div id="view-detail" class="hidden space-y-6">
                <div class="flex flex-wrap justify-between items-center gap-4">
                    <button onclick="closeDetail()" class="text-indigo-600 font-black flex items-center gap-2 hover:bg-indigo-50 px-4 py-2 rounded-xl transition-all">
                        <i class="fas fa-arrow-left"></i> KEMBALI
                    </button>
                    <div class="flex gap-2">
                        <button onclick="exportToWord()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-black shadow-md"><i class="fas fa-file-word mr-2"></i>UNDUH BIODATA</button>
                        <button onclick="exportWeeklyReport()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-black shadow-md"><i class="fas fa-file-excel mr-2"></i>LAPORAN 7 HARI</button>
                    </div>
                </div>

                <div id="patient-header" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-1 space-y-6">
                        <div class="bg-white p-6 rounded-[2.5rem] card-shadow">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Vital Signs</h3>
                                <button onclick="openModalTTV()" class="bg-red-50 text-red-600 p-2 rounded-lg text-xs font-black">+ INPUT</button>
                            </div>
                            <div id="ttv-history" class="space-y-3"></div>
                        </div>
                    </div>
                    <div class="lg:col-span-2">
                        <div class="bg-white p-6 rounded-[2.5rem] card-shadow">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Penggunaan Obat & Stok</h3>
                                <button onclick="openModalObat()" class="bg-indigo-50 text-indigo-600 p-2 rounded-lg text-xs font-black">+ TAMBAH OBAT</button>
                            </div>
                            <div id="obat-inventory" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-pasien" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] w-full max-w-5xl p-8 max-h-[90vh] overflow-y-auto shadow-2xl">
            <h3 class="text-2xl font-black mb-8 flex items-center gap-3">
                <i class="fas fa-id-card text-indigo-600"></i> Rekam Medis & Biodata Lengkap
            </h3>
            <form id="form-pasien" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <input type="hidden" id="p-id">
                
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-indigo-500 uppercase border-b pb-2">I. Identitas Pribadi</p>
                    <input type="text" id="p-nama" placeholder="Nama Lengkap" class="w-full bg-slate-50 p-4 rounded-2xl font-bold" required>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="p-ttl" placeholder="Tempat, Tgl Lahir" class="bg-slate-50 p-4 rounded-2xl font-bold">
                        <input type="number" id="p-umur" placeholder="Usia" class="bg-slate-50 p-4 rounded-2xl font-bold">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="p-jk" class="bg-slate-50 p-4 rounded-2xl font-bold outline-none">
                            <option>Laki-laki</option><option>Perempuan</option>
                        </select>
                        <select id="p-status" class="bg-slate-50 p-4 rounded-2xl font-bold outline-none">
                            <option>Belum Kawin</option><option>Kawin</option><option>Cerai</option>
                        </select>
                    </div>
                    <input type="text" id="p-pekerjaan" placeholder="Pekerjaan / Pelajar" class="w-full bg-slate-50 p-4 rounded-2xl font-bold">
                    <textarea id="p-alamat" placeholder="Alamat Lengkap" class="w-full bg-slate-50 p-4 rounded-2xl font-bold h-20"></textarea>
                    
                    <p class="text-[10px] font-black text-indigo-500 uppercase border-b pb-2 mt-4">II. Penjamin / Emergency</p>
                    <input type="text" id="p-penjamin" placeholder="Nama & No. HP Penjamin" class="w-full bg-slate-50 p-4 rounded-2xl font-bold">
                </div>

                <div class="space-y-4">
                    <p class="text-[10px] font-black text-red-500 uppercase border-b pb-2">III. Data Klinis & Kedatangan</p>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="p-tgl-masuk" class="bg-slate-50 p-4 rounded-2xl font-bold">
                        <input type="time" id="p-jam-masuk" class="bg-slate-50 p-4 rounded-2xl font-bold">
                    </div>
                    <textarea id="p-riwayat" placeholder="Riwayat Penyakit" class="w-full bg-slate-50 p-4 rounded-2xl font-medium h-20"></textarea>
                    <textarea id="p-diagnosa" placeholder="Diagnosa Utama" class="w-full bg-indigo-50 p-4 rounded-2xl font-black h-20 text-indigo-700"></textarea>
                    
                    <div class="bg-slate-900 text-white p-6 rounded-3xl space-y-3">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="i-fiksasi" class="w-5 h-5 accent-indigo-500">
                            <label class="text-xs font-black uppercase">Intervensi Fiksasi</label>
                        </div>
                        <input type="text" id="i-injeksi" placeholder="Ket. Injeksi (Tgl/Jam/Nama Obat)" class="w-full bg-white/10 p-3 rounded-xl text-xs outline-none">
                        <input type="text" id="i-urine" placeholder="Hasil Test Urine" class="w-full bg-white/10 p-3 rounded-xl text-xs outline-none">
                    </div>
                    <input type="file" id="p-foto" accept="image/*" class="text-xs font-bold text-slate-400">
                    <input type="hidden" id="p-foto-base64">
                </div>

                <div class="md:col-span-2 flex gap-4 mt-4">
                    <button type="button" onclick="closeModals()" class="flex-1 font-black text-slate-400">BATAL</button>
                    <button type="submit" class="flex-[3] bg-indigo-600 text-white py-5 rounded-3xl font-black shadow-xl">SIMPAN REKAM MEDIS</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-obat" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6">Setup Obat & Jadwal</h3>
            <form id="form-obat" class="space-y-4">
                <input type="hidden" id="o-id">
                <input type="text" id="o-nama" placeholder="Nama Obat" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none" required>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Tgl Mulai</label>
                        <input type="date" id="o-tgl-beri" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Jam Mulai</label>
                        <input type="time" id="o-jam-beri" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    </div>
                </div>
                <input type="number" id="o-stok" placeholder="Jumlah Stok Awal (Tablet)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none" required>
                <div class="bg-indigo-50 p-4 rounded-2xl grid grid-cols-3 gap-2">
                    <div class="text-center">
                        <p class="text-[8px] font-black mb-1">Pagi</p>
                        <input type="number" id="o-pagi" value="1" class="w-full p-2 rounded-lg text-center font-bold">
                    </div>
                    <div class="text-center">
                        <p class="text-[8px] font-black mb-1">Siang</p>
                        <input type="number" id="o-siang" value="1" class="w-full p-2 rounded-lg text-center font-bold">
                    </div>
                    <div class="text-center">
                        <p class="text-[8px] font-black mb-1">Malam</p>
                        <input type="number" id="o-malam" value="1" class="w-full p-2 rounded-lg text-center font-bold">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black shadow-lg">AKTIFKAN JADWAL</button>
            </form>
        </div>
    </div>

    <div id="modal-ttv" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6">Monitoring Vital</h3>
            <form id="form-ttv" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="v-td" placeholder="TD (120/80)" class="w-full bg-slate-100 p-4 rounded-xl font-bold">
                    <input type="text" id="v-suhu" placeholder="Suhu (°C)" class="w-full bg-slate-100 p-4 rounded-xl font-bold">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="v-tgl" class="w-full bg-slate-100 p-4 rounded-xl font-bold">
                    <input type="time" id="v-jam" class="w-full bg-slate-100 p-4 rounded-xl font-bold">
                </div>
                <button type="submit" class="w-full bg-red-500 text-white py-4 rounded-xl font-black shadow-lg">SIMPAN HASIL</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG (Replace with your actual config)
        const firebaseConfig = {
            apiKey: "AIzaSyBdzWrKOBqrcu6talld7MN-2flHNibEWnE",
            authDomain: "mmrc-stock.firebaseapp.com",
            projectId: "mmrc-stock",
            storageBucket: "mmrc-stock.firebasestorage.app",
            messagingSenderId: "722563453659",
            appId: "1:722563453659:web:b9f867367ecadb7a1df2fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let PASIEN = [], OBAT = [], TTV = [], SELECTED_ID = null;

        // AUTH
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            if(document.getElementById('user-input').value === "MMRC.Stock1999" && document.getElementById('pass-input').value === "Madani1999") {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                startSync();
            }
        };

        function startSync() {
            onSnapshot(collection(db, "pasien_v35"), s => { PASIEN = s.docs.map(d => ({id:d.id, ...d.data()})); renderPasien(); if(SELECTED_ID) updateDetailUI(); });
            onSnapshot(collection(db, "obat_v35"), s => { OBAT = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) updateDetailUI(); });
            onSnapshot(collection(db, "ttv_v35"), s => { TTV = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) updateDetailUI(); });
        }

        // FOTO HANDLING
        document.getElementById('p-foto').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = () => document.getElementById('p-foto-base64').value = reader.result;
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        };

        // CRUD PASIEN
        window.openModalPasien = (id = null) => {
            const f = document.getElementById('form-pasien'); f.reset();
            document.getElementById('p-id').value = id || '';
            if(id) {
                const p = PASIEN.find(x => x.id === id);
                Object.keys(p).forEach(key => {
                    const el = document.getElementById(`p-${key}`);
                    if(el) el.value = p[key];
                });
                document.getElementById('i-fiksasi').checked = p.intervensi?.fiksasi;
                document.getElementById('i-injeksi').value = p.intervensi?.injeksi;
                document.getElementById('i-urine').value = p.intervensi?.urine;
            }
            document.getElementById('modal-pasien').classList.remove('hidden');
        };

        document.getElementById('form-pasien').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = {
                nama: document.getElementById('p-nama').value,
                ttl: document.getElementById('p-ttl').value,
                umur: document.getElementById('p-umur').value,
                jk: document.getElementById('p-jk').value,
                status: document.getElementById('p-status').value,
                pekerjaan: document.getElementById('p-pekerjaan').value,
                alamat: document.getElementById('p-alamat').value,
                penjamin: document.getElementById('p-penjamin').value,
                tglMasuk: document.getElementById('p-tgl-masuk').value,
                jamMasuk: document.getElementById('p-jam-masuk').value,
                riwayat: document.getElementById('p-riwayat').value,
                diagnosa: document.getElementById('p-diagnosa').value,
                intervensi: {
                    fiksasi: document.getElementById('i-fiksasi').checked,
                    injeksi: document.getElementById('i-injeksi').value,
                    urine: document.getElementById('i-urine').value
                },
                foto: document.getElementById('p-foto-base64').value || (id ? PASIEN.find(x => x.id === id).foto : '')
            };
            id ? await updateDoc(doc(db, "pasien_v35", id), data) : await addDoc(collection(db, "pasien_v35"), data);
            closeModals();
        };

        window.renderPasien = () => {
            const s = document.getElementById('search-pasien').value.toLowerCase();
            const container = document.getElementById('list-pasien');
            container.innerHTML = PASIEN.filter(p => p.nama.toLowerCase().includes(s) || p.diagnosa.toLowerCase().includes(s))
            .map(p => `
                <div onclick="openDetail('${p.id}')" class="bg-white p-6 rounded-[2.5rem] card-shadow border border-white hover:border-indigo-200 cursor-pointer transition-all group">
                    <div class="flex gap-4 items-center mb-4">
                        <div class="w-16 h-16 rounded-2xl bg-slate-100 overflow-hidden flex-shrink-0">
                            ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover">` : `<i class="fas fa-user-circle text-slate-300 text-4xl m-3"></i>`}
                        </div>
                        <div class="overflow-hidden">
                            <h4 class="font-black text-slate-800 truncate">${p.nama}</h4>
                            <p class="text-[10px] font-black text-indigo-500 truncate uppercase">${p.diagnosa || 'Diagnosa Belum Ada'}</p>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-4 border-t border-slate-50">
                        <span class="text-[9px] font-black text-slate-400 uppercase">${p.tglMasuk}</span>
                        <div class="flex gap-2">
                            <button onclick="event.stopPropagation(); openModalPasien('${p.id}')" class="text-[9px] font-black text-blue-500 px-2 py-1 bg-blue-50 rounded-lg">EDIT</button>
                            <button onclick="event.stopPropagation(); deleteData('pasien_v35', '${p.id}')" class="text-[9px] font-black text-red-300 hover:text-red-500 px-2 py-1">HAPUS</button>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        // DETAIL UI & AUTO STOK
        window.openDetail = (id) => { 
            SELECTED_ID = id; 
            document.getElementById('view-list').classList.add('hidden'); 
            document.getElementById('view-detail').classList.remove('hidden'); 
            updateDetailUI(); 
        };

        window.closeDetail = () => { 
            SELECTED_ID = null; 
            document.getElementById('view-list').classList.remove('hidden'); 
            document.getElementById('view-detail').classList.add('hidden'); 
        };

        function updateDetailUI() {
            const p = PASIEN.find(x => x.id === SELECTED_ID);
            if(!p) return;

            document.getElementById('patient-header').innerHTML = `
                <div class="lg:col-span-2 bg-white p-8 rounded-[3rem] card-shadow flex flex-col md:flex-row gap-8">
                    <div class="w-32 h-32 rounded-[2rem] bg-slate-100 overflow-hidden shadow-inner flex-shrink-0 mx-auto">
                        ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover">` : `<i class="fas fa-user text-slate-300 text-6xl p-8"></i>`}
                    </div>
                    <div class="flex-1 space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-3xl font-black text-slate-900">${p.nama}</h2>
                                <p class="text-xs font-black text-indigo-500 uppercase tracking-widest">${p.pekerjaan || 'Pelajar/Umum'} • ${p.status}</p>
                            </div>
                            <span class="bg-indigo-600 text-white text-[10px] font-black px-4 py-1 rounded-full uppercase italic">V3.5 PRO</span>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 pt-4 border-t border-slate-50">
                            <div><p class="text-[8px] font-black text-slate-400 uppercase">Lahir</p><p class="text-xs font-bold">${p.ttl || '-'}</p></div>
                            <div><p class="text-[8px] font-black text-slate-400 uppercase">Penjamin</p><p class="text-xs font-bold">${p.penjamin || '-'}</p></div>
                            <div><p class="text-[8px] font-black text-slate-400 uppercase">Masuk</p><p class="text-xs font-bold">${p.tglMasuk} [${p.jamMasuk}]</p></div>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-900 text-white p-8 rounded-[3rem] card-shadow">
                    <p class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2">Diagnosa Utama</p>
                    <p class="text-lg font-black leading-tight mb-4 uppercase text-indigo-100">${p.diagnosa || '-'}</p>
                    <div class="space-y-2 text-[10px]">
                        <p><i class="fas fa-check-circle text-indigo-500 mr-2"></i>Fiksasi: ${p.intervensi?.fiksasi ? 'AKTIF' : 'TIDAK'}</p>
                        <p><i class="fas fa-syringe text-indigo-500 mr-2"></i>Injeksi: ${p.intervensi?.injeksi || '-'}</p>
                    </div>
                </div>
            `;

            // Render TTV
            const ttvP = TTV.filter(t => t.pasienId === SELECTED_ID).slice(-5).reverse();
            document.getElementById('ttv-history').innerHTML = ttvP.map(t => `
                <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center group">
                    <div>
                        <p class="text-xs font-black text-slate-800">${t.td} mmHg / ${t.suhu}°C</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">${t.tgl} • ${t.jam}</p>
                    </div>
                    <button onclick="deleteData('ttv_v35', '${t.id}')" class="text-red-200 hover:text-red-500 transition-all opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i></button>
                </div>
            `).join('') || '<p class="text-[10px] text-center py-4 text-slate-300 uppercase font-black tracking-widest">Data Kosong</p>';

            // Render Obat & Stok Automatisasi
            const obatP = OBAT.filter(o => o.pasienId === SELECTED_ID);
            document.getElementById('obat-inventory').innerHTML = obatP.map(o => {
                const sisa = calculateRealtimeStock(o);
                return `
                    <div class="bg-slate-50 p-5 rounded-3xl border border-white">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h4 class="font-black text-slate-800 text-sm">${o.nama}</h4>
                                <p class="text-[8px] font-black text-slate-400 uppercase">Mulai: ${o.tglBeri} ${o.jamBeri}</p>
                            </div>
                            <button onclick="deleteData('obat_v35', '${o.id}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="bg-white p-4 rounded-2xl flex-1 text-center shadow-sm">
                                <p class="text-[8px] font-black text-slate-300 uppercase">Sisa Stok</p>
                                <p class="text-2xl font-black ${sisa < 7 ? 'text-red-500 animate-pulse' : 'text-indigo-600'}">${sisa}</p>
                                <p class="text-[8px] font-bold text-slate-400 uppercase">Tablet</p>
                            </div>
                            <div class="flex flex-col gap-1">
                                <div class="bg-white px-3 py-1 rounded-lg text-[9px] font-black">P: ${o.pagi}</div>
                                <div class="bg-white px-3 py-1 rounded-lg text-[9px] font-black">S: ${o.siang}</div>
                                <div class="bg-white px-3 py-1 rounded-lg text-[9px] font-black">M: ${o.malam}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('') || '<p class="text-[10px] text-center py-4 text-slate-300 uppercase font-black tracking-widest">Belum Ada Terapi Obat</p>';
        }

        // LOGIKA PENGURANGAN OBAT 1 TABLET PER DOSIS PER HARI
        function calculateRealtimeStock(o) {
            const startStr = `${o.tglBeri}T${o.jamBeri || '08:00'}`;
            const startDate = new Date(startStr);
            const now = new Date();
            
            if (now < startDate) return o.stok;

            const diffTime = now - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            // Dosis harian
            const dailyDose = (parseInt(o.pagi)||0) + (parseInt(o.siang)||0) + (parseInt(o.malam)||0);
            let totalConsumed = diffDays * dailyDose;

            // Hitung sisa dosis untuk hari ini berdasarkan jam
            const curHour = now.getHours();
            if (curHour >= 8) totalConsumed += (parseInt(o.pagi)||0);  // Asumsi pagi jam 8
            if (curHour >= 13) totalConsumed += (parseInt(o.siang)||0); // Asumsi siang jam 1
            if (curHour >= 19) totalConsumed += (parseInt(o.malam)||0); // Asumsi malam jam 7

            return Math.max(0, o.stok - totalConsumed);
        }

        // EXPORT TO WORD (BIODATA)
        window.exportToWord = () => {
            const p = PASIEN.find(x => x.id === SELECTED_ID);
            const content = `
                BIODATA PASIEN - MMHC PRO V3.5
                ==================================
                Nama Lengkap    : ${p.nama}
                TTL             : ${p.ttl}
                Usia            : ${p.umur} Tahun
                Jenis Kelamin   : ${p.jk}
                Status          : ${p.status}
                Pekerjaan       : ${p.pekerjaan}
                Alamat          : ${p.alamat}
                Penjamin        : ${p.penjamin}
                
                DATA KLINIS
                ==================================
                Tgl Masuk       : ${p.tglMasuk} [${p.jamMasuk}]
                Diagnosa        : ${p.diagnosa}
                Riwayat         : ${p.riwayat}
                Fiksasi         : ${p.intervensi?.fiksasi ? 'Ya' : 'Tidak'}
                Injeksi         : ${p.intervensi?.injeksi}
                Hasil Urine     : ${p.intervensi?.urine}
                
                Dicetak pada    : ${new Date().toLocaleString()}
            `;
            const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `BIODATA_${p.nama.replace(/\s/g, '_')}.doc`;
            link.click();
        };

        // EXPORT WEEKLY REPORT (SPREADSHEET/CSV)
        window.exportWeeklyReport = () => {
            const p = PASIEN.find(x => x.id === SELECTED_ID);
            const patientObat = OBAT.filter(o => o.pasienId === SELECTED_ID);
            const patientTTV = TTV.filter(t => t.pasienId === SELECTED_ID);

            let csv = `LAPORAN KLINIS 7 HARI - ${p.nama}\n`;
            csv += `TANGGAL CETAK: ${new Date().toLocaleDateString()}\n\n`;
            
            csv += `DATA VITAL SIGN (TTV)\n`;
            csv += `Tanggal,Jam,Tekanan Darah,Suhu\n`;
            patientTTV.forEach(t => {
                csv += `${t.tgl},${t.jam},"${t.td}",${t.suhu}\n`;
            });

            csv += `\nDATA PENGGUNAAN OBAT & SISA STOK\n`;
            csv += `Nama Obat,Stok Awal,Pagi,Siang,Malam,Sisa Realtime\n`;
            patientObat.forEach(o => {
                csv += `${o.nama},${o.stok},${o.pagi},${o.siang},${o.malam},${calculateRealtimeStock(o)}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `LAPORAN_MINGGUAN_${p.nama.replace(/\s/g, '_')}.csv`;
            link.click();
        };

        // TTV SUBMIT
        window.openModalTTV = () => {
            document.getElementById('form-ttv').reset();
            document.getElementById('v-tgl').value = new Date().toISOString().split('T')[0];
            document.getElementById('v-jam').value = new Date().toLocaleTimeString('id-ID', {hour12:false, hour:'2-digit', minute:'2-digit'});
            document.getElementById('modal-ttv').classList.remove('hidden');
        };

        document.getElementById('form-ttv').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "ttv_v35"), {
                pasienId: SELECTED_ID,
                td: document.getElementById('v-td').value,
                suhu: document.getElementById('v-suhu').value,
                tgl: document.getElementById('v-tgl').value,
                jam: document.getElementById('v-jam').value
            });
            closeModals();
        };

        // OBAT SUBMIT
        window.openModalObat = () => {
            document.getElementById('form-obat').reset();
            document.getElementById('o-tgl-beri').value = new Date().toISOString().split('T')[0];
            document.getElementById('o-jam-beri').value = "08:00";
            document.getElementById('modal-obat').classList.remove('hidden');
        };

        document.getElementById('form-obat').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "obat_v35"), {
                pasienId: SELECTED_ID,
                nama: document.getElementById('o-nama').value,
                stok: parseInt(document.getElementById('o-stok').value),
                tglBeri: document.getElementById('o-tgl-beri').value,
                jamBeri: document.getElementById('o-jam-beri').value,
                pagi: document.getElementById('o-pagi').value,
                siang: document.getElementById('o-siang').value,
                malam: document.getElementById('o-malam').value
            });
            closeModals();
        };

        window.deleteData = async (col, id) => { if(confirm('Hapus data?')) await deleteDoc(doc(db, col, id)); };
        window.closeModals = () => document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));

    </script>
</body>
