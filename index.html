<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMRC Management System Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-100 selection:text-teal-900">

    <div id="auth-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-teal-500 to-emerald-700 p-4">
        <div class="bg-white/90 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-white/20 animate-fade-up">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-teal-100 text-teal-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-inner">
                    <i class="fas fa-hospital-user"></i>
                </div>
                <h1 class="font-black text-2xl text-slate-800 tracking-tight">MMRC SYSTEM</h1>
                <p class="text-slate-500 text-xs font-medium uppercase tracking-widest mt-1">Authorized Access Only</p>
            </div>
            <div class="space-y-4">
                <input id="login-user" type="text" placeholder="Username ID" class="input-field text-center font-bold" autocomplete="off">
                <input id="login-pass" type="password" placeholder="Password" class="input-field text-center font-bold">
                <button onclick="app.login()" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-4 rounded-xl font-bold shadow-lg shadow-teal-600/30 transition-all active:scale-95">
                    LOGIN MASUK
                </button>
            </div>
            <p class="text-center text-[10px] text-slate-400 mt-8">© 2024 MMRC Medical Record</p>
        </div>
    </div>

    <div id="app-layer" class="hidden flex h-screen overflow-hidden relative">
        
        <aside class="w-64 bg-white border-r border-slate-100 flex-col hidden md:flex z-20 shadow-sm">
            <div class="p-6 border-b border-slate-50">
                <h2 class="font-black text-2xl text-teal-700 tracking-tighter flex items-center gap-2">
                    <i class="fas fa-heartbeat"></i> MMRC
                </h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Professional Panel</p>
            </div>
            
            <nav class="flex-1 overflow-y-auto p-4 space-y-1">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2 mt-2">Main Menu</p>
                <button onclick="app.nav('dashboard')" id="btn-dashboard" class="nav-btn active"><i class="fas fa-home w-8"></i> Dashboard</button>
                <button onclick="app.nav('medicine')" id="btn-medicine" class="nav-btn"><i class="fas fa-pills w-8"></i> Medicine</button>
                <button onclick="app.nav('ttv')" id="btn-ttv" class="nav-btn"><i class="fas fa-heart-pulse w-8"></i> TTV & GDS</button>
                
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2 mt-6">Monitoring</p>
                <button onclick="app.nav('visit')" id="btn-visit" class="nav-btn"><i class="fas fa-user-md w-8"></i> Visit Dokter</button>
                <button onclick="app.nav('crisis')" id="btn-crisis" class="nav-btn"><i class="fas fa-chart-line w-8"></i> Crisis Score</button>
                
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2 mt-6">Rehab</p>
                <button onclick="app.nav('program')" id="btn-program" class="nav-btn"><i class="fas fa-clipboard-list w-8"></i> Program</button>
                <button onclick="app.nav('therapy')" id="btn-therapy" class="nav-btn"><i class="fas fa-brain w-8"></i> Therapy Log</button>
            </nav>

            <div class="p-4 border-t border-slate-50">
                <button onclick="location.reload()" class="w-full bg-red-50 text-red-600 py-3 rounded-xl text-xs font-bold hover:bg-red-100 transition flex items-center justify-center gap-2">
                    <i class="fas fa-power-off"></i> LOGOUT
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative bg-slate-50/50">
            <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-10">
                <div class="flex items-center gap-4">
                    <button class="md:hidden text-slate-500 text-xl" onclick="document.querySelector('aside').classList.toggle('hidden'); document.querySelector('aside').classList.toggle('absolute'); document.querySelector('aside').classList.toggle('h-full');">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 id="page-title" class="font-black text-xl text-slate-800 tracking-tight">DASHBOARD</h2>
                </div>

                <div class="flex items-center gap-4">
                    <div class="hidden md:flex items-center bg-slate-100 rounded-full px-4 py-2 border border-transparent focus-within:border-teal-500 focus-within:bg-white transition-all w-64">
                        <i class="fas fa-search text-slate-400 text-xs"></i>
                        <input id="global-search" onkeyup="app.search()" type="text" placeholder="Cari Pasien..." class="bg-transparent border-none outline-none text-xs font-bold text-slate-700 ml-2 w-full placeholder:text-slate-400">
                    </div>

                    <div class="flex gap-2">
                        <button onclick="app.exportToWord()" class="bg-blue-600 hover:bg-blue-700 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-md transition-transform hover:scale-110" title="Download Word Lengkap">
                            <i class="fas fa-file-word text-xs"></i>
                        </button>
                        <button onclick="app.exportAllExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-md transition-transform hover:scale-110" title="Download Excel Database">
                            <i class="fas fa-file-excel text-xs"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div id="main-content" class="flex-1 p-6 overflow-y-auto scroll-smooth pb-20">
                </div>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 transition-all duration-300">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-[2rem] shadow-2xl flex flex-col animate-modal-pop border border-white/50">
            <div class="px-8 py-5 border-b border-slate-100 flex justify-between items-center bg-white/50 rounded-t-[2rem]">
                <div>
                    <h3 id="modal-title" class="font-black text-xl text-slate-800 tracking-tight">FORM INPUT</h3>
                    <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">MMRC Secure System</p>
                </div>
                <button onclick="app.closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-all">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div id="modal-body" class="p-8 overflow-y-auto custom-scrollbar">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
