<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50">

    <div id="auth-layer" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-teal-600">MMRC</h1>
                <p class="text-slate-400 text-sm">Ultimate Management System</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="login-user" placeholder="Username" class="input-field">
                <input type="password" id="login-pass" placeholder="Password" class="input-field">
                <button onclick="app.login()" class="w-full bg-teal-600 text-white py-4 rounded-2xl font-bold hover:bg-teal-700 transition-all">MASUK SISTEM</button>
            </div>
        </div>
    </div>

    <div id="app-layer" class="hidden flex h-screen overflow-hidden">
        <aside class="w-72 bg-white border-r flex flex-col p-6">
            <div class="mb-10 px-4">
                <h2 class="text-2xl font-black text-teal-600 italic">MMRC <span class="text-[10px] text-slate-400 block not-italic font-normal">v2.0 REBORN</span></h2>
            </div>
            <nav class="flex-1 space-y-2">
                <button id="btn-dashboard" onclick="app.nav('dashboard')" class="nav-btn active"><i class="fas fa-th-large mr-3"></i> Dashboard</button>
                <button id="btn-medicine" onclick="app.nav('medicine')" class="nav-btn"><i class="fas fa-pills mr-3"></i> Obat & Stok</button>
                <button id="btn-ttv" onclick="app.nav('ttv')" class="nav-btn"><i class="fas fa-heartbeat mr-3"></i> Tanda Vital</button>
                <button id="btn-crisis" onclick="app.nav('crisis')" class="nav-btn"><i class="fas fa-exclamation-triangle mr-3"></i> Crisis Monitoring</button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col h-full bg-slate-50 overflow-hidden">
            <header class="bg-white border-b px-8 py-4 flex justify-between items-center">
                <h2 id="page-title" class="text-lg font-black text-slate-700 uppercase tracking-widest underline decoration-teal-400 underline-offset-8">DASHBOARD</h2>
                <div class="flex gap-4">
                    <button onclick="location.reload()" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:rotate-180 transition-all duration-500"><i class="fas fa-sync"></i></button>
                </div>
            </header>
            <div id="main-content" class="p-8 overflow-y-auto flex-1">
                </div>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl transform scale-100 transition-all">
            <div class="px-8 py-6 border-b flex justify-between items-center bg-slate-50/50">
                <h3 id="modal-title" class="font-black text-teal-800 uppercase tracking-tighter">Form Input</h3>
                <button onclick="app.closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-red-100 text-red-500 hover:bg-red-500 hover:text-white transition-all"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-body" class="p-8 overflow-y-auto max-h-[70vh]">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
