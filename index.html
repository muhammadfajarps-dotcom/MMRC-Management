<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Stock 1999 - Integrated System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 50: '#fff1f2', 100: '#ffe4e6', 600: '#e11d48', 700: '#be123c', 800: '#9f1239', 900: '#881337' } }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 h-screen flex bg-slate-50">

    <div id="auth-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-slate-900 to-brand-900">
        <div class="absolute inset-0 login-bg"></div>
        <div class="bg-white/95 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-sm relative z-10 text-center">
            <div class="w-16 h-16 bg-brand-700 rounded-xl flex items-center justify-center mx-auto mb-4 text-white text-2xl"><i class="fas fa-heartbeat"></i></div>
            <h1 class="text-2xl font-black text-slate-800">MMRC STOCK 1999</h1>
            <p class="text-xs font-bold text-slate-500 mb-6 tracking-widest">MEDICAL INTEGRATED SYSTEM</p>
            <input type="text" id="login-user" class="input-modern mb-3 text-center font-bold" placeholder="Username">
            <input type="password" id="login-pass" class="input-modern mb-4 text-center font-bold" placeholder="Password">
            <button onclick="app.login()" class="w-full bg-brand-700 text-white py-3 rounded-xl font-bold hover:bg-brand-800 transition shadow-lg">MASUK SISTEM</button>
        </div>
    </div>

    <div id="app-layer" class="hidden flex w-full h-full">
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-20 hidden md:flex">
            <div class="p-6 border-b border-slate-100">
                <div class="flex items-center gap-3 text-brand-800">
                    <i class="fas fa-clinic-medical text-3xl"></i>
                    <div><h2 class="font-extrabold text-xl leading-none">MMRC</h2><p class="text-[9px] font-bold text-slate-400">STOCK 1999</p></div>
                </div>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="app.renderDashboard()" class="nav-item active"><i class="fas fa-th-large w-5"></i> Dashboard Utama</button>
            </nav>
            <div class="p-4"><button onclick="location.reload()" class="w-full border border-slate-200 py-2 rounded-lg text-xs font-bold text-slate-500 hover:text-red-600 hover:bg-red-50 transition">KELUAR</button></div>
        </aside>

        <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            <header class="h-16 bg-white/80 backdrop-blur border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-10">
                <h2 id="page-title" class="text-xl font-extrabold text-brand-900 tracking-tight">DASHBOARD PASIEN</h2>
                <div class="flex gap-2" id="header-actions">
                    </div>
            </header>

            <div id="main-content" class="flex-1 overflow-y-auto p-6 scroll-smooth relative">
                </div>
        </main>
    </div>

    <div id="modal-container" class="hidden fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[90vh] animate-popup">
            <div class="p-5 border-b flex justify-between items-center bg-slate-50 rounded-t-3xl">
                <h3 id="modal-title" class="font-bold text-brand-800">FORM</h3>
                <button onclick="app.closeModal()" class="w-8 h-8 rounded-full bg-white hover:bg-red-50 text-slate-400 hover:text-red-500 transition shadow-sm">✕</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.0/build/index.min.js"></script>
    <script src="script.js"></script>
    <script>
    /* =========================================
       SISTEM OTOMASI MMRC (FIXED LOGIC)
       ========================================= */

    // KUNCI DATABASE BROWSER
    const DB_KEY = 'mmrc_stock_data_final';
    const SESSION_KEY = 'mmrc_user_session';

    // 1. SETUP DATA DEFAULT (SOLUSI BUG VIDEO)
    // Jika data kosong, paksa Sisa = 8.
    function ambilData() {
        const dataTersimpan = localStorage.getItem(DB_KEY);
        if (dataTersimpan) {
            return JSON.parse(dataTersimpan);
        } else {
            // INI PERBAIKANNYA: Default Sisa harus 8, bukan 0.
            return {
                stokAwal: 8,
                stokSisa: 8, 
                logs: [] 
            };
        }
    }

    function simpanData(data) {
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        renderTampilan(); // Update layar setiap kali simpan
    }

    // 2. CEK LOGIN (SECURITY)
    function cekSesi() {
        const sesi = sessionStorage.getItem(SESSION_KEY);
        const overlay = document.getElementById('login-overlay');
        
        if (sesi === 'aktif') {
            overlay.style.display = 'none'; // Sembunyikan login jika sudah masuk
        } else {
            overlay.style.display = 'flex'; // Munculkan login jika belum masuk
        }
    }

    function login() {
        sessionStorage.setItem(SESSION_KEY, 'aktif');
        cekSesi();
    }

    function logout() {
        if(confirm("Keluar dari aplikasi?")) {
            sessionStorage.removeItem(SESSION_KEY);
            location.reload(); 
        }
    }

    // 3. FUNGSI RENDER (UPDATE TAMPILAN OTOMATIS)
    function renderTampilan() {
        const data = ambilData();

        // Update Angka Stok di Card Merah
        // Pastikan ID di HTML Anda: 'display-sisa' dan 'display-awal'
        const elSisa = document.getElementById('display-sisa');
        const elAwal = document.getElementById('display-awal');
        const elTerpakai = document.getElementById('display-terpakai'); // Tambahan untuk field terpakai

        if(elSisa) elSisa.innerText = data.stokSisa;
        if(elAwal) elAwal.innerText = data.stokAwal;
        
        // Update Field "Terpakai (Auto)" di Form Edit (jika ada)
        if(elTerpakai) elTerpakai.innerText = (data.stokAwal - data.stokSisa);

        // Update Tabel Log Minum Obat
        const areaLog = document.getElementById('log-list-wrapper');
        if (areaLog) {
            areaLog.innerHTML = ''; // Bersihkan dulu
            
            if (data.logs.length === 0) {
                areaLog.innerHTML = '<div style="padding:15px; text-align:center; color:#94a3b8; font-style:italic;">Belum ada riwayat penggunaan.</div>';
            } else {
                // Loop data log (Log terbaru paling atas)
                data.logs.slice().reverse().forEach((item, index) => {
                    // Hitung index asli agar penghapusan akurat
                    const indexAsli = data.logs.length - 1 - index;
                    
                    const rowHTML = `
                        <div class="log-row">
                            <div>${item.waktu}</div>
                            <div style="font-weight:bold; color:#b91c1c;">${item.obat}</div>
                            <div>${item.pj}</div>
                            <div style="text-align: center;">
                                <button class="btn-del" onclick="hapusLog(${indexAsli})">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    areaLog.innerHTML += rowHTML;
                });
            }
        }
    }

    // 4. LOGIKA TOMBOL "MINUM" & MODAL
    // Panggil fungsi ini di tombol Centang Hijau (HTML: onclick="bukaModal()")
    function bukaModalMinum() {
        const data = ambilData();
        
        // Validasi Stok Habis
        if (data.stokSisa <= 0) {
            alert("STOK HABIS! Tidak bisa mencatat penggunaan."); 
            return;
        }

        // Tampilkan Modal
        const modal = document.getElementById('modalMinum');
        if(modal) {
            modal.style.display = 'flex';
            // Reset input form
            const inputPJ = document.getElementById('inputPJ');
            if(inputPJ) {
                inputPJ.value = '';
                inputPJ.focus();
            }
        }
    }

    function tutupModal() {
        const modal = document.getElementById('modalMinum');
        if(modal) modal.style.display = 'none';
    }

    // 5. PROSES CATAT (SINKRONISASI STOK BERKURANG)
    // Panggil ini di tombol "CATAT & KURANGI STOK"
    function simpanCatatan() {
        const inputPJ = document.getElementById('inputPJ');
        const namaPJ = inputPJ ? inputPJ.value : '';

        if (!namaPJ) {
            alert("Nama PJ wajib diisi!");
            return;
        }

        let data = ambilData();

        if (data.stokSisa > 0) {
            // A. Kurangi Stok
            data.stokSisa = data.stokSisa - 1;

            // B. Buat Log Waktu
            const now = new Date();
            const formatWaktu = now.getDate() + '/' + (now.getMonth()+1) + '/' + now.getFullYear() + ' ' + 
                                now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            // C. Masukkan ke Log
            data.logs.push({
                waktu: formatWaktu,
                obat: "REMITAL",
                pj: namaPJ
            });

            // D. Simpan & Tutup
            simpanData(data);
            tutupModal();
            
            // Feedback ke user (opsional)
            // alert("Berhasil dicatat. Stok berkurang -1");
        }
    }

    // 6. PROSES HAPUS LOG (SINKRONISASI STOK KEMBALI)
    function hapusLog(index) {
        if(confirm("Hapus data ini? Stok obat akan dikembalikan (+1).")) {
            let data = ambilData();

            // A. Hapus log
            data.logs.splice(index, 1);

            // B. Kembalikan Stok (Cek agar tidak lebih dari Awal)
            if (data.stokSisa < data.stokAwal) {
                data.stokSisa = data.stokSisa + 1;
            }

            // C. Simpan
            simpanData(data);
        }
    }

    // --- JALANKAN SAAT HALAMAN DIBUKA ---
    window.onload = function() {
        cekSesi();       // Cek apakah user sudah login
        renderTampilan(); // Tampilkan stok yang benar (8)
    };
                </script>
</body>
</html>
