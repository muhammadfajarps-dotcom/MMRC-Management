<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-layer" class="auth-container">
        <div class="login-box">
            <div class="logo-area">
                <i class="fas fa-heartbeat"></i>
                <h2>MMRC SYSTEM</h2>
                <p>Madani Mental Recovery Center</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="login-user" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-pass" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-login">MASUK SISTEM</button>
            </form>
        </div>
    </div>

    <div id="app-layer" class="app-container hidden">
        
        <aside class="sidebar">
            <div class="brand">
                <h3>MMRC ADMIN</h3>
            </div>
            <nav>
                <button onclick="app.nav('dashboard')" id="btn-dashboard" class="nav-btn active"><i class="fas fa-home"></i> Dashboard Pasien</button>
                <button onclick="app.nav('medicine')" id="btn-medicine" class="nav-btn"><i class="fas fa-pills"></i> Medicine & Stok</button>
                <button onclick="app.nav('ttv')" id="btn-ttv" class="nav-btn"><i class="fas fa-stethoscope"></i> TTV & GDS</button>
                <button onclick="app.nav('visit')" id="btn-visit" class="nav-btn"><i class="fas fa-user-md"></i> Visit Dokter</button>
                <button onclick="app.nav('crisis')" id="btn-crisis" class="nav-btn"><i class="fas fa-chart-line"></i> Pasien Crisis (BPSS)</button>
                <button onclick="app.nav('program')" id="btn-program" class="nav-btn"><i class="fas fa-clipboard-list"></i> Rencana Program</button>
                <button onclick="app.nav('therapy')" id="btn-therapy" class="nav-btn"><i class="fas fa-notes-medical"></i> Rencana Terapi</button>
            </nav>
            <div class="logout-area">
                <button onclick="app.logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <div class="main-content">
            <header>
                <h2 id="page-title">DASHBOARD</h2>
                <div class="header-tools">
                    <input type="text" id="global-search" placeholder="Cari Pasien..." onkeyup="app.search()">
                    <div class="user-profile">
                        <span>Admin Operasional</span>
                        <i class="fas fa-user-circle"></i>
                    </div>
                </div>
            </header>

            <div id="content-area">
                </div>
        </div>
    </div>

    <div id="modal-container" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" onclick="app.closeModal()">&times;</span>
            <h3 id="modal-title">Form Input</h3>
            <div id="modal-body">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
