<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMHC PRO V3.8 - Clinical System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F1F5F9; }
        .glass-header { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0,0,0,0.04); }
        input:focus, textarea:focus { border-color: #4f46e5 !important; ring: 2px; ring-color: #4f46e5; }
    </style>
</head>
<body class="text-slate-900 min-h-screen">

    <div id="login-page" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-10 text-center shadow-2xl">
            <h1 class="text-3xl font-black text-indigo-600 mb-2 italic">MMHC PRO <span class="text-slate-800">V3.8</span></h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-8">Clinical Integrated System</p>
            <form id="login-form" class="space-y-4">
                <input type="text" id="user-input" placeholder="ID Admin" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold" required>
                <input type="password" id="pass-input" placeholder="Passcode" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold" required>
                <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg">MASUK SISTEM</button>
            </form>
        </div>
    </div>

    <div id="main-content" class="hidden flex flex-col min-h-screen">
        <header class="glass-header text-white p-5 sticky top-0 z-40 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-microchip text-indigo-400"></i>
                <h1 class="text-lg font-black tracking-tighter uppercase italic">MMHC <span class="text-indigo-400">Database</span></h1>
            </div>
            <button onclick="location.reload()" class="bg-red-500/20 px-4 py-2 rounded-xl text-xs font-black">LOGOUT</button>
        </header>

        <main class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full">
            <div id="view-list" class="space-y-6">
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="search-pasien" oninput="renderPasien()" placeholder="Cari Nama/Diagnosa..." class="flex-1 bg-white p-5 rounded-3xl shadow-sm outline-none font-bold">
                    <button onclick="openModalPasien()" class="bg-indigo-600 text-white px-8 py-5 rounded-3xl font-black shadow-lg">+ DATA BARU</button>
                </div>
                <div id="list-pasien" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div id="view-detail" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <button onclick="closeDetail()" class="text-indigo-600 font-black"><i class="fas fa-chevron-left mr-2"></i> KEMBALI</button>
                    <div class="flex gap-2">
                        <button onclick="exportToWord()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black italic">WORD</button>
                        <button onclick="exportWeeklyReport()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-[10px] font-black italic">EXCEL (7H)</button>
                    </div>
                </div>

                <div id="detail-render"></div>
            </div>
        </main>
    </div>

    <div id="modal-pasien" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] w-full max-w-5xl p-8 max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-black mb-8 border-l-4 border-indigo-600 pl-4">REKAM MEDIS PASIEN</h3>
            <form id="form-pasien" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <input type="hidden" id="p-id">
                
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">I. Identitas Pasien</p>
                    <input type="text" id="p-nama" placeholder="Nama Lengkap" class="w-full bg-slate-50 p-4 rounded-2xl font-bold" required>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="p-ttl" placeholder="Tempat, Tgl Lahir" class="bg-slate-50 p-4 rounded-2xl font-bold">
                        <input type="number" id="p-umur" placeholder="Usia" class="bg-slate-50 p-4 rounded-2xl font-bold">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="p-jk" class="bg-slate-50 p-4 rounded-2xl font-bold outline-none"><option>Laki-laki</option><option>Perempuan</option></select>
                        <select id="p-status" class="bg-slate-50 p-4 rounded-2xl font-bold outline-none"><option>Belum Kawin</option><option>Kawin</option><option>Cerai</option></select>
                    </div>
                    <input type="text" id="p-pekerjaan" placeholder="Pekerjaan / Pelajar" class="w-full bg-slate-50 p-4 rounded-2xl font-bold">
                    <textarea id="p-alamat" placeholder="Alamat Lengkap" class="w-full bg-slate-50 p-4 rounded-2xl font-bold h-20"></textarea>
                    <input type="text" id="p-penjamin" placeholder="Nama & Kontak Penjamin" class="w-full bg-slate-100 p-4 rounded-2xl font-bold">
                </div>

                <div class="space-y-4">
                    <p class="text-[10px] font-black text-red-500 uppercase tracking-widest">II. Data Medis & Perencanaan</p>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="p-tgl-masuk" class="bg-slate-50 p-4 rounded-2xl font-bold">
                        <input type="time" id="p-jam-masuk" class="bg-slate-50 p-4 rounded-2xl font-bold">
                    </div>
                    
                    <textarea id="p-planning" placeholder="Planning Dokter (Rencana Tindakan)" class="w-full bg-emerald-50 border-emerald-100 p-4 rounded-2xl font-bold h-24 text-emerald-800"></textarea>
                    
                    <textarea id="p-diagnosa" placeholder="Diagnosa Dokter" class="w-full bg-indigo-50 p-4 rounded-2xl font-black h-24 text-indigo-700"></textarea>
                    
                    <div class="bg-slate-900 text-white p-6 rounded-[2rem] space-y-3">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="i-fiksasi" class="w-5 h-5 accent-indigo-500">
                            <label class="text-[10px] font-black uppercase">Intervensi Fiksasi</label>
                        </div>
                        <textarea id="p-resep" placeholder="Resep Obat Dokter..." class="w-full bg-white/10 p-3 rounded-xl text-xs outline-none h-20 border-none"></textarea>
                        <input type="text" id="i-urine" placeholder="Hasil Test Urine" class="w-full bg-white/10 p-3 rounded-xl text-xs outline-none border-none">
                    </div>
                    <input type="file" id="p-foto" accept="image/*" class="text-[10px] font-bold text-slate-400">
                    <input type="hidden" id="p-foto-base64">
                </div>

                <div class="md:col-span-2 flex gap-4">
                    <button type="button" onclick="closeModals()" class="flex-1 font-black text-slate-400">BATAL</button>
                    <button type="submit" class="flex-[3] bg-indigo-600 text-white py-5 rounded-3xl font-black shadow-xl">SIMPAN PERMANEN</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-ttv" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6 italic">Monitoring Vital Signs</h3>
            <form id="form-ttv" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[8px] font-black ml-2">TENSI (TD)</label><input type="text" id="v-td" placeholder="120/80" class="w-full bg-slate-100 p-4 rounded-xl font-bold"></div>
                    <div><label class="text-[8px] font-black ml-2">SUHU (°C)</label><input type="text" id="v-suhu" placeholder="36.5" class="w-full bg-slate-100 p-4 rounded-xl font-bold"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[8px] font-black ml-2">SATURASI (%)</label><input type="number" id="v-spo2" placeholder="98" class="w-full bg-slate-100 p-4 rounded-xl font-bold"></div>
                    <div><label class="text-[8px] font-black ml-2">RR (x/mnt)</label><input type="number" id="v-rr" placeholder="20" class="w-full bg-slate-100 p-4 rounded-xl font-bold"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[8px] font-black ml-2">BERAT (KG)</label><input type="number" id="v-bb" placeholder="60" class="w-full bg-slate-100 p-4 rounded-xl font-bold"></div>
                    <div><label class="text-[8px] font-black ml-2">TINGGI (CM)</label><input type="number" id="v-tb" placeholder="170" class="w-full bg-slate-100 p-4 rounded-xl font-bold"></div>
                </div>
                <div class="bg-orange-50 p-4 rounded-xl">
                    <label class="text-[8px] font-black text-orange-600 ml-2 uppercase">Gula Darah Sewaktu (GDS)</label>
                    <input type="number" id="v-gds" placeholder="mg/dL" class="w-full bg-white p-3 rounded-lg font-black text-orange-700">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black shadow-lg">INPUT DATA VITAL</button>
            </form>
        </div>
    </div>

    <div id="modal-obat" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6 italic">Input Stok Obat</h3>
            <form id="form-obat" class="space-y-4">
                <input type="text" id="o-nama" placeholder="Nama Obat" class="w-full bg-slate-50 p-4 rounded-xl font-bold" required>
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="o-tgl" class="bg-slate-50 p-4 rounded-xl font-bold text-xs">
                    <input type="time" id="o-jam" class="bg-slate-50 p-4 rounded-xl font-bold text-xs">
                </div>
                <input type="number" id="o-stok" placeholder="Jumlah Stok Tablet" class="w-full bg-slate-50 p-4 rounded-xl font-bold" required>
                <div class="grid grid-cols-3 gap-2 text-center bg-indigo-50 p-4 rounded-xl">
                    <div><p class="text-[8px] font-bold">Pagi</p><input type="number" id="o-pagi" value="1" class="w-full p-2 rounded-lg text-center font-bold"></div>
                    <div><p class="text-[8px] font-bold">Siang</p><input type="number" id="o-siang" value="1" class="w-full p-2 rounded-lg text-center font-bold"></div>
                    <div><p class="text-[8px] font-bold">Malam</p><input type="number" id="o-malam" value="1" class="w-full p-2 rounded-lg text-center font-bold"></div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black shadow-lg">SIMPAN STOK</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdzWrKOBqrcu6talld7MN-2flHNibEWnE",
            authDomain: "mmrc-stock.firebaseapp.com",
            projectId: "mmrc-stock",
            storageBucket: "mmrc-stock.firebasestorage.app",
            messagingSenderId: "722563453659",
            appId: "1:722563453659:web:b9f867367ecadb7a1df2fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let PASIEN = [], OBAT = [], TTV = [], SELECTED_ID = null;

        // AUTH
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            if(document.getElementById('user-input').value === "MMRC.Stock1999" && document.getElementById('pass-input').value === "Madani1999") {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                startSync();
            }
        };

        function startSync() {
            onSnapshot(collection(db, "pasien_v38"), s => { PASIEN = s.docs.map(d => ({id:d.id, ...d.data()})); renderPasien(); if(SELECTED_ID) renderDetail(); });
            onSnapshot(collection(db, "obat_v38"), s => { OBAT = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) renderDetail(); });
            onSnapshot(collection(db, "ttv_v38"), s => { TTV = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) renderDetail(); });
        }

        // PERSISTENCE: Save form as you type
        const formInputs = document.querySelectorAll('#form-pasien input, #form-pasien textarea, #form-pasien select');
        formInputs.forEach(input => {
            input.oninput = () => {
                const draft = {};
                formInputs.forEach(el => draft[el.id] = el.type === 'checkbox' ? el.checked : el.value);
                localStorage.setItem('mmhc_draft', JSON.stringify(draft));
            };
        });

        // Load draft
        window.openModalPasien = (id = null) => {
            const f = document.getElementById('form-pasien'); 
            f.reset();
            document.getElementById('p-id').value = id || '';
            
            if(!id) {
                const saved = localStorage.getItem('mmhc_draft');
                if(saved) {
                    const data = JSON.parse(saved);
                    Object.keys(data).forEach(k => {
                        const el = document.getElementById(k);
                        if(el) el.type === 'checkbox' ? el.checked = data[k] : el.value = data[k];
                    });
                }
            } else {
                const p = PASIEN.find(x => x.id === id);
                Object.keys(p).forEach(k => {
                    const el = document.getElementById(`p-${k}`);
                    if(el) el.value = p[k];
                });
                document.getElementById('i-fiksasi').checked = p.fiksasi;
                document.getElementById('i-urine').value = p.urine || '';
            }
            document.getElementById('modal-pasien').classList.remove('hidden');
        };

        document.getElementById('p-foto').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = () => document.getElementById('p-foto-base64').value = reader.result;
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        };

        document.getElementById('form-pasien').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = {
                nama: document.getElementById('p-nama').value,
                ttl: document.getElementById('p-ttl').value,
                umur: document.getElementById('p-umur').value,
                jk: document.getElementById('p-jk').value,
                status: document.getElementById('p-status').value,
                pekerjaan: document.getElementById('p-pekerjaan').value,
                alamat: document.getElementById('p-alamat').value,
                penjamin: document.getElementById('p-penjamin').value,
                tglMasuk: document.getElementById('p-tgl-masuk').value,
                jamMasuk: document.getElementById('p-jam-masuk').value,
                planning: document.getElementById('p-planning').value,
                diagnosa: document.getElementById('p-diagnosa').value,
                fiksasi: document.getElementById('i-fiksasi').checked,
                resep: document.getElementById('p-resep').value,
                urine: document.getElementById('i-urine').value,
                foto: document.getElementById('p-foto-base64').value || (id ? PASIEN.find(x => x.id === id).foto : '')
            };
            id ? await updateDoc(doc(db, "pasien_v38", id), data) : await addDoc(collection(db, "pasien_v38"), data);
            localStorage.removeItem('mmhc_draft');
            closeModals();
        };

        window.renderPasien = () => {
            const search = document.getElementById('search-pasien').value.toLowerCase();
            document.getElementById('list-pasien').innerHTML = PASIEN.filter(p => p.nama.toLowerCase().includes(search))
            .map(p => `
                <div onclick="openDetail('${p.id}')" class="bg-white p-6 rounded-[2.5rem] card-shadow cursor-pointer border-2 border-transparent hover:border-indigo-600 transition-all">
                    <div class="flex gap-4 items-center">
                        <div class="w-14 h-14 bg-slate-100 rounded-2xl overflow-hidden shadow-inner">
                            ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover">` : `<i class="fas fa-user text-slate-300 m-4"></i>`}
                        </div>
                        <div class="overflow-hidden">
                            <h4 class="font-black text-slate-800 truncate">${p.nama}</h4>
                            <p class="text-[9px] font-black text-indigo-500 uppercase truncate">${p.diagnosa}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.openDetail = (id) => { 
            SELECTED_ID = id; 
            document.getElementById('view-list').classList.add('hidden'); 
            document.getElementById('view-detail').classList.remove('hidden'); 
            renderDetail(); 
        };

        window.closeDetail = () => { 
            SELECTED_ID = null; 
            document.getElementById('view-list').classList.remove('hidden'); 
            document.getElementById('view-detail').classList.add('hidden'); 
        };

        function renderDetail() {
            const p = PASIEN.find(x => x.id === SELECTED_ID);
            if(!p) return;
            const ttvP = TTV.filter(t => t.pasienId === SELECTED_ID).reverse();
            const obatP = OBAT.filter(o => o.pasienId === SELECTED_ID);

            document.getElementById('detail-render').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white p-8 rounded-[3rem] card-shadow flex gap-8 flex-col md:flex-row">
                            <div class="w-32 h-32 rounded-[2rem] bg-slate-100 overflow-hidden flex-shrink-0">
                                <img src="${p.foto}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1">
                                <h2 class="text-3xl font-black">${p.nama}</h2>
                                <p class="text-xs font-bold text-slate-400 mb-4">${p.pekerjaan} | ${p.status}</p>
                                <div class="grid grid-cols-2 gap-4 text-[10px] font-bold">
                                    <p><span class="text-indigo-500">TTL:</span> ${p.ttl}</p>
                                    <p><span class="text-indigo-500">PENJAMIN:</span> ${p.penjamin}</p>
                                    <p class="col-span-2"><span class="text-indigo-500">ALAMAT:</span> ${p.alamat}</p>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-emerald-600 text-white p-6 rounded-[2.5rem]">
                                <h5 class="text-[9px] font-black uppercase mb-2 opacity-70 italic">Doctor's Planning</h5>
                                <p class="text-sm font-bold leading-relaxed">${p.planning || 'Belum ada planning'}</p>
                            </div>
                            <div class="bg-indigo-600 text-white p-6 rounded-[2.5rem]">
                                <h5 class="text-[9px] font-black uppercase mb-2 opacity-70 italic">Final Diagnosis</h5>
                                <p class="text-sm font-black leading-relaxed">${p.diagnosa || 'Belum ada diagnosa'}</p>
                            </div>
                        </div>

                        <div class="bg-white p-8 rounded-[3rem] card-shadow">
                            <div class="flex justify-between items-center mb-4">
                                <h5 class="text-[10px] font-black uppercase tracking-widest text-slate-400">Resep & Terapi Obat</h5>
                                <button onclick="openModalObat()" class="text-indigo-600 text-[10px] font-black">+ TAMBAH STOK</button>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-2xl mb-6 italic text-sm border-l-4 border-indigo-500">
                                "${p.resep || 'Tidak ada resep tertulis'}"
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${obatP.map(o => `
                                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                                        <div>
                                            <p class="text-xs font-black">${o.nama}</p>
                                            <p class="text-[9px] text-slate-400 font-bold">${o.pagi}-${o.siang}-${o.malam} Tablet</p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-xl font-black text-indigo-600">${calculateRealtimeStock(o)}</p>
                                            <p class="text-[8px] font-black opacity-30">SISA TAB</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-[3rem] card-shadow">
                            <div class="flex justify-between items-center mb-6">
                                <h5 class="text-[10px] font-black uppercase tracking-widest text-slate-400">Monitoring Vital</h5>
                                <button onclick="openModalTTV()" class="bg-red-500 text-white px-3 py-1 rounded-lg text-[10px] font-black">+ CEK</button>
                            </div>
                            <div class="space-y-4 max-h-[600px] overflow-y-auto pr-2">
                                ${ttvP.map(t => `
                                    <div class="bg-slate-50 p-4 rounded-2xl border-l-4 ${t.gds > 200 ? 'border-orange-500' : 'border-emerald-500'}">
                                        <div class="flex justify-between text-[8px] font-black text-slate-400 mb-2">
                                            <span>${t.tgl} | ${t.jam}</span>
                                            <span class="text-orange-600">GDS: ${t.gds || '-'}</span>
                                        </div>
                                        <div class="grid grid-cols-3 gap-2 text-center">
                                            <div><p class="text-[8px] font-bold">TD</p><p class="text-[10px] font-black">${t.td}</p></div>
                                            <div><p class="text-[8px] font-bold">SpO2</p><p class="text-[10px] font-black">${t.spo2}%</p></div>
                                            <div><p class="text-[8px] font-bold">RR</p><p class="text-[10px] font-black">${t.rr}</p></div>
                                            <div><p class="text-[8px] font-bold">SUHU</p><p class="text-[10px] font-black">${t.suhu}°C</p></div>
                                            <div><p class="text-[8px] font-bold">BB</p><p class="text-[10px] font-black">${t.bb}kg</p></div>
                                            <div><p class="text-[8px] font-bold">TB</p><p class="text-[10px] font-black">${t.tb}cm</p></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // AUTO-STOK ENGINE
        function calculateRealtimeStock(o) {
            const start = new Date(`${o.tglBeri}T${o.jamBeri || '08:00'}`);
            const now = new Date();
            if (now < start) return o.stok;
            const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
            const daily = (parseInt(o.pagi)||0) + (parseInt(o.siang)||0) + (parseInt(o.malam)||0);
            let consumed = diffDays * daily;
            const h = now.getHours();
            if (h >= 8) consumed += (parseInt(o.pagi)||0);
            if (h >= 13) consumed += (parseInt(o.siang)||0);
            if (h >= 19) consumed += (parseInt(o.malam)||0);
            return Math.max(0, o.stok - consumed);
        }

        // TTV SUBMIT
        window.openModalTTV = () => {
            document.getElementById('form-ttv').reset();
            document.getElementById('modal-ttv').classList.remove('hidden');
        };

        document.getElementById('form-ttv').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "ttv_v38"), {
                pasienId: SELECTED_ID,
                td: document.getElementById('v-td').value,
                suhu: document.getElementById('v-suhu').value,
                spo2: document.getElementById('v-spo2').value,
                rr: document.getElementById('v-rr').value,
                bb: document.getElementById('v-bb').value,
                tb: document.getElementById('v-tb').value,
                gds: document.getElementById('v-gds').value,
                tgl: new Date().toLocaleDateString('id-ID'),
                jam: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
            });
            closeModals();
        };

        // OBAT SUBMIT
        window.openModalObat = () => {
            document.getElementById('form-obat').reset();
            document.getElementById('o-tgl').value = new Date().toISOString().split('T')[0];
            document.getElementById('modal-obat').classList.remove('hidden');
        };

        document.getElementById('form-obat').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "obat_v38"), {
                pasienId: SELECTED_ID,
                nama: document.getElementById('o-nama').value,
                stok: parseInt(document.getElementById('o-stok').value),
                tglBeri: document.getElementById('o-tgl').value,
                jamBeri: document.getElementById('o-jam').value,
                pagi: document.getElementById('o-pagi').value,
                siang: document.getElementById('o-siang').value,
                malam: document.getElementById('o-malam').value
            });
            closeModals();
        };

        // EXPORT LOGIC (WORD)
        window.exportToWord = () => {
            const p = PASIEN.find(x => x.id === SELECTED_ID);
            const content = `DATA REKAM MEDIS - ${p.nama}\nPlanning: ${p.planning}\nDiagnosa: ${p.diagnosa}\nResep: ${p.resep}`;
            const blob = new Blob([content], {type: 'application/msword'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `REKAM_MEDIS_${p.nama}.doc`;
            link.click();
        };

        window.closeModals = () => document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));
    </script>
</body>
