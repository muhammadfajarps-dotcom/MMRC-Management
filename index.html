<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-slate-800">

    <div id="auth-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
        <div class="text-center w-full max-w-xs">
            <img src="logo.png" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block'" class="h-24 mx-auto mb-4 object-contain">
            <h1 id="logo-fallback" class="hidden text-3xl font-black text-red-800 mb-4 tracking-tighter">MMRC SYSTEM</h1>
            
            <div class="bg-white border-2 border-red-800 p-6 rounded-2xl shadow-[8px_8px_0px_0px_rgba(153,27,27,1)]">
                <input id="login-user" class="w-full p-3 bg-red-50 border border-red-200 rounded-xl mb-3 font-bold text-center outline-none focus:ring-2 ring-red-800" placeholder="ID STAFF">
                <input id="login-pass" type="password" class="w-full p-3 bg-red-50 border border-red-200 rounded-xl mb-4 font-bold text-center outline-none focus:ring-2 ring-red-800" placeholder="PASSWORD">
                <button onclick="app.login()" class="w-full bg-red-800 text-white py-3 rounded-xl font-bold hover:bg-red-900 transition transform active:scale-95">MASUK SISTEM</button>
            </div>
        </div>
    </div>

    <div id="app-layer" class="hidden flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-red-900 text-white flex-col hidden md:flex shadow-2xl relative z-20">
            <div class="p-6 border-b border-red-800 text-center">
                <img src="logo.png" onerror="this.style.display='none'" class="h-16 mx-auto bg-white rounded-lg p-1 mb-2">
                <h2 class="font-black tracking-widest text-lg">MMRC ADMIN</h2>
            </div>
            
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button onclick="app.nav('dashboard')" id="btn-dashboard" class="nav-btn active"><i class="fas fa-users w-6"></i> Data Pasien</button>
                <button onclick="app.nav('medicine')" id="btn-medicine" class="nav-btn"><i class="fas fa-pills w-6"></i> Obat & Stok</button>
                <button onclick="app.nav('ttv')" id="btn-ttv" class="nav-btn"><i class="fas fa-heartbeat w-6"></i> TTV & GDS</button>
                <div class="border-t border-red-800 my-2"></div>
                <button onclick="app.nav('visit')" id="btn-visit" class="nav-btn"><i class="fas fa-user-md w-6"></i> Visit Dokter</button>
                <button onclick="app.nav('crisis')" id="btn-crisis" class="nav-btn"><i class="fas fa-chart-line w-6"></i> Crisis Score</button>
                <div class="border-t border-red-800 my-2"></div>
                <button onclick="app.nav('program')" id="btn-program" class="nav-btn"><i class="fas fa-calendar-check w-6"></i> Program</button>
                <button onclick="app.nav('therapy')" id="btn-therapy" class="nav-btn"><i class="fas fa-brain w-6"></i> Therapy Log</button>
            </nav>
            
            <button onclick="location.reload()" class="p-4 bg-red-950 hover:bg-black text-center font-bold text-xs tracking-widest transition">LOGOUT KELUAR</button>
        </aside>

        <main class="flex-1 flex flex-col h-full bg-gray-100">
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10">
                <div class="flex items-center gap-4">
                    <button class="md:hidden text-red-800 text-xl" onclick="document.querySelector('aside').classList.toggle('hidden'); document.querySelector('aside').classList.toggle('absolute'); document.querySelector('aside').classList.toggle('h-full');"><i class="fas fa-bars"></i></button>
                    <h2 id="page-title" class="font-black text-2xl text-slate-800 uppercase tracking-tighter">DASHBOARD</h2>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="bg-gray-100 rounded-full px-4 py-2 flex items-center border border-gray-200">
                        <i class="fas fa-search text-gray-400"></i>
                        <input id="global-search" onkeyup="app.search()" type="text" placeholder="Cari Pasien..." class="bg-transparent border-none outline-none ml-2 text-sm font-bold w-40 md:w-64">
                    </div>
                </div>
            </header>

            <div id="main-content" class="flex-1 p-6 overflow-y-auto pb-24">
                </div>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 z-[100] bg-black/50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-pop">
            <div class="px-6 py-4 border-b bg-red-50 flex justify-between items-center">
                <h3 id="modal-title" class="font-black text-xl text-red-800">FORM INPUT</h3>
                <button onclick="app.closeModal()" class="w-8 h-8 rounded-full bg-white text-red-800 hover:bg-red-800 hover:text-white transition flex items-center justify-center font-bold">✕</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
