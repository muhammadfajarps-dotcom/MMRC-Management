    <script>
         // --- 1. DATABASE CONFIG ---
const DB_KEY = 'MMRC_DATABASE_PRO';
const initialDB = { patients: [] };

const app = {
    // Properti State
    data: JSON.parse(localStorage.getItem(DB_KEY)) || initialDB,
    currentPage: 'dashboard',
    signaturePad: null,
    chartInstance: null,

    // --- 2. CORE METHODS (WAJIB ADA KOMA DI SETIAP AKHIR KURUNG KURAWAL) ---
    saveDB() {
        localStorage.setItem(DB_KEY, JSON.stringify(this.data));
    },

    login(e) {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u === 'OPERASIONAL.MMRC' && p === 'MADANI1999') {
            document.getElementById('auth-layer').classList.add('hidden');
            document.getElementById('app-layer').classList.remove('hidden');
            document.getElementById('app-layer').classList.add('flex');
            this.nav('dashboard');
        } else {
            Swal.fire('Error', 'Akses Ditolak', 'error');
        }
    },

    nav(page) {
        this.currentPage = page;
        document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
        const navBtn = document.getElementById(`nav-${page}`);
        if(navBtn) navBtn.classList.add('active');
        
        const content = document.getElementById('main-content');
        const title = document.getElementById('page-title');
        content.innerHTML = '';
        
        if(this.chartInstance) { this.chartInstance.destroy(); this.chartInstance = null; }

        switch(page) {
            case 'dashboard': title.innerText = "Registrasi & Pasien"; this.renderDashboard(content); break;
            case 'medicine': title.innerText = "Manajemen Obat"; this.renderMedicine(content); break;
            case 'ttv': title.innerText = "Monitoring TTV"; this.renderTTV(content); break;
            case 'visit': title.innerText = "Log Visit Dokter"; this.renderVisit(content); break;
            case 'crisis': title.innerText = "BPSS Score Tracking"; this.renderCrisis(content); break;
            case 'program': title.innerText = "Program & Terapi"; this.renderProgram(content); break;
            case 'terapi': title.innerText = "Rencana Terapi"; this.renderTerapiList(content); break;
        }
    },

    // --- 3. RENDERERS ---
    renderDashboard(c) {
        c.innerHTML = `
        <div class="mb-6"><button onclick="app.modalAddPatient()" class="bg-mmrc-primary text-white px-5 py-2.5 rounded-lg shadow hover:bg-teal-700 font-medium"><i class="fas fa-user-plus mr-2"></i>Pasien Baru</button></div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            ${this.data.patients.map((p) => `
            <div class="bg-white rounded-xl shadow border border-gray-100 overflow-hidden hover:shadow-lg transition flex flex-col h-full">
                <div class="h-20 bg-gradient-to-r from-teal-600 to-emerald-600 relative">
                    <div class="absolute -bottom-8 left-6">
                        <img src="${p.registration.photo || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-full border-4 border-white object-cover bg-gray-200 shadow-sm">
                    </div>
                </div>
                <div class="pt-10 px-6 pb-6 flex-1 flex flex-col">
                    <div class="flex justify-between items-start mb-2">
                        <div><h3 class="font-bold text-gray-800 text-lg">${p.registration.name}</h3></div>
                        <span class="bg-teal-50 text-teal-700 text-xs px-2 py-1 rounded font-bold">${p.registration.age} Th</span>
                    </div>
                    <div class="mt-5 pt-4 border-t grid grid-cols-3 gap-2">
                        <button onclick="app.modalEditTerapi('${p.id}')" class="bg-teal-100 text-teal-700 py-1.5 rounded text-xs font-bold hover:bg-teal-200">TERAPI</button>
                        <button onclick="app.exportWord('${p.id}')" class="bg-blue-100 text-blue-700 py-1.5 rounded text-xs font-bold hover:bg-blue-200">DOC</button>
                        <button onclick="app.deletePatient('${p.id}')" class="bg-red-100 text-red-700 py-1.5 rounded text-xs font-bold hover:bg-red-200">HAPUS</button>
                    </div>
                </div>
            </div>`).join('')}
        </div>`;
    },

    // --- 4. MODALS & SUBMITS ---
    modalEditTerapi(id) {
        const p = this.data.patients.find(x => x.id === id);
        document.getElementById('modal-title').innerText = "Rencana Terapi: " + p.registration.name;
        document.getElementById('modal-body').innerHTML = `
            <form onsubmit="app.submitTerapi(event, '${id}')" class="space-y-4">
                <textarea name="terapi" class="input-field h-40" placeholder="Tuliskan rencana terapi di sini...">${p.therapy_plan || ''}</textarea>
                <button class="w-full bg-teal-600 text-white py-2 rounded font-bold shadow-lg">Simpan Rencana</button>
            </form>
        `;
        document.getElementById('modal-container').classList.remove('hidden');
        document.getElementById('modal-container').classList.add('flex');
    },

    submitTerapi(e, id) {
        e.preventDefault();
        const p = this.data.patients.find(x => x.id === id);
        p.therapy_plan = e.target.terapi.value;
        this.saveDB();
        this.closeModal();
        Swal.fire('Tersimpan', 'Rencana terapi telah diupdate', 'success');
        this.nav(this.currentPage);
    },

    closeModal() {
        document.getElementById('modal-container').classList.add('hidden');
    },

    async toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    },

    // --- 5. EXPORT SYSTEM ---
    exportWord(pid) {
        const p = this.data.patients.find(x => x.id === pid);
        const { Document, Packer, Paragraph } = docx;

        const doc = new Document({
            sections: [{
                children: [
                    new Paragraph({ text: "MEDICAL REPORT MMRC", heading: docx.HeadingLevel.HEADING_1 }),
                    new Paragraph({ text: "Nama: " + p.registration.name }),
                    new Paragraph({ text: "Terapi: " + (p.therapy_plan || 'Belum ada data') })
                ]
            }]
        });

        Packer.toBlob(doc).then(blob => {
            saveAs(blob, `Report_${p.registration.name}.docx`);
        });
    }
}; 

    exportExcelFull() {
        const wb = XLSX.utils.book_new();
        const wsData = this.data.patients.map(p => {
            Nama: p.registration.name,
            Usia: p.registration.age,
            Alamat: p.registration.address,
            Diagnosa: p.diagnosis.entry_diagnosis
        });
        const ws = XLSX.utils.json_to_sheet(wsData);
        XLSX.utils.book_append_sheet(wb, ws, "Daftar Pasien");
        XLSX.writeFile(wb, "Database_MMRC.xlsx");
    },

    // --- HELPERS ---
    toBase64: (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    }),

    closeModal() {
        document.getElementById('modal-container').classList.add('hidden');
    }
};

        // --- 2. APP CONTROLLER ---
        const app = {

  filterByText(list, term) {
    if (!term) return list;
    term = term.toLowerCase();
    return list.filter(item =>
      JSON.stringify(item).toLowerCase().includes(term)
    );
  },

  exportWord(pid){
    const p = app.data.patients.find(x=>x.id===pid);
    const doc = new docx.Document({
      sections:[{
        children:[
          new docx.Paragraph({text:`DATA PASIEN: ${p.registration.name}`, bold:true}),
          new docx.Paragraph(`Usia: ${p.registration.age}`),
          new docx.Paragraph(`Alamat: ${p.registration.address}`),
          new docx.Paragraph(" "),
          new docx.Paragraph("RIWAYAT"),
          new docx.Paragraph(p.history.curr_cond || ""),
          new docx.Paragraph(" "),
          new docx.Paragraph("TTV"),
          ...p.ttv_logs.map(t=>new docx.Paragraph(`${t.date} TD:${t.td} SAT:${t.sat}`)),
          new docx.Paragraph(" "),
          new docx.Paragraph("VISIT"),
          ...p.visits.map(v=>new docx.Paragraph(v.notes))
        ] 
      }]
    });

    docx.Packer.toBlob(doc).then(blob=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`${p.registration.name}.docx`;
      a.click();
    });
  },
            // ==== UNIVERSAL EDIT & DELETE ====
editItem(pid, key, idx){
  const p = app.data.patients.find(x=>x.id===pid);
  const item = p[key][idx];

  let form = '';
  for(const k in item){
    if(k === 'date') continue;
    form += `<label class="block text-xs mt-2">${k}</label>
             <input id="f_${k}" value="${item[k]}" class="input-field">`;
  }

  Swal.fire({
    title:'Edit Data',
    html:form,
    preConfirm:()=>{
      for(const k in item){
        if(k!=='date'){
          item[k]=document.getElementById('f_'+k).value;
        }
      }
    }
  }).then(()=>{
    app.saveDB();
    app.nav(app.currentPage);
  });
},

deleteItem(pid,key,idx){
  const p=app.data.patients.find(x=>x.id===pid);
  Swal.fire({
    title:'Hapus?',
    icon:'warning',
    showCancelButton:true
  }).then(r=>{
    if(r.isConfirmed){
      p[key].splice(idx,1);
      app.saveDB();
      app.nav(app.currentPage);
    }
  });
},

// ==== EXPORT SEMUA ====
exportWordAll(){
  const doc = new docx.Document({
    sections:[{
      children: app.data.patients.flatMap(p=>[
        new docx.Paragraph({text:p.registration.name,bold:true}),
        new docx.Paragraph(`Usia: ${p.registration.age}`),
        new docx.Paragraph(`Alamat: ${p.registration.address}`),
        new docx.Paragraph(" ")
      ])
    }]
  });
  docx.Packer.toBlob(doc).then(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download="MMRC_ALL.docx";
    a.click();
  });
},

exportExcelAll(){
  const data = app.data.patients.map(p=>({
    Nama:p.registration.name,
    Usia:p.registration.age,
    Alamat:p.registration.address
  },
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Pasien");
  XLSX.writeFile(wb,"MMRC_ALL.xlsx");
},

                const html = `

                            <i class="fas fa-user-plus"></i> Registrasi Masuk Pasien
                        </button>

                        doc_name: f.doc_name.value,
                        entry_diagnosis: f.entry_diag.value,
                        planning: f.plan.value,
                        interventions: {
                            injection: f.int_inj.checked,
                            fixation: f.int_fix.checked,
                            urine: f.int_urine.checked,
                            urine_note: f.urine_note.value
                        },
                        prescription: f.rx.value
                    },
                    medicine_stock: [], medicine_logs: [], ttv_logs: [], visits: [], bpss_scores: { h1:[], h2:[], h3:[], h4:[], h5:[], h6:[], h7:[] }, 
                    program: {}, therapy_plan: ''
                };

                app.data.patients.push(newPatient);
                app.saveDB();
                app.closeModal();
                app.nav('dashboard');
                Swal.fire('Sukses', 'Data Pasien Tersimpan', 'success');
            },

            // ADD MEDICINE STOCK
            modalAddMedicine: (id) => {
                // ... (Logic for adding medicine stock input form)
                const p = app.data.patients.find(x => x.id === id);
                document.getElementById('modal-title').innerText = "Tambah Stok Obat: " + p.registration.name;
                document.getElementById('modal-body').innerHTML = `
                    <form onsubmit="app.submitMedicine(event, '${id}')" class="space-y-4">
                        <div><label class="label-text">Nama Obat</label><input name="name" required class="input-field"></div>
                        <div class="flex gap-4">
                            <div class="flex-1"><label class="label-text">Jumlah (Tablet/Pcs)</label><input type="number" name="qty" required class="input-field"></div>
                            <div class="flex-1"><label class="label-text">Estimasi Habis</label><input type="date" name="est_date" class="input-field"></div>
                        </div>
                        <button class="w-full bg-teal-600 text-white py-2 rounded">Tambah Stok</button>
                    </form>
                `;
                document.getElementById('modal-container').classList.remove('hidden');
                document.getElementById('modal-container').classList.add('flex');
            },

            submitMedicine: (e, id) => {
                e.preventDefault();
                const p = app.data.patients.find(x => x.id === id);
                p.medicine_stock.push({
                    name: e.target.name.value,
                    init_stock: parseInt(e.target.qty.value),
                    used_stock: 0,
                    est_end_date: e.target.est_date.value
                });
                app.saveDB();
                app.closeModal();
                app.nav('medicine');
            },

            useMedicine: (pid, medIdx) => {
                Swal.fire({
                    title: 'Konfirmasi Penggunaan',
                    html: '<input id="swal-input1" class="swal2-input" placeholder="Nama PJ"> <input id="swal-input2" class="swal2-input" placeholder="Keterangan (Pagi/Siang/Malam)">',
                    focusConfirm: false,
                    preConfirm: () => {
                        return [document.getElementById('swal-input1').value, document.getElementById('swal-input2').value]
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const [pj, note] = result.value;
                        if(!pj) return Swal.fire('Error', 'Nama PJ wajib diisi!', 'error');
                        
                        const p = app.data.patients.find(x => x.id === pid);
                        const med = p.medicine_stock[medIdx];
                        
                        med.used_stock += 1;
                        p.medicine_logs.push({
                            date: new Date().toISOString(),
                            medicine_name: med.name,
                            notes: note,
                            pic_name: pj
                        });
                        app.saveDB();
                        app.nav('medicine');
                    }
                });
            },

            // MODAL ADD BPSS (Complex Form)
            modalAddBPSS: (id) => {
    document.getElementById('modal-title').innerText = "Input BPSS (H1–H7)";
    document.getElementById('modal-body').innerHTML = `
        <form onsubmit="app.submitBPSS(event, '${id}')" class="space-y-4">
            <div>
                <label class="label-text">Hari Ke</label>
                <select name="day" class="input-field">
                    <option value="h1">H1</option>
                    <option value="h2">H2</option>
                    <option value="h3">H3</option>
                    <option value="h4">H4</option>
                    <option value="h5">H5</option>
                    <option value="h6">H6</option>
                    <option value="h7">H7</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="label-text">Biological</label><input type="number" max="25" min="0" name="bio" required class="input-field"></div>
                <div><label class="label-text">Psychological</label><input type="number" max="25" min="0" name="psy" required class="input-field"></div>
                <div><label class="label-text">Social</label><input type="number" max="25" min="0" name="soc" required class="input-field"></div>
                <div><label class="label-text">Spiritual</label><input type="number" max="25" min="0" name="spi" required class="input-field"></div>
            </div>
            <textarea name="eval" class="input-field" placeholder="Evaluasi..."></textarea>
            <button class="w-full bg-indigo-600 text-white py-2 rounded">Simpan</button>
        </form>
    `;
    document.getElementById('modal-container').classList.remove('hidden');
    document.getElementById('modal-container').classList.add('flex');
},

            submitBPSS: (e, id) => {
                e.preventDefault();
                const p = app.data.patients.find(x => x.id === id);
                const d = e.target.day.value;
                p.bpss_scores[d].push({
                    date: new Date().toISOString(),
                    bio: parseInt(e.target.bio.value),
                    psy: parseInt(e.target.psy.value),
                    soc: parseInt(e.target.soc.value),
                    spi: parseInt(e.target.spi.value),
                    discharge_eval: e.target.eval.value
                });
                app.saveDB();
                app.closeModal();
                app.nav('crisis');
            },
            
            // MODAL VISIT DENGAN SIGNATURE
            modalAddVisit: (id) => {
                document.getElementById('modal-title').innerText = "Input Visit Dokter";
                document.getElementById('modal-body').innerHTML = `
                     <div class="space-y-4">
                        <input type="file" id="visit_photo" class="input-field">
                        <textarea id="visit_note" class="input-field h-24" placeholder="Catatan hasil wawancara dokter..."></textarea>
                        <div class="border border-gray-300 rounded">
                            <p class="text-xs bg-gray-100 p-2 border-b">Tanda Tangan Dokter (Draw Here)</p>
                            <canvas id="sig-pad" class="w-full h-40 touch-none"></canvas>
                        </div>
                        <button onclick="app.submitVisit('${id}')" class="w-full bg-purple-600 text-white py-2 rounded">Simpan Visit</button>
                     </div>
                `;
                document.getElementById('modal-container').classList.remove('hidden');
                document.getElementById('modal-container').classList.add('flex');
                
                setTimeout(() => {
                    const canvas = document.getElementById('sig-pad');
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                    app.signaturePad = new SignaturePad(canvas);
                }, 100);
            },

            submitVisit: async (id) => {
                if(app.signaturePad.isEmpty()) return Swal.fire('Error', 'Tanda tangan diperlukan', 'error');
                
                const p = app.data.patients.find(x => x.id === id);
                const photoInput = document.getElementById('visit_photo');
                let photo = null;
                if(photoInput.files[0]) photo = await app.toBase64(photoInput.files[0]);

                p.visits.push({
                    date: new Date().toISOString(),
                    photo: photo,
                    notes: document.getElementById('visit_note').value,
                    signature: app.signaturePad.toDataURL()
                });
                app.saveDB();
                app.closeModal();
                app.nav('visit');
            },
            
            // TTV Modal Logic
            modalAddTTV: (id) => {
                document.getElementById('modal-title').innerText = "Input TTV & GDS";
                document.getElementById('modal-body').innerHTML = `
                    <form onsubmit="app.submitTTV(event, '${id}')" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="label-text">TD (mmHg)</label><input name="td" class="input-field"></div>
                            <div><label class="label-text">HR / Nadi</label><input name="hr" class="input-field"></div>
                            <div><label class="label-text">Saturasi (%)</label><input name="sat" class="input-field"></div>
                            <div><label class="label-text">RR (x/mnt)</label><input name="rr" class="input-field"></div>
                            <div><label class="label-text">TB (cm)</label><input name="tb" class="input-field"></div>
                            <div><label class="label-text">BB (kg)</label><input name="bb" class="input-field"></div>
                            <div class="col-span-2"><label class="label-text">Keterangan GDS</label><input name="gds" class="input-field"></div>
                        </div>
                        <button class="w-full bg-blue-600 text-white py-2 rounded">Simpan Data</button>
                    </form>
                `;
                document.getElementById('modal-container').classList.remove('hidden');
                document.getElementById('modal-container').classList.add('flex');
            },

            submitTTV: (e, id) => {
                e.preventDefault();
                const p = app.data.patients.find(x => x.id === id);
                p.ttv_logs.push({
                    date: new Date().toISOString(),
                    td: e.target.td.value,
                    sat: e.target.sat.value,
                    rr: e.target.rr.value,
                    tb: e.target.tb.value,
                    bb: e.target.bb.value,
                    gds_note: e.target.gds.value
                });
                app.saveDB();
                app.closeModal();
                app.nav('ttv');
            },

            // --- UTILS ---
            closeModal: () => {
                document.getElementById('modal-container').classList.add('hidden');
                document.getElementById('modal-container').classList.remove('flex');
            },
            
            deletePatient: (id) => {
                Swal.fire({
                    title: 'Hapus Pasien?',
                    text: "Data yang dihapus tidak dapat dikembalikan!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    confirmButtonText: 'Ya, Hapus!'
                }).then((result) => {
                    if (result.isConfirmed) {
                        app.data.patients = app.data.patients.filter(p => p.id !== id);
                        app.saveDB();
                        app.nav('dashboard');
                        Swal.fire('Terhapus!', 'Data pasien telah dihapus.', 'success');
                    }
                })
            },

            search: () => {
                const term = document.getElementById('global-search').value.toLowerCase();
                // Simple DOM Filtering based on the card text content
                const items = document.querySelectorAll('#main-content > div.grid > div, #main-content .bg-white');
                items.forEach(item => {
                    item.style.display = item.innerText.toLowerCase().includes(term) ? 'block' : 'none';
                });
            },

            exportCurrentData(){
                const wb=XLSX.utils.book_new();
                const pasien = app.data.patients.map(p=>({
                    Nama:p.registration.name,
                    Usia:p.registration.age,
                    Alamat:p.registration.address
                }));
                    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pasien),"Pasien");

                let ttv=[];
                    app.data.patients.forEach(p=>{
                    p.ttv_logs.forEach(t=>{
                    ttv.push({Pasien:p.registration.name,...t});
                });
             });
                    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ttv),"TTV");

                    XLSX.writeFile(wb,"MMRC_FULL.xlsx");
            }


            modalEditProgram: (id) => {
                const p = app.data.patients.find(x => x.id === id);
                document.getElementById('modal-title').innerText = "Rencana Program: " + p.registration.name;
                document.getElementById('modal-body').innerHTML = `
                    <form onsubmit="app.submitProgram(event, '${id}')" class="space-y-4">
                        <div>
                            <label class="label-text">Paket Program</label>
                            <select name="pkg" class="input-field">
                                <option value="Reguler" ${p.program?.package === 'Reguler' ? 'selected' : ''}>Reguler</option>
                                <option value="Eksklusif" ${p.program?.package === 'Eksklusif' ? 'selected' : ''}>Eksklusif</option>
                            </select>
                        </div>
                        <div>
                            <label class="label-text">Durasi</label>
                            <select name="dur" class="input-field">
                                <option value="7" ${p.program?.duration === '7' ? 'selected' : ''}>7 Hari (Detox)</option>
                                <option value="14" ${p.program?.duration === '14' ? 'selected' : ''}>14 Hari</option>
                                <option value="30" ${p.program?.duration === '30' ? 'selected' : ''}>30 Hari</option>
                                <option value="60" ${p.program?.duration === '60' ? 'selected' : ''}>60 Hari</option>
                            </select>
                        </div>
                        <button class="w-full bg-teal-600 text-white py-2 rounded">Simpan Program</button>
                    </form>
                `;
                document.getElementById('modal-container').classList.remove('hidden');
                document.getElementById('modal-container').classList.add('flex');
            },

            submitProgram: (e, id) => {
                e.preventDefault();
                const p = app.data.patients.find(x => x.id === id);
                p.program = { package: e.target.pkg.value, duration: e.target.dur.value };
                app.saveDB();
                app.closeModal();
                app.nav('program');
            },

            modalEditTerapi: (id) => {
                const p = app.data.patients.find(x => x.id === id);
                document.getElementById('modal-title').innerText = "Rencana Terapi: " + p.registration.name;
                document.getElementById('modal-body').innerHTML = `
                    <form onsubmit="app.submitTerapi(event, '${id}')" class="space-y-4">
                        <textarea name="terapi" class="input-field h-40">${p.therapy_plan || ''}</textarea>
                        <button class="w-full bg-teal-600 text-white py-2 rounded">Simpan Rencana</button>
                    </form>
                `;
                document.getElementById('modal-container').classList.remove('hidden');
                document.getElementById('modal-container').classList.add('flex');
            },
            
            submitTerapi: (e, id) => {
                e.preventDefault();
                const p = app.data.patients.find(x => x.id === id);
                p.therapy_plan = e.target.terapi.value;
                app.saveDB();
                app.closeModal();
                app.nav('terapi');
            }
        };

        // Initialize empty state if needed
        if(app.data.patients.length === 0) {
            // Optional: Insert dummy data for demo purposes? No, keep it clean.
        }
    
    </script>
</body>
</html>
