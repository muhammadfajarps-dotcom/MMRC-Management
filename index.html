<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Stock 1999 - Medical System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: {
                            50: '#fdf2f2',
                            100: '#fde8e8',
                            600: '#9b1c1c', // Merah Maroon Terang
                            700: '#771d1d', // Merah Maroon Standar
                            800: '#63171b', // Merah Maroon Gelap
                            900: '#4a1114', // Merah Maroon Sangat Gelap
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-field {
            width: 100%;
            padding: 10px 12px;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            font-size: 0.85rem;
            transition: all 0.3s;
            outline: none;
        }
        .input-field:focus {
            border-color: #9b1c1c;
            box-shadow: 0 0 0 3px rgba(155, 28, 28, 0.1);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9b1c1c; }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden flex flex-col">

    <div id="auth-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-maroon-900 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center border-4 border-maroon-800">
            <div class="w-20 h-20 bg-maroon-50 rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-maroon-100">
                <i class="fas fa-clinic-medical text-3xl text-maroon-700"></i>
            </div>
            <h1 class="text-2xl font-black text-maroon-800 mb-1">MMRC STOCK 1999</h1>
            <p class="text-xs text-slate-400 mb-6 font-bold tracking-widest uppercase">Medical Management System</p>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] font-bold text-maroon-700 ml-1">USERNAME</label>
                    <input type="text" id="login-user" class="input-field bg-slate-50 font-bold text-center" placeholder="OPERASIONAL.MMRC">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-maroon-700 ml-1">PASSWORD</label>
                    <input type="password" id="login-pass" class="input-field bg-slate-50 font-bold text-center" placeholder="••••••••">
                </div>
                <button onclick="app.login()" class="w-full bg-maroon-700 hover:bg-maroon-800 text-white py-3 rounded-xl font-bold transition shadow-lg mt-4">
                    MASUK SISTEM
                </button>
            </div>
            <p class="mt-8 text-[9px] text-slate-300">© 2024 MMRC SYSTEM V.3.0</p>
        </div>
    </div>

    <div id="app-layer" class="hidden flex h-full">
        
        <div class="w-64 bg-white border-r border-slate-200 flex flex-col hidden md:flex">
            <div class="p-6 border-b border-slate-100 flex items-center gap-3">
                <div class="w-10 h-10 bg-maroon-700 rounded-lg flex items-center justify-center text-white shadow-lg shadow-maroon-200">
                    <i class="fas fa-heartbeat"></i>
                </div>
                <div>
                    <h2 class="font-black text-maroon-800 text-lg leading-none">MMRC</h2>
                    <p class="text-[9px] font-bold text-slate-400">STOCK 1999</p>
                </div>
            </div>
            
            <nav class="flex-1 overflow-y-auto p-4 space-y-2">
                <p class="text-[10px] font-bold text-slate-400 px-3 mt-2 mb-1 uppercase tracking-wider">Menu Utama</p>
                <button id="btn-dashboard" onclick="app.nav('dashboard')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-xs font-bold text-slate-600 hover:bg-maroon-50 hover:text-maroon-700 transition flex items-center gap-3 active">
                    <i class="fas fa-th-large w-5"></i> Dashboard Pasien
                </button>
                <button id="btn-medicine" onclick="app.nav('medicine')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-xs font-bold text-slate-600 hover:bg-maroon-50 hover:text-maroon-700 transition flex items-center gap-3">
                    <i class="fas fa-pills w-5"></i> Manajemen Obat
                </button>
                <button id="btn-ttv" onclick="app.nav('ttv')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-xs font-bold text-slate-600 hover:bg-maroon-50 hover:text-maroon-700 transition flex items-center gap-3">
                    <i class="fas fa-stethoscope w-5"></i> TTV & GDS
                </button>
                <button id="btn-visit" onclick="app.nav('visit')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-xs font-bold text-slate-600 hover:bg-maroon-50 hover:text-maroon-700 transition flex items-center gap-3">
                    <i class="fas fa-user-md w-5"></i> Visit Dokter
                </button>
                <button id="btn-crisis" onclick="app.nav('crisis')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-xs font-bold text-slate-600 hover:bg-maroon-50 hover:text-maroon-700 transition flex items-center gap-3">
                    <i class="fas fa-chart-line w-5"></i> Grafik Crisis
                </button>
                
                <p class="text-[10px] font-bold text-slate-400 px-3 mt-6 mb-1 uppercase tracking-wider">Layanan</p>
                <button id="btn-program" onclick="app.nav('program')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-xs font-bold text-slate-600 hover:bg-maroon-50 hover:text-maroon-700 transition flex items-center gap-3">
                    <i class="fas fa-list-check w-5"></i> Program
                </button>
                <button id="btn-therapy" onclick="app.nav('therapy')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-xs font-bold text-slate-600 hover:bg-maroon-50 hover:text-maroon-700 transition flex items-center gap-3">
                    <i class="fas fa-notes-medical w-5"></i> Catatan Terapi
                </button>
            </nav>

            <div class="p-4 border-t border-slate-100">
                <button onclick="location.reload()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-2 rounded-lg text-[10px] font-bold flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> LOGOUT
                </button>
            </div>
        </div>

        <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 relative">
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0">
                <div class="flex items-center gap-4">
                    <h2 id="page-title" class="font-black text-xl text-maroon-800 tracking-tight">DASHBOARD</h2>
                </div>
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                        <input id="global-search" onkeyup="app.search()" type="text" placeholder="Cari data..." class="pl-8 pr-4 py-2 bg-slate-100 rounded-full text-xs font-bold w-48 focus:w-64 transition-all focus:bg-white focus:ring-2 focus:ring-maroon-100 outline-none border-none">
                    </div>
                    <button onclick="app.exportToWord()" class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 shadow" title="Export DOCX">
                        <i class="fas fa-file-word text-xs"></i>
                    </button>
                    <button onclick="app.exportAllExcel()" class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center hover:bg-emerald-700 shadow" title="Export Excel">
                        <i class="fas fa-file-excel text-xs"></i>
                    </button>
                </div>
            </header>

            <main id="main-content" class="flex-1 overflow-y-auto p-6 scroll-smooth">
                </main>
        </div>
    </div>

    <div id="modal-container" class="hidden fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-5 border-b flex justify-between items-center bg-maroon-50 rounded-t-3xl">
                <h3 id="modal-title" class="font-bold text-maroon-800 text-lg">FORM INPUT</h3>
                <button onclick="app.closeModal()" class="w-8 h-8 rounded-full bg-white text-maroon-800 hover:bg-maroon-800 hover:text-white transition flex items-center justify-center font-bold">✕</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto">
                </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.0/build/index.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
