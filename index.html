<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="frontend/css/variables.css">

<body>

    <div class="app-container">
        <aside class="sidebar">

            </div>
            
            <nav class="sidebar-menu">
                <a href="#" class="nav-item active">
                    <i class="fa-solid fa-chart-pie"></i>

                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-users"></i>
                    <span>Pasien</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-file-medical"></i>

                </a>
                <a href="#" class="nav-item">

                </a>

            <header class="dashboard-header" style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--primary);">Selamat Datang, Fajar</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">Ringkasan sistem MMRC hari ini.</p>
