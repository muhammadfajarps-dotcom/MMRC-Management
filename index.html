<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-50">

    <div id="auth-layer" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-teal-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg rotate-3">
                    <i class="fas fa-hospital-user text-white text-4xl -rotate-3"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">MMRC <span class="text-teal-600">DATABASE</span></h1>
                <p class="text-slate-400 text-xs mt-1 uppercase tracking-widest font-bold">Operasional Login</p>
            </div>
            <div class="space-y-4">
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-4 text-slate-300"></i>
                    <input type="text" id="login-user" placeholder="Username" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                </div>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-4 text-slate-300"></i>
                    <input type="password" id="login-pass" placeholder="Password" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                </div>
                <button onclick="app.login()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95">
                    MASUK KE SISTEM
                </button>
            </div>
        </div>
    </div>

    <div id="app-layer" class="hidden flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-white border-r flex flex-col shadow-xl z-50">
            <div class="p-6 border-b">
                <h2 class="font-black text-xl text-slate-800 tracking-tighter">MADANI <span class="text-teal-600">MMRC</span></h2>
            </div>
            
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button id="btn-dashboard" onclick="app.nav('dashboard')" class="nav-btn active">
                    <i class="fas fa-th-large mr-3"></i> Dashboard
                </button>
                <button id="btn-medicine" onclick="app.nav('medicine')" class="nav-btn">
                    <i class="fas fa-pills mr-3"></i> Medicine
                </button>
                <button id="btn-ttv" onclick="app.nav('ttv')" class="nav-btn">
                    <i class="fas fa-heartbeat mr-3"></i> TTV & GDS
                </button>
                <button id="btn-visit" onclick="app.nav('visit')" class="nav-btn">
                    <i class="fas fa-user-md mr-3"></i> Visit Dokter
                </button>
                <button id="btn-crisis" onclick="app.nav('crisis')" class="nav-btn">
                    <i class="fas fa-chart-line mr-3"></i> Pasien Crisis
                </button>
                <button id="btn-program" onclick="app.nav('program')" class="nav-btn">
                    <i class="fas fa-calendar-check mr-3"></i> Program
                </button>
                <button id="btn-therapy" onclick="app.nav('therapy')" class="nav-btn">
                    <i class="fas fa-brain mr-3"></i> Therapy
                </button>
            </nav>

            <div class="p-4 border-t bg-slate-50">
                <button onclick="location.reload()" class="w-full py-3 text-red-500 font-bold text-xs flex items-center justify-center gap-2 hover:bg-red-50 rounded-xl transition-all">
                    <i class="fas fa-sign-out-alt"></i> LOGOUT SISTEM
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <header class="bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-40">
                <h2 id="page-title" class="text-lg font-bold text-slate-700 uppercase tracking-widest">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-2.5 text-slate-300"></i>
                        <input type="text" id="global-search" onkeyup="app.search()" placeholder="Cari Pasien..." 
                        class="pl-10 pr-4 py-2 border rounded-full text-sm focus:ring-2 focus:ring-teal-500 outline-none w-64 bg-slate-50 transition-all">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="app.exportToWord()" class="bg-blue-600 text-white px-5 py-2 rounded-full text-xs font-black hover:bg-blue-700 shadow-md flex items-center gap-2 transition active:scale-95">
                            <i class="fas fa-file-word"></i> WORD
                        </button>
                        <button onclick="app.exportAllExcel()" class="bg-emerald-600 text-white px-5 py-2 rounded-full text-xs font-black hover:bg-emerald-700 shadow-md flex items-center gap-2 transition active:scale-95">
                            <i class="fas fa-file-excel"></i> EXCEL
                        </button>
                    </div>
                </div>
            </header>

            <div id="main-content" class="p-8 overflow-y-auto flex-1">
                </div>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-5xl max-h-[90vh] rounded-[2rem] overflow-hidden flex flex-col shadow-2xl border border-white/20">
            <div class="px-8 py-5 border-b flex justify-between items-center bg-teal-50">
                <h3 id="modal-title" class="font-black text-teal-800 tracking-tight">FORM INPUT</h3>
                <button onclick="app.closeModal()" class="w-8 h-8 rounded-full bg-white text-slate-400 hover:text-red-500 flex items-center justify-center transition-colors shadow-sm">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-body" class="p-8 overflow-y-auto flex-1 bg-white">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
