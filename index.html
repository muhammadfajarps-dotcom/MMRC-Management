<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .sidebar-active { background-color: #0f766e; border-right: 4px solid #ccfbf1; }
        .hidden-section { display: none; }
        /* Animasi untuk expand row obat */
        .medicine-row { transition: all 0.3s ease-out; overflow: hidden; }
        .medicine-row.hidden-row { display: none; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="text-gray-800">

    <div id="login-section" class="fixed inset-0 z-50 bg-teal-900 flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-96 text-center">
            <h1 class="text-2xl font-bold text-teal-700 mb-2">MMRC Management</h1>
            <p class="text-gray-500 mb-6 text-sm">Madani Mental Recovery Center</p>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full p-2 border rounded focus:outline-none focus:border-teal-500">
                <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded focus:outline-none focus:border-teal-500">
                <button type="submit" class="w-full bg-teal-600 text-white py-2 rounded hover:bg-teal-700 transition">LOGIN</button>
            </form>
            <p id="loginError" class="text-red-500 text-xs mt-2 hidden">Username atau Password salah!</p>
        </div>
    </div>

    <div id="app-container" class="flex h-screen hidden-section">
        
        <aside class="w-64 bg-teal-800 text-white flex flex-col shadow-lg">
            <div class="p-6 text-center border-b border-teal-700">
                <h2 class="text-xl font-bold">MMRC</h2>
                <span class="text-xs text-teal-200">Operasional System</span>
            </div>
            <nav class="flex-1 overflow-y-auto py-4">
                <a href="#" onclick="showSection('dashboard')" id="nav-dashboard" class="flex items-center px-6 py-3 hover:bg-teal-700 transition sidebar-active">
                    <i class="fas fa-hospital-user w-6"></i> Dashboard & Obat
                </a>
                <a href="#" onclick="showSection('ttv')" id="nav-ttv" class="flex items-center px-6 py-3 hover:bg-teal-700 transition">
                    <i class="fas fa-heartbeat w-6"></i> TTV & GDS
                </a>
                <a href="#" onclick="showSection('crisis')" id="nav-crisis" class="flex items-center px-6 py-3 hover:bg-teal-700 transition">
                    <i class="fas fa-exclamation-triangle w-6"></i> Pasien Crisis
                </a>
                <a href="#" onclick="showSection('program')" id="nav-program" class="flex items-center px-6 py-3 hover:bg-teal-700 transition">
                    <i class="fas fa-calendar-alt w-6"></i> Rencana Program
                </a>
                <a href="#" onclick="showSection('terapi')" id="nav-terapi" class="flex items-center px-6 py-3 hover:bg-teal-700 transition">
                    <i class="fas fa-brain w-6"></i> Rencana Terapi
                </a>
            </nav>
            <div class="p-4 border-t border-teal-700">
                <button onclick="logout()" class="w-full flex items-center justify-center bg-red-600 py-2 rounded hover:bg-red-700 transition text-sm">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden bg-gray-50">
            <header class="bg-white shadow p-4 flex justify-between items-center">
                <h2 id="page-title" class="text-xl font-bold text-gray-700">Dashboard Pasien</h2>
                <div class="flex space-x-2">
                    <input type="text" id="globalSearch" placeholder="Cari data..." class="p-2 border rounded text-sm w-64" onkeyup="globalSearch()">
                    <button onclick="exportToExcel()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">
                        <i class="fas fa-file-excel mr-1"></i> Export Excel
                    </button>
                    <button onclick="openModal('general')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
                        <i class="fas fa-plus mr-1"></i> Input Pasien
                    </button>
                </div>
            </header>

            <div id="main-content" class="flex-1 overflow-auto p-6">
                </div>
        </main>
    </div>

    <div id="inputModal" class="fixed inset-0 z-40 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg w-3/4 max-h-[90vh] overflow-y-auto p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-teal-800" id="modalTitle">Input Data</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="dynamicForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </form>
            <div class="mt-6 flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Batal</button>
                <button onclick="saveData()" class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-700">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // --- AUTH & CONFIG ---
        const CREDENTIALS = { u: "OPERASIONAL.MMRC", p: "MADANI1999" };
        let currentUser = null;
        let currentSection = 'dashboard';
        let tempPatientIdForMedicine = null; // Menyimpan ID saat input obat

        // Data Store
        let db = JSON.parse(localStorage.getItem('mmrc_db_v2')) || {
            patients: [],
            medicines: [],
            vitals: [],
            crisis: []
        };

        // --- AUTH LOGIC ---
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === CREDENTIALS.u && p === CREDENTIALS.p) {
                currentUser = u;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden-section');
                renderSection('dashboard');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });
        function logout() { location.reload(); }

        // --- NAVIGATION ---
        function showSection(section) {
            currentSection = section;
            document.querySelectorAll('aside nav a').forEach(el => el.classList.remove('sidebar-active'));
            document.getElementById('nav-' + section).classList.add('sidebar-active');
            
            const titles = {
                dashboard: "Dashboard Pasien & Stok Obat",
                ttv: "Tanda Tanda Vital & GDS",
                crisis: "Pasien Crisis & BPSS Score",
                program: "Rencana Program",
                terapi: "Rencana Terapi"
            };
            document.getElementById('page-title').innerText = titles[section];
            renderSection(section);
        }

        function renderSection(section) {
            const contentDiv = document.getElementById('main-content');
            contentDiv.innerHTML = ''; 

            if (section === 'dashboard') contentDiv.innerHTML = renderDashboardTable();
            else if (section === 'ttv') contentDiv.innerHTML = renderTTVTable();
            else if (section === 'crisis') { contentDiv.innerHTML = renderCrisisTable(); renderBPSSCharts(); }
            else if (section === 'program') contentDiv.innerHTML = renderProgramTable();
            else if (section === 'terapi') contentDiv.innerHTML = renderTerapiTable();
        }

        // --- RENDER DASHBOARD (MERGED WITH MEDICINE) ---
        function renderDashboardTable() {
            if(db.patients.length === 0) return '<div class="text-center p-10 text-gray-500">Belum ada data pasien. Klik "Input Pasien".</div>';
            
            let rows = db.patients.map((p, index) => `
                <tr class="border-b bg-white hover:bg-gray-50 transition">
                    <td class="p-3 text-sm align-top">${p.regDate || '-'}</td>
                    <td class="p-3 align-top">
                        <div class="font-bold text-teal-700 text-lg">${p.name}</div>
                        <div class="text-xs text-gray-500">Usia: ${p.age} | ${p.status}</div>
                        <div class="text-xs text-gray-500">Wali: ${p.guardian}</div>
                    </td>
                    <td class="p-3 text-sm align-top">
                        <div class="text-xs"><b>Fisik:</b> ${p.histPhysical}</div>
                        <div class="text-xs"><b>Psikis:</b> ${p.histPsych}</div>
                        <div class="text-xs mt-1 bg-yellow-100 p-1 rounded inline-block">Kondisi: ${p.condition}</div>
                    </td>
                    <td class="p-3 text-sm align-top">
                        <div class="font-semibold">Dr. ${p.docName}</div>
                        <div class="italic text-gray-600 text-xs mb-1">${p.diagnosis}</div>
                        <div class="text-xs text-blue-600">Intervensi: ${p.interventions ? p.interventions.join(', ') : '-'}</div>
                    </td>
                    <td class="p-3 text-center align-middle space-y-2">
                        <button onclick="toggleMedicineRow('${p.id}')" class="w-full bg-teal-100 text-teal-800 border border-teal-200 px-3 py-1 rounded text-sm hover:bg-teal-200 flex items-center justify-center">
                            <i class="fas fa-pills mr-2"></i> Data Obat
                        </button>
                        <button onclick="deleteData('patients', ${index})" class="text-red-400 hover:text-red-600 text-xs"><i class="fas fa-trash"></i> Hapus Pasien</button>
                    </td>
                </tr>
                
                <tr id="med-row-${p.id}" class="medicine-row hidden-row bg-gray-50 border-b-2 border-teal-100">
                    <td colspan="5" class="p-4">
                        <div class="bg-white border rounded-lg shadow-inner p-4">
                            <div class="flex justify-between items-center mb-3">
                                <h4 class="font-bold text-teal-800"><i class="fas fa-prescription-bottle-alt"></i> Stok & Penggunaan Obat: ${p.name}</h4>
                                <button onclick="openModal('medicine', '${p.id}')" class="bg-blue-600 text-white text-xs px-3 py-1 rounded hover:bg-blue-700">
                                    <i class="fas fa-plus"></i> Tambah Obat Baru
                                </button>
                            </div>
                            <div id="med-table-${p.id}">
                                ${renderMedicineInnerTable(p.id)}
                            </div>
                        </div>
                    </td>
                </tr>
            `).join('');

            return `
                <div class="overflow-x-auto bg-white rounded shadow-lg">
                    <table class="w-full text-left border-collapse" id="dataTable">
                        <thead class="bg-teal-600 text-white">
                            <tr>
                                <th class="p-3 text-sm font-semibold w-24">Registrasi</th>
                                <th class="p-3 text-sm font-semibold w-1/4">Biodata Pasien</th>
                                <th class="p-3 text-sm font-semibold w-1/4">Riwayat Penyakit</th>
                                <th class="p-3 text-sm font-semibold w-1/4">Diagnosa & Plan</th>
                                <th class="p-3 text-sm font-semibold text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        // Helper: Render tabel obat di dalam baris pasien
        function renderMedicineInnerTable(patientId) {
            // Filter obat milik pasien ini saja
            const meds = db.medicines.filter(m => m.patientId === patientId);
            
            if (meds.length === 0) return '<p class="text-sm text-gray-500 italic">Belum ada data obat untuk pasien ini.</p>';

            let medRows = meds.map((m) => {
                // Cari index asli di array global untuk fungsi delete/update
                const realIndex = db.medicines.indexOf(m); 
                const isLow = m.currentStock <= 7;

                return `
                <tr class="border-b text-sm">
                    <td class="p-2 font-medium">${m.drugName}</td>
                    <td class="p-2 text-center text-gray-500">${m.initialStock}</td>
                    <td class="p-2 text-center font-bold text-blue-600">${m.usedStock}</td>
                    <td class="p-2 text-center font-bold ${isLow ? 'text-red-600' : 'text-green-600'}">
                        ${m.currentStock} ${isLow ? '<i class="fas fa-exclamation-circle text-red-500" title="Restock!"></i>' : ''}
                    </td>
                    <td class="p-2 text-xs text-gray-600 max-w-xs overflow-hidden">
                        ${m.logs && m.logs.length > 0 ? 
                            `<div class="h-16 overflow-y-auto border p-1 bg-gray-50 rounded">
                                ${m.logs.slice().reverse().map(l => `<div><b>${l.date.split(' ')[0]}</b>: ${l.notes} (${l.pic})</div>`).join('')}
                             </div>` 
                            : '-'}
                    </td>
                    <td class="p-2 text-center">
                        <button onclick="addMedicineUsage(${realIndex})" class="bg-green-500 text-white px-2 py-1 rounded text-xs hover:bg-green-600 mb-1 w-full">Minum</button>
                        <button onclick="deleteData('medicines', ${realIndex})" class="text-red-400 text-xs hover:text-red-600">Hapus</button>
                    </td>
                </tr>`;
            }).join('');

            return `
                <table class="w-full text-left border text-sm">
                    <thead class="bg-gray-100 text-gray-700">
                        <tr>
                            <th class="p-2">Nama Obat</th>
                            <th class="p-2 text-center">Awal</th>
                            <th class="p-2 text-center">Pakai</th>
                            <th class="p-2 text-center">Sisa</th>
                            <th class="p-2">Catatan Log</th>
                            <th class="p-2 text-center w-20">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>${medRows}</tbody>
                </table>
            `;
        }

        // Fungsi Expand/Collapse Row
        function toggleMedicineRow(id) {
            const row = document.getElementById(`med-row-${id}`);
            if (row.classList.contains('hidden-row')) {
                row.classList.remove('hidden-row');
                row.classList.add('fade-in');
            } else {
                row.classList.add('hidden-row');
            }
        }

        // --- RENDER OTHER TABLES (UNCHANGED) ---
        function renderTTVTable() {
            let rows = db.vitals.map((v, idx) => {
                const p = db.patients.find(pat => pat.id === v.patientId) || {name: 'Deleted'};
                return `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 text-sm">${v.timestamp}</td>
                    <td class="p-3 font-bold text-teal-700">${p.name}</td>
                    <td class="p-3 text-sm">TD: ${v.td} | Sat: ${v.sat}% | RR: ${v.rr}</td>
                    <td class="p-3 text-sm">TB: ${v.tb} | BB: ${v.bb}</td>
                    <td class="p-3 text-sm italic bg-gray-50">${v.gds}</td>
                    <td class="p-3 text-center"><button onclick="deleteData('vitals', ${idx})" class="text-red-500"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            }).join('');
            return createTableWrapper(['Waktu', 'Pasien', 'TTV', 'Fisik', 'GDS', 'Aksi'], rows);
        }

        function renderCrisisTable() {
            let rows = db.crisis.map((c, idx) => {
                const p = db.patients.find(pat => pat.id === c.patientId) || {name: 'Deleted'};
                return `
                <tr class="border-b hover:bg-gray-50 align-top">
                    <td class="p-3 font-bold text-teal-700">${p.name}<br><span class="text-xs text-gray-500 font-normal">${c.timestamp}</span></td>
                    <td class="p-3 text-sm">Bio: ${c.bioScore}, Psycho: ${c.psychoScore}, Soc: ${c.socialScore}, Spi: ${c.spiritualScore}</td>
                    <td class="p-3 text-sm">${c.dischargeEval}</td>
                    <td class="p-3 text-sm">${c.change7days}</td>
                    <td class="p-3"><div style="width:100px;height:100px"><canvas id="chart-${idx}"></canvas></div></td>
                    <td class="p-3 text-center"><button onclick="deleteData('crisis', ${idx})" class="text-red-500"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            }).join('');
            return createTableWrapper(['Pasien', 'BPSS Scores', 'Evaluasi', 'Perubahan', 'Grafik', 'Aksi'], rows);
        }

        function renderProgramTable() {
             let rows = db.patients.map((p, index) => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 font-bold text-teal-700">${p.name}</td>
                    <td class="p-3 text-sm"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded">${p.programPackage || '-'}</span></td>
                    <td class="p-3 text-sm">${p.programDuration || '-'} Hari</td>
                    <td class="p-3 text-center"><button onclick="editProgram(${index})" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">Edit</button></td>
                </tr>`).join('');
             return createTableWrapper(['Pasien', 'Paket', 'Durasi', 'Aksi'], rows);
        }

        function renderTerapiTable() {
             let rows = db.patients.map((p, index) => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 font-bold text-teal-700">${p.name}</td>
                    <td class="p-3 text-sm italic">${p.therapyPlan || '-'}</td>
                    <td class="p-3 text-center"><button onclick="editTherapy(${index})" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">Edit</button></td>
                </tr>`).join('');
             return createTableWrapper(['Pasien', 'Rencana Terapi', 'Aksi'], rows);
        }

        function createTableWrapper(headers, rows) {
            return `
                <div class="overflow-x-auto bg-white rounded shadow">
                    <table class="w-full text-left border-collapse" id="dataTable">
                        <thead class="bg-teal-50"><tr>${headers.map(h=>`<th class="p-3 text-sm font-semibold text-teal-800">${h}</th>`).join('')}</tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        // --- CHARTS & LOGIC ---
        function renderBPSSCharts() {
            db.crisis.forEach((c, idx) => {
                const ctx = document.getElementById(`chart-${idx}`);
                if(ctx) new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['Bio', 'Psy', 'Soc', 'Spi'],
                        datasets: [{ data: [c.bioScore, c.psychoScore, c.socialScore, c.spiritualScore], 
                        backgroundColor: 'rgba(13, 148, 136, 0.2)', borderColor: '#0d9488', borderWidth: 1, pointRadius: 0 }]
                    },
                    options: { scales: { r: { display: false, min: 0, max: 25 } }, plugins: { legend: { display: false } } }
                });
            });
        }

        function saveDataLocal() { localStorage.setItem('mmrc_db_v2', JSON.stringify(db)); }
        
        function deleteData(collection, index) {
            if(confirm('Hapus data ini?')) {
                db[collection].splice(index, 1);
                saveDataLocal();
                renderSection(currentSection);
            }
        }

        function globalSearch() {
            const filter = document.getElementById("globalSearch").value.toUpperCase();
            const tr = document.getElementById("dataTable").getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) {
                // Skip hidden detail rows from search logic to avoid breaking layout
                if(tr[i].classList.contains('medicine-row')) continue;
                
                let txtValue = tr[i].textContent || tr[i].innerText;
                tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }

        // --- MODAL & FORM ---
        const modal = document.getElementById('inputModal');
        const formContainer = document.getElementById('dynamicForm');

        function openModal(type, specificId = null) {
            modal.classList.remove('hidden');
            tempPatientIdForMedicine = specificId;
            generateFormFields(type);
        }
        function closeModal() { modal.classList.add('hidden'); }

        function generateFormFields(type) {
            let html = '';
            // Dropdown Pasien (Untuk TTV/Crisis/General Medicine input)
            const patientOpts = db.patients.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            const selectPat = `<div class="col-span-2"><label class="text-xs font-bold">Pasien</label><select id="patientId" class="border p-2 w-full rounded">${patientOpts}</select></div>`;

            if (type === 'general' && currentSection === 'dashboard') {
                html = `
                    <div class="col-span-2 text-teal-800 font-bold border-b">Biodata</div>
                    <input type="date" id="regDate" class="border p-2 rounded" required>
                    <input type="text" id="name" placeholder="Nama Lengkap" class="border p-2 rounded">
                    <input type="number" id="age" placeholder="Usia" class="border p-2 rounded">
                    <select id="status" class="border p-2 rounded"><option>Menikah</option><option>Belum</option><option>Cerai</option></select>
                    <input type="text" id="guardian" placeholder="Nama Wali" class="border p-2 rounded">
                    <div class="col-span-2 text-teal-800 font-bold border-b mt-2">Medis</div>
                    <textarea id="histPhysical" placeholder="Riwayat Fisik" class="border p-2 rounded"></textarea>
                    <textarea id="histPsych" placeholder="Riwayat Psikis" class="border p-2 rounded"></textarea>
                    <input type="text" id="condition" placeholder="Kondisi Terkini" class="border p-2 rounded col-span-2">
                    <input type="text" id="docName" placeholder="Dokter" class="border p-2 rounded">
                    <input type="text" id="diagnosis" placeholder="Diagnosa" class="border p-2 rounded">
                    <div class="col-span-2 flex gap-2"><label><input type="checkbox" value="Injeksi" class="interv"> Injeksi</label><label><input type="checkbox" value="Fiksasi" class="interv"> Fiksasi</label></div>
                `;
            } else if (type === 'medicine') {
                // Form Obat Spesifik
                const pName = db.patients.find(p => p.id === tempPatientIdForMedicine)?.name;
                document.getElementById('modalTitle').innerText = `Tambah Obat untuk: ${pName}`;
                html = `
                    <input type="hidden" id="patientId" value="${tempPatientIdForMedicine}">
                    <input type="text" id="drugName" placeholder="Nama Obat" class="border p-2 rounded col-span-2">
                    <input type="number" id="initialStock" placeholder="Jumlah Stok Awal" class="border p-2 rounded col-span-2">
                `;
            } else if (currentSection === 'ttv') {
                html = `${selectPat} <input type="datetime-local" id="timestamp" class="border p-2 rounded">
                <input type="text" id="td" placeholder="TD" class="border p-2 rounded"><input type="number" id="sat" placeholder="Sat %" class="border p-2 rounded">
                <input type="number" id="rr" placeholder="RR" class="border p-2 rounded"><input type="number" id="tb" placeholder="TB" class="border p-2 rounded">
                <input type="number" id="bb" placeholder="BB" class="border p-2 rounded"><textarea id="gds" placeholder="Ket GDS" class="border p-2 rounded col-span-2"></textarea>`;
            } else if (currentSection === 'crisis') {
                html = `${selectPat} <input type="datetime-local" id="timestamp" class="border p-2 rounded">
                <input type="number" id="bioScore" placeholder="Bio (0-25)" class="border p-2 rounded"><input type="number" id="psychoScore" placeholder="Psycho (0-25)" class="border p-2 rounded">
                <input type="number" id="socialScore" placeholder="Social (0-25)" class="border p-2 rounded"><input type="number" id="spiritualScore" placeholder="Spiritual (0-25)" class="border p-2 rounded">
                <textarea id="dischargeEval" placeholder="Evaluasi" class="border p-2 rounded col-span-2"></textarea>`;
            }
            formContainer.innerHTML = html;
        }

        function saveData() {
            const val = (id) => document.getElementById(id) ? document.getElementById(id).value : '';
            
            // Cek jika ini input obat dari dalam dashboard
            if (document.getElementById('modalTitle').innerText.includes('Tambah Obat')) {
                db.medicines.push({
                    patientId: val('patientId'),
                    drugName: val('drugName'),
                    initialStock: parseInt(val('initialStock')) || 0,
                    usedStock: 0,
                    currentStock: parseInt(val('initialStock')) || 0,
                    logs: []
                });
            } 
            // Input Pasien Baru
            else if (currentSection === 'dashboard') {
                db.patients.push({
                    id: Date.now().toString(),
                    regDate: val('regDate'), name: val('name'), age: val('age'), status: val('status'), guardian: val('guardian'),
                    histPhysical: val('histPhysical'), histPsych: val('histPsych'), condition: val('condition'),
                    docName: val('docName'), diagnosis: val('diagnosis'),
                    interventions: Array.from(document.querySelectorAll('.interv:checked')).map(c=>c.value)
                });
            } else if (currentSection === 'ttv') {
                db.vitals.push({ patientId: val('patientId'), timestamp: val('timestamp'), td: val('td'), sat: val('sat'), rr: val('rr'), tb: val('tb'), bb: val('bb'), gds: val('gds') });
            } else if (currentSection === 'crisis') {
                db.crisis.push({ patientId: val('patientId'), timestamp: val('timestamp'), bioScore: val('bioScore'), psychoScore: val('psychoScore'), socialScore: val('socialScore'), spiritualScore: val('spiritualScore'), dischargeEval: val('dischargeEval'), change7days: '-' });
            }

            saveDataLocal();
            closeModal();
            renderSection(currentSection);
            
            // Jika baru tambah obat, buka lagi row nya
            if(tempPatientIdForMedicine) {
                setTimeout(() => {
                    const row = document.getElementById(`med-row-${tempPatientIdForMedicine}`);
                    if(row) row.classList.remove('hidden-row');
                }, 100);
            }
        }

        function addMedicineUsage(idx) {
            const med = db.medicines[idx];
            if(med.currentStock <= 0) return alert('Stok habis!');
            
            const notes = prompt(`Gunakan ${med.drugName}. Masukkan keterangan (cth: Pagi/Siang/Malam):`);
            if(notes) {
                med.usedStock++;
                med.currentStock--;
                med.logs.push({ date: new Date().toLocaleString(), notes: notes, pic: currentUser });
                if(med.currentStock <= 7) alert(`Warning: Sisa stok ${med.drugName} tinggal ${med.currentStock}!`);
                saveDataLocal();
                renderSection('dashboard');
                // Re-open row
                setTimeout(() => document.getElementById(`med-row-${med.patientId}`).classList.remove('hidden-row'), 50);
            }
        }

        function editProgram(i) { const p = db.patients[i]; p.programPackage = prompt("Paket:", p.programPackage); p.programDuration = prompt("Durasi:", p.programDuration); saveDataLocal(); renderSection('program'); }
        function editTherapy(i) { const p = db.patients[i]; p.therapyPlan = prompt("Plan Terapi:", p.therapyPlan); saveDataLocal(); renderSection('terapi'); }
        
        function exportToExcel() {
            const table = document.getElementById("dataTable");
            const wb = XLSX.utils.table_to_book(table, {sheet: "Data"});
            XLSX.writeFile(wb, `MMRC_Data_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
