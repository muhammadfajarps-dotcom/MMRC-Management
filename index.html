<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System - Fixed Version</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div id="auth-layer" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-xl w-96">
            <h1 class="text-2xl font-bold text-center text-teal-700 mb-6">MMRC LOGIN</h1>
            <input type="text" id="username" placeholder="OPERASIONAL.MMRC" class="w-full border p-2 rounded mb-3">
            <input type="password" id="password" placeholder="MADANI1999" class="w-full border p-2 rounded mb-6">
            <button onclick="app.login()" class="w-full bg-teal-600 text-white py-2 rounded font-bold">MASUK</button>
        </div>
    </div>

    <div id="app-layer" class="hidden flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r flex flex-col">
            <div class="p-6 border-b font-bold text-xl text-teal-700">MMRC SYSTEM</div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-2">
                <button onclick="app.nav('dashboard')" id="nav-dashboard" class="nav-btn active"><i class="fas fa-columns w-5"></i> Dashboard</button>
                <button onclick="app.nav('medicine')" id="nav-medicine" class="nav-btn"><i class="fas fa-pills w-5"></i> Medicine</button>
                <button onclick="app.nav('ttv')" id="nav-ttv" class="nav-btn"><i class="fas fa-heartbeat w-5"></i> TTV & GDS</button>
                <button onclick="app.nav('visit')" id="nav-visit" class="nav-btn"><i class="fas fa-user-md w-5"></i> Visit Dokter</button>
                <button onclick="app.nav('crisis')" id="nav-crisis" class="nav-btn"><i class="fas fa-chart-line w-5"></i> Pasien Crisis</button>
                <button onclick="app.nav('program')" id="nav-program" class="nav-btn"><i class="fas fa-tasks w-5"></i> Rencana Program</button>
                <button onclick="app.nav('terapi')" id="nav-terapi" class="nav-btn"><i class="fas fa-brain w-5"></i> Rencana Terapi</button>
            </nav>
            <div class="p-4 border-t">
                <button onclick="location.reload()" class="text-red-600 font-bold text-sm">LOGOUT</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative">
            <header class="h-16 bg-white border-b flex items-center justify-between px-6 shadow-sm z-10">
                <h2 id="page-title" class="font-bold text-lg uppercase">Dashboard</h2>
                <div class="flex gap-3">
                    <input type="text" id="search-input" onkeyup="app.search()" placeholder="Cari Data..." class="border rounded-full px-4 py-1 text-sm w-64">
                    <button onclick="app.exportExcel()" class="bg-green-600 text-white px-3 py-1 rounded text-sm font-bold">Export Excel</button>
                </div>
            </header>
            <div id="main-content" class="flex-1 overflow-auto p-6 bg-slate-50"></div>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 z-[100] bg-black/50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-xl flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b flex justify-between bg-gray-50">
                <h3 id="modal-title" class="font-bold text-lg">Form</h3>
                <button onclick="app.closeModal()" class="text-2xl font-bold text-gray-400 hover:text-red-500">&times;</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
