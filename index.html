<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Styles */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .sidebar-active { background-color: #0f766e; border-right: 4px solid #ccfbf1; }
        .hidden-section { display: none; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .modal { transition: opacity 0.25s ease; }
    </style>
</head>
<body class="text-gray-800">

    <div id="login-section" class="fixed inset-0 z-50 bg-teal-900 flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-96 text-center">
            <h1 class="text-2xl font-bold text-teal-700 mb-2">MMRC Management</h1>
            <p class="text-gray-500 mb-6 text-sm">Madani Mental Recovery Center</p>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full p-2 border rounded focus:outline-none focus:border-teal-500">
                <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded focus:outline-none focus:border-teal-500">
                <button type="submit" class="w-full bg-teal-600 text-white py-2 rounded hover:bg-teal-700 transition">LOGIN</button>
            </form>
            <p id="loginError" class="text-red-500 text-xs mt-2 hidden">Username atau Password salah!</p>
        </div>
    </div>

    <div id="app-container" class="flex h-screen hidden-section">
        
        <aside class="w-64 bg-teal-800 text-white flex flex-col shadow-lg">
            <div class="p-6 text-center border-b border-teal-700">
                <h2 class="text-xl font-bold">MMRC</h2>
                <span class="text-xs text-teal-200">Operasional System</span>
            </div>
            <nav class="flex-1 overflow-y-auto py-4">
                <a href="#" onclick="showSection('dashboard')" id="nav-dashboard" class="flex items-center px-6 py-3 hover:bg-teal-700 transition sidebar-active">
                    <i class="fas fa-hospital-user w-6"></i> Dashboard
                </a>
                <a href="#" onclick="showSection('medicine')" id="nav-medicine" class="flex items-center px-6 py-3 hover:bg-teal-700 transition">
                    <i class="fas fa-pills w-6"></i> Medicine
                </a>
                <a href="#" onclick="showSection('ttv')" id="nav-ttv" class="flex items-center px-6 py-3 hover:bg-teal-700 transition">
                    <i class="fas fa-heartbeat w-6"></i> TTV & GDS
                </a>
                <a href="#" onclick="showSection('crisis')" id="nav-crisis" class="flex items-center px-6 py-3 hover:bg-teal-700 transition">
                    <i class="fas fa-exclamation-triangle w-6"></i> Pasien Crisis
                </a>
                <a href="#" onclick="showSection('program')" id="nav-program" class="flex items-center px-6 py-3 hover:bg-teal-700 transition">
                    <i class="fas fa-calendar-alt w-6"></i> Rencana Program
                </a>
                <a href="#" onclick="showSection('terapi')" id="nav-terapi" class="flex items-center px-6 py-3 hover:bg-teal-700 transition">
                    <i class="fas fa-brain w-6"></i> Rencana Terapi
                </a>
            </nav>
            <div class="p-4 border-t border-teal-700">
                <button onclick="logout()" class="w-full flex items-center justify-center bg-red-600 py-2 rounded hover:bg-red-700 transition text-sm">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden bg-gray-50">
            <header class="bg-white shadow p-4 flex justify-between items-center">
                <h2 id="page-title" class="text-xl font-bold text-gray-700">Dashboard Pasien</h2>
                <div class="flex space-x-2">
                    <input type="text" id="globalSearch" placeholder="Cari data..." class="p-2 border rounded text-sm w-64" onkeyup="globalSearch()">
                    <button onclick="exportToExcel()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">
                        <i class="fas fa-file-excel mr-1"></i> Export Excel
                    </button>
                    <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
                        <i class="fas fa-plus mr-1"></i> Input Data
                    </button>
                </div>
            </header>

            <div id="main-content" class="flex-1 overflow-auto p-6">
                </div>
        </main>
    </div>

    <div id="inputModal" class="fixed inset-0 z-40 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg w-3/4 max-h-[90vh] overflow-y-auto p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-teal-800" id="modalTitle">Input Data</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="dynamicForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </form>
            <div class="mt-6 flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Batal</button>
                <button onclick="saveData()" class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-700">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // --- AUTH & STATE ---
        const CREDENTIALS = { u: "OPERASIONAL.MMRC", p: "MADANI1999" };
        let currentUser = null;
        let currentSection = 'dashboard';
        
        // Data Store (Simulasi Database)
        let db = JSON.parse(localStorage.getItem('mmrc_db')) || {
            patients: [], // Core Data: ID, Bio, History, Diagnosis, Program, Therapy
            medicines: [], // Linked to patientID: Stock info, logs
            vitals: [],    // Linked to patientID: TTV & GDS
            crisis: []     // Linked to patientID: BPSS Score
        };

        // --- AUTH FUNCTIONS ---
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === CREDENTIALS.u && p === CREDENTIALS.p) {
                currentUser = u;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden-section');
                renderSection('dashboard');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        function logout() {
            location.reload();
        }

        // --- NAVIGATION & RENDERING ---
        function showSection(section) {
            currentSection = section;
            // Update Sidebar UI
            document.querySelectorAll('aside nav a').forEach(el => el.classList.remove('sidebar-active'));
            document.getElementById('nav-' + section).classList.add('sidebar-active');
            
            // Update Title
            const titles = {
                dashboard: "Dashboard & Registrasi Pasien",
                medicine: "Medicine Management & Stok",
                ttv: "Tanda Tanda Vital & GDS",
                crisis: "Pasien Crisis & BPSS Score",
                program: "Rencana Program",
                terapi: "Rencana Terapi"
            };
            document.getElementById('page-title').innerText = titles[section];
            renderSection(section);
        }

        function renderSection(section) {
            const contentDiv = document.getElementById('main-content');
            contentDiv.innerHTML = ''; // Clear content

            let html = '';
            
            if (section === 'dashboard') {
                html = renderDashboardTable();
            } else if (section === 'medicine') {
                html = renderMedicineTable();
            } else if (section === 'ttv') {
                html = renderTTVTable();
            } else if (section === 'crisis') {
                html = renderCrisisTable();
            } else if (section === 'program') {
                html = renderProgramTable();
            } else if (section === 'terapi') {
                html = renderTerapiTable();
            }

            contentDiv.innerHTML = html;

            // Render Chart if in Crisis section
            if(section === 'crisis') {
                renderBPSSCharts();
            }
        }

        // --- DATA RENDERING HELPERS (TABLES) ---
        
        function renderDashboardTable() {
            if(db.patients.length === 0) return '<div class="text-center p-10 text-gray-500">Belum ada data pasien. Klik "Input Data".</div>';
            
            let rows = db.patients.map((p, index) => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 text-sm">${p.regDate || '-'}</td>
                    <td class="p-3">
                        <div class="font-bold text-teal-700">${p.name}</div>
                        <div class="text-xs text-gray-500">Usia: ${p.age} | ${p.status}</div>
                        <div class="text-xs text-gray-500">Wali: ${p.guardian}</div>
                    </td>
                    <td class="p-3 text-sm">
                        <div class="text-xs"><b>Fisik:</b> ${p.histPhysical}</div>
                        <div class="text-xs"><b>Psikis:</b> ${p.histPsych}</div>
                        <div class="text-xs mt-1 bg-yellow-100 p-1 rounded">Kondisi: ${p.condition}</div>
                    </td>
                    <td class="p-3 text-sm">
                        <div><b>Dr. ${p.docName}</b></div>
                        <div class="italic text-gray-600">${p.diagnosis}</div>
                        <div class="text-xs mt-1">
                            Intervensi: ${p.interventions ? p.interventions.join(', ') : '-'}
                        </div>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="deleteData('patients', ${index})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            return `
                <div class="overflow-x-auto bg-white rounded shadow">
                    <table class="w-full text-left border-collapse" id="dataTable">
                        <thead class="bg-teal-50">
                            <tr>
                                <th class="p-3 text-sm font-semibold text-teal-800">Registrasi</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Biodata Pasien</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Riwayat Penyakit</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Diagnosa & Plan Dokter</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function renderMedicineTable() {
            // Flatten medicine data linked to patients
            let rows = '';
            db.medicines.forEach((m, idx) => {
                const p = db.patients.find(pat => pat.id === m.patientId) || {name: 'Unknown'};
                const isLow = m.currentStock <= 7;
                
                rows += `
                <tr class="border-b hover:bg-gray-50 ${isLow ? 'bg-red-50' : ''}">
                    <td class="p-3 font-bold text-teal-700">${p.name}</td>
                    <td class="p-3">${m.drugName}</td>
                    <td class="p-3 text-center">${m.initialStock}</td>
                    <td class="p-3 text-center font-bold text-blue-600">${m.usedStock}</td>
                    <td class="p-3 text-center font-bold ${isLow ? 'text-red-600 animate-pulse' : 'text-green-600'}">
                        ${m.currentStock}
                        ${isLow ? '<br><span class="text-xs bg-red-200 text-red-800 px-1 rounded">RESTOCK!</span>' : ''}
                    </td>
                    <td class="p-3 text-sm">
                        ${m.logs ? m.logs.map(l => `<div class="text-xs border-b border-gray-100 pb-1 mb-1">${l.date}: -1 (${l.notes}) by ${l.pic}</div>`).join('') : '-'}
                    </td>
                    <td class="p-3 text-center">
                         <button onclick="addMedicineUsage(${idx})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs mb-1">Minum Obat</button>
                         <button onclick="deleteData('medicines', ${idx})" class="text-red-500 text-xs block mx-auto mt-1">Hapus</button>
                    </td>
                </tr>`;
            });

            return `
                 <div class="overflow-x-auto bg-white rounded shadow">
                    <table class="w-full text-left border-collapse" id="dataTable">
                        <thead class="bg-teal-50">
                            <tr>
                                <th class="p-3 text-sm font-semibold text-teal-800">Nama Pasien</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Nama Obat</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Stok Awal</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Terpakai</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Sisa Stok</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Catatan Penggunaan</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function renderTTVTable() {
            let rows = db.vitals.map((v, idx) => {
                const p = db.patients.find(pat => pat.id === v.patientId) || {name: 'Unknown'};
                return `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 text-sm">${v.timestamp}</td>
                    <td class="p-3 font-bold text-teal-700">${p.name}</td>
                    <td class="p-3 text-sm">TD: ${v.td} | Sat: ${v.sat}% | RR: ${v.rr}</td>
                    <td class="p-3 text-sm">TB: ${v.tb} cm | BB: ${v.bb} kg</td>
                    <td class="p-3 text-sm italic bg-gray-50">${v.gds}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteData('vitals', ${idx})" class="text-red-500"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');

            return `
                <div class="overflow-x-auto bg-white rounded shadow">
                    <table class="w-full text-left border-collapse" id="dataTable">
                        <thead class="bg-teal-50">
                            <tr>
                                <th class="p-3 text-sm font-semibold text-teal-800">Waktu</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Pasien</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">TTV (Vital)</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Fisik</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Ket. GDS</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function renderCrisisTable() {
            let rows = db.crisis.map((c, idx) => {
                const p = db.patients.find(pat => pat.id === c.patientId) || {name: 'Unknown'};
                return `
                <tr class="border-b hover:bg-gray-50 align-top">
                    <td class="p-3 font-bold text-teal-700">${p.name} <br> <span class="text-xs font-normal text-gray-500">${c.timestamp}</span></td>
                    <td class="p-3 text-sm">
                        <ul class="list-none space-y-1">
                            <li>Bio: <span class="font-bold">${c.bioScore}</span></li>
                            <li>Psycho: <span class="font-bold">${c.psychoScore}</span></li>
                            <li>Social: <span class="font-bold">${c.socialScore}</span></li>
                            <li>Spiritual: <span class="font-bold">${c.spiritualScore}</span></li>
                        </ul>
                    </td>
                    <td class="p-3 text-sm">${c.dischargeEval}</td>
                    <td class="p-3 text-sm">${c.change7days}</td>
                    <td class="p-3">
                        <div style="width: 150px; height: 150px;">
                            <canvas id="chart-${idx}"></canvas>
                        </div>
                    </td>
                     <td class="p-3 text-center">
                        <button onclick="deleteData('crisis', ${idx})" class="text-red-500"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');

            return `
                <div class="overflow-x-auto bg-white rounded shadow">
                    <table class="w-full text-left border-collapse" id="dataTable">
                        <thead class="bg-teal-50">
                            <tr>
                                <th class="p-3 text-sm font-semibold text-teal-800">Pasien</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">BPSS Scores (0-25)</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Evaluasi Discharge</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Change (7 Hari)</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Grafik Polygon</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function renderProgramTable() {
             let rows = db.patients.map((p, index) => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 font-bold text-teal-700">${p.name}</td>
                    <td class="p-3 text-sm"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded">${p.programPackage || 'Belum set'}</span></td>
                    <td class="p-3 text-sm">${p.programDuration ? p.programDuration + ' Hari' : '-'}</td>
                    <td class="p-3 text-center">
                        <button onclick="editProgram(${index})" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">Edit Program</button>
                    </td>
                </tr>
            `).join('');

             return `
                <div class="overflow-x-auto bg-white rounded shadow">
                    <table class="w-full text-left border-collapse" id="dataTable">
                        <thead class="bg-teal-50">
                            <tr>
                                <th class="p-3 text-sm font-semibold text-teal-800">Pasien</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Paket Program</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Durasi Waktu</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        function renderTerapiTable() {
             let rows = db.patients.map((p, index) => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 font-bold text-teal-700">${p.name}</td>
                    <td class="p-3 text-sm italic">${p.therapyPlan || 'Belum ada rencana terapi'}</td>
                    <td class="p-3 text-center">
                        <button onclick="editTherapy(${index})" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">Edit Terapi</button>
                    </td>
                </tr>
            `).join('');

             return `
                <div class="overflow-x-auto bg-white rounded shadow">
                    <table class="w-full text-left border-collapse" id="dataTable">
                        <thead class="bg-teal-50">
                            <tr>
                                <th class="p-3 text-sm font-semibold text-teal-800">Pasien</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Keterangan Rencana Terapi</th>
                                <th class="p-3 text-sm font-semibold text-teal-800">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        // --- CHART GENERATOR ---
        function renderBPSSCharts() {
            db.crisis.forEach((c, idx) => {
                const ctx = document.getElementById(`chart-${idx}`);
                if(ctx) {
                    new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: ['Biological', 'Psychological', 'Social', 'Spiritual'],
                            datasets: [{
                                label: 'BPSS',
                                data: [c.bioScore, c.psychoScore, c.socialScore, c.spiritualScore],
                                fill: true,
                                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                                borderColor: 'rgb(54, 162, 235)',
                                pointBackgroundColor: 'rgb(54, 162, 235)',
                                pointBorderColor: '#fff',
                                pointHoverBackgroundColor: '#fff',
                                pointHoverBorderColor: 'rgb(54, 162, 235)'
                            }]
                        },
                        options: {
                            elements: { line: { borderWidth: 3 } },
                            scales: { r: { min: 0, max: 25, ticks: { display: false } } },
                            plugins: { legend: { display: false } }
                        }
                    });
                }
            });
        }

        // --- CRUD & LOGIC ---

        function saveDataLocal() {
            localStorage.setItem('mmrc_db', JSON.stringify(db));
        }

        function deleteData(collection, index) {
            if(confirm('Yakin ingin menghapus data ini?')) {
                db[collection].splice(index, 1);
                saveDataLocal();
                renderSection(currentSection);
            }
        }

        function globalSearch() {
            const input = document.getElementById("globalSearch");
            const filter = input.value.toUpperCase();
            const table = document.getElementById("dataTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let txtValue = tr[i].textContent || tr[i].innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }

        // --- MODAL & FORM HANDLERS ---
        const modal = document.getElementById('inputModal');
        const formContainer = document.getElementById('dynamicForm');

        function openModal() {
            modal.classList.remove('hidden');
            generateFormFields();
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        function generateFormFields() {
            let html = '';
            
            // Shared: Patient Selection dropdown
            const patientOptions = db.patients.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            const patientSelect = `<div class="flex flex-col"><label class="text-xs font-bold text-gray-600">Pilih Pasien</label><select id="patientId" class="border p-2 rounded">${patientOptions}</select></div>`;

            if (currentSection === 'dashboard') {
                html = `
                    <div class="col-span-2 text-sm text-teal-800 font-bold border-b">Registrasi & Biodata</div>
                    <input type="date" id="regDate" class="border p-2 rounded" required>
                    <input type="text" id="name" placeholder="Nama Lengkap" class="border p-2 rounded">
                    <input type="text" id="pob" placeholder="Tempat Lahir" class="border p-2 rounded">
                    <input type="number" id="age" placeholder="Usia" class="border p-2 rounded">
                    <select id="status" class="border p-2 rounded"><option>Menikah</option><option>Belum Menikah</option><option>Janda/Duda</option></select>
                    <input type="text" id="education" placeholder="Pendidikan Terakhir" class="border p-2 rounded">
                    <input type="text" id="job" placeholder="Pekerjaan" class="border p-2 rounded">
                    <input type="text" id="address" placeholder="Alamat" class="border p-2 rounded">
                    <input type="text" id="guardian" placeholder="Nama Wali" class="border p-2 rounded">
                    <textarea id="spotcheck" placeholder="Spotcheck Barang Bawaan" class="border p-2 rounded col-span-2"></textarea>
                    
                    <div class="col-span-2 text-sm text-teal-800 font-bold border-b mt-4">Medis & Diagnosa</div>
                    <textarea id="histPhysical" placeholder="Riwayat Fisik" class="border p-2 rounded"></textarea>
                    <textarea id="histPsych" placeholder="Riwayat Psikis" class="border p-2 rounded"></textarea>
                    <textarea id="prevDiag" placeholder="Diagnosa Sebelumnya" class="border p-2 rounded"></textarea>
                    <textarea id="medHist" placeholder="Riwayat Obat" class="border p-2 rounded"></textarea>
                    <input type="text" id="condition" placeholder="Kondisi Terkini" class="border p-2 rounded col-span-2">
                    
                    <input type="text" id="docName" placeholder="Nama Dokter" class="border p-2 rounded">
                    <input type="text" id="diagnosis" placeholder="Diagnosa Masuk" class="border p-2 rounded">
                    <textarea id="plan" placeholder="Planning Dokter" class="border p-2 rounded col-span-2"></textarea>
                    <div class="col-span-2 flex space-x-4 bg-gray-100 p-2 rounded">
                        <label><input type="checkbox" value="Injeksi" class="interv"> Injeksi</label>
                        <label><input type="checkbox" value="Urine Test" class="interv"> Urine Test</label>
                        <label><input type="checkbox" value="Fiksasi" class="interv"> Fiksasi</label>
                    </div>
                    <textarea id="prescription" placeholder="Resep & Jumlah Obat" class="border p-2 rounded col-span-2"></textarea>
                `;
            } else if (currentSection === 'medicine') {
                html = `
                    ${patientSelect}
                    <input type="text" id="drugName" placeholder="Nama Obat" class="border p-2 rounded">
                    <input type="number" id="initialStock" placeholder="Stok Awal" class="border p-2 rounded">
                    <p class="col-span-2 text-xs text-gray-500">*Input log penggunaan dilakukan di tabel utama.</p>
                `;
            } else if (currentSection === 'ttv') {
                html = `
                    ${patientSelect}
                    <input type="datetime-local" id="timestamp" class="border p-2 rounded">
                    <input type="text" id="td" placeholder="Tensi Darah (mmHg)" class="border p-2 rounded">
                    <input type="number" id="sat" placeholder="Saturasi (%)" class="border p-2 rounded">
                    <input type="number" id="rr" placeholder="Respiration Rate" class="border p-2 rounded">
                    <input type="number" id="tb" placeholder="TB (cm)" class="border p-2 rounded">
                    <input type="number" id="bb" placeholder="BB (kg)" class="border p-2 rounded">
                    <textarea id="gds" placeholder="Keterangan GDS" class="border p-2 rounded col-span-2"></textarea>
                `;
            } else if (currentSection === 'crisis') {
                html = `
                    ${patientSelect}
                    <input type="datetime-local" id="timestamp" class="border p-2 rounded">
                    <input type="number" id="bioScore" placeholder="Biological (0-25)" max="25" class="border p-2 rounded">
                    <input type="number" id="psychoScore" placeholder="Psychological (0-25)" max="25" class="border p-2 rounded">
                    <input type="number" id="socialScore" placeholder="Social (0-25)" max="25" class="border p-2 rounded">
                    <input type="number" id="spiritualScore" placeholder="Spiritual (0-25)" max="25" class="border p-2 rounded">
                    <textarea id="dischargeEval" placeholder="Evaluasi Discharge" class="border p-2 rounded"></textarea>
                    <textarea id="change7days" placeholder="Perubahan 7 Hari Detox" class="border p-2 rounded"></textarea>
                `;
            }
            // Program & Terapi use special Edit modals, not general Add
            
            formContainer.innerHTML = html;
        }

        function saveData() {
            // Helper to get value safely
            const val = (id) => document.getElementById(id) ? document.getElementById(id).value : '';

            if (currentSection === 'dashboard') {
                const newPatient = {
                    id: Date.now().toString(),
                    regDate: val('regDate'),
                    name: val('name'),
                    age: val('age'),
                    status: val('status'),
                    guardian: val('guardian'),
                    histPhysical: val('histPhysical'),
                    histPsych: val('histPsych'),
                    condition: val('condition'),
                    docName: val('docName'),
                    diagnosis: val('diagnosis'),
                    interventions: Array.from(document.querySelectorAll('.interv:checked')).map(cb => cb.value),
                    // ... other fields not explicitly mapped for brevity but stored in object if needed
                    programPackage: '-',
                    programDuration: '-',
                    therapyPlan: '-'
                };
                db.patients.push(newPatient);
            } else if (currentSection === 'medicine') {
                const init = parseInt(val('initialStock')) || 0;
                db.medicines.push({
                    patientId: val('patientId'),
                    drugName: val('drugName'),
                    initialStock: init,
                    usedStock: 0,
                    currentStock: init,
                    logs: []
                });
            } else if (currentSection === 'ttv') {
                db.vitals.push({
                    patientId: val('patientId'),
                    timestamp: val('timestamp'),
                    td: val('td'), sat: val('sat'), rr: val('rr'), tb: val('tb'), bb: val('bb'),
                    gds: val('gds')
                });
            } else if (currentSection === 'crisis') {
                db.crisis.push({
                    patientId: val('patientId'),
                    timestamp: val('timestamp'),
                    bioScore: parseInt(val('bioScore')),
                    psychoScore: parseInt(val('psychoScore')),
                    socialScore: parseInt(val('socialScore')),
                    spiritualScore: parseInt(val('spiritualScore')),
                    dischargeEval: val('dischargeEval'),
                    change7days: val('change7days')
                });
            }

            saveDataLocal();
            closeModal();
            renderSection(currentSection);
        }

        // --- SPECIAL FEATURES ---

        function addMedicineUsage(idx) {
            const med = db.medicines[idx];
            if(med.currentStock <= 0) return alert('Stok obat habis!');
            
            const notes = prompt("Masukkan keterangan penggunaan:");
            if(notes) {
                const now = new Date().toLocaleString();
                med.usedStock += 1;
                med.currentStock -= 1;
                med.logs.push({
                    date: now,
                    notes: notes,
                    pic: currentUser
                });
                
                if(med.currentStock <= 7) alert(`PERINGATAN: Stok ${med.drugName} sisa ${med.currentStock}!`);
                
                saveDataLocal();
                renderSection('medicine');
            }
        }

        function editProgram(index) {
            const p = db.patients[index];
            const pack = prompt("Paket Program (Reguler/Ekslusif):", p.programPackage);
            const dur = prompt("Durasi (7/14/30/60):", p.programDuration);
            if(pack && dur) {
                p.programPackage = pack;
                p.programDuration = dur;
                saveDataLocal();
                renderSection('program');
            }
        }

        function editTherapy(index) {
            const p = db.patients[index];
            const plan = prompt("Keterangan Rencana Terapi:", p.therapyPlan);
            if(plan) {
                p.therapyPlan = plan;
                saveDataLocal();
                renderSection('terapi');
            }
        }

        // --- EXPORT TO EXCEL ---
        function exportToExcel() {
            const table = document.getElementById("dataTable");
            if(!table) return alert("Tidak ada data untuk diekspor.");
            
            /* Generate workbook */
            const wb = XLSX.utils.table_to_book(table, {sheet: "Sheet 1"});
            
            /* Generate file download */
            XLSX.writeFile(wb, `MMRC_Export_${currentSection}_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

    </script>
</body>
</html>
