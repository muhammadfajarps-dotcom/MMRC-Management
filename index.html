<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMHC Pro - Patient Integrated System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .nav-active { @apply bg-indigo-600 text-white shadow-xl shadow-indigo-200; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen">

    <div id="login-page" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-12 shadow-2xl text-center">
            <h1 class="text-3xl font-black text-slate-800 mb-8 italic">MMHC<span class="text-indigo-600">PRO</span></h1>
            <form id="login-form" class="space-y-4">
                <input type="text" id="user-input" placeholder="ID Administrator" class="w-full bg-slate-50 p-5 rounded-2xl outline-none font-bold" required>
                <input type="password" id="pass-input" placeholder="Passcode" class="w-full bg-slate-50 p-5 rounded-2xl outline-none font-bold" required>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-5 rounded-2xl shadow-xl">Otentikasi</button>
            </form>
        </div>
    </div>

    <div id="main-content" class="hidden flex min-h-screen">
        <aside class="w-20 lg:w-72 bg-white border-r border-slate-100 flex flex-col items-center lg:items-start">
            <div class="p-8 hidden lg:block text-2xl font-black text-indigo-600">MMHC PRO</div>
            <nav class="flex-1 w-full px-4 space-y-4 mt-10">
                <button onclick="showPage('dashboard')" id="nav-dashboard" class="nav-item w-full p-4 rounded-2xl flex items-center justify-center lg:justify-start gap-4 font-bold text-slate-400 nav-active"><i class="fas fa-th-large"></i> <span class="hidden lg:block">Dashboard</span></button>
                <button onclick="showPage('pasien')" id="nav-pasien" class="nav-item w-full p-4 rounded-2xl flex items-center justify-center lg:justify-start gap-4 font-bold text-slate-400"><i class="fas fa-users"></i> <span class="hidden lg:block">Data Pasien</span></button>
            </nav>
        </aside>

        <main class="flex-1 p-6 lg:p-12 overflow-y-auto">
            
            <section id="page-dashboard" class="page-content space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="stats-summary"></div>
            </section>

            <section id="page-pasien" class="page-content hidden space-y-8">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black">Data Pasien</h2>
                    <button onclick="openModalPasien()" class="bg-indigo-600 text-white px-6 py-4 rounded-2xl font-black shadow-lg shadow-indigo-100">+ Registrasi Pasien</button>
                </div>
                <div class="relative">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    <input type="text" id="search-pasien" oninput="renderPasien()" placeholder="Cari nama pasien..." class="w-full bg-white p-5 pl-14 rounded-2xl shadow-sm outline-none font-bold">
                </div>
                <div id="list-pasien" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>

            <section id="page-detail-pasien" class="page-content hidden space-y-8">
                <button onclick="showPage('pasien')" class="text-slate-400 font-bold hover:text-indigo-600"><i class="fas fa-arrow-left mr-2"></i> Kembali ke Daftar</button>
                
                <div id="detail-header" class="bg-indigo-600 rounded-[2.5rem] p-10 text-white shadow-xl"></div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-black"><i class="fas fa-heartbeat text-red-500 mr-2"></i> Data TTV</h3>
                            <button onclick="openModalTTV()" class="text-indigo-600 font-bold text-sm">+ Input TTV</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="text-slate-400 font-black uppercase text-[10px]">
                                    <tr class="border-b">
                                        <th class="py-4">Tanggal</th><th class="py-4">TD (mmHg)</th><th class="py-4">Nadi</th><th class="py-4">Suhu</th><th class="py-4">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="ttv-table-body" class="font-bold text-slate-600"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-black"><i class="fas fa-pills text-indigo-500 mr-2"></i> Inventori Obat</h3>
                            <button onclick="openModalObat()" class="text-indigo-600 font-bold text-sm">+ Tambah Stok</button>
                        </div>
                        <div id="obat-list-detail" class="space-y-4"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-pasien" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-10">
            <h3 class="text-2xl font-black mb-6">Profil Pasien</h3>
            <form id="form-pasien" class="space-y-4">
                <input type="hidden" id="p-id">
                <input type="text" id="p-nama" placeholder="Nama Lengkap" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none border-2 border-transparent focus:border-indigo-500" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="p-umur" placeholder="Umur" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <select id="p-jk" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                        <option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option>
                    </select>
                </div>
                <div class="flex gap-4 pt-6">
                    <button type="button" onclick="closeAllModals()" class="flex-1 font-bold text-slate-400">Batal</button>
                    <button type="submit" class="flex-[2] bg-indigo-600 text-white py-4 rounded-xl font-black">Simpan Pasien</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-ttv" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-10">
            <h3 class="text-2xl font-black mb-6 italic">Input Tanda Vital</h3>
            <form id="form-ttv" class="space-y-4">
                <input type="hidden" id="ttv-id">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="ttv-td" placeholder="TD (misal: 120/80)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="number" id="ttv-nadi" placeholder="Nadi (bpm)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="text" id="ttv-suhu" placeholder="Suhu (°C)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="number" id="ttv-nafas" placeholder="RR (x/mnt)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                </div>
                <input type="date" id="ttv-tgl" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                <button type="submit" class="w-full bg-red-500 text-white py-4 rounded-xl font-black mt-4">Simpan TTV</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, updateDoc, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdzWrKOBqrcu6talld7MN-2flHNibEWnE",
            authDomain: "mmrc-stock.firebaseapp.com",
            projectId: "mmrc-stock",
            storageBucket: "mmrc-stock.firebasestorage.app",
            messagingSenderId: "722563453659",
            appId: "1:722563453659:web:b9f867367ecadb7a1df2fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let PASIEN = [], OBAT = [], TTV = [], SELECTED_PASIEN_ID = null;

        // AUTH & SYNC
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            if(document.getElementById('user-input').value === "MMRC.Stock1999" && document.getElementById('pass-input').value === "Madani1999") {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                startRealtimeSync();
            }
        };

        function startRealtimeSync() {
            onSnapshot(collection(db, "pasien_new"), s => { PASIEN = s.docs.map(d => ({id:d.id, ...d.data()})); renderPasien(); });
            onSnapshot(collection(db, "obat_new"), s => { OBAT = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_PASIEN_ID) renderDetailPasien(SELECTED_PASIEN_ID); });
            onSnapshot(collection(db, "ttv_new"), s => { TTV = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_PASIEN_ID) renderDetailPasien(SELECTED_PASIEN_ID); });
        }

        // NAVIGASI
        window.showPage = (id) => {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('nav-active'));
            if(document.getElementById('nav-'+id)) document.getElementById('nav-'+id).classList.add('nav-active');
        };

        // CRUD PASIEN
        window.openModalPasien = (id = null) => {
            document.getElementById('form-pasien').reset();
            document.getElementById('p-id').value = id || '';
            if(id) {
                const p = PASIEN.find(x => x.id === id);
                document.getElementById('p-nama').value = p.nama;
                document.getElementById('p-umur').value = p.umur;
            }
            document.getElementById('modal-pasien').classList.remove('hidden');
        };

        document.getElementById('form-pasien').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = { 
                nama: document.getElementById('p-nama').value, 
                umur: document.getElementById('p-umur').value,
                jk: document.getElementById('p-jk').value 
            };
            id ? await updateDoc(doc(db, "pasien_new", id), data) : await addDoc(collection(db, "pasien_new"), data);
            closeAllModals();
        };

        window.renderPasien = () => {
            const search = document.getElementById('search-pasien').value.toLowerCase();
            const list = document.getElementById('list-pasien');
            list.innerHTML = PASIEN.filter(p => p.nama.toLowerCase().includes(search)).map(p => `
                <div onclick="openLemari('${p.id}')" class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 cursor-pointer hover:shadow-xl hover:border-indigo-200 transition-all group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center"><i class="fas fa-folder"></i></div>
                        <button onclick="event.stopPropagation(); deleteData('pasien_new', '${p.id}')" class="text-slate-200 hover:text-red-500"><i class="fas fa-trash"></i></button>
                    </div>
                    <h4 class="text-xl font-black text-slate-800">${p.nama}</h4>
                    <p class="text-xs font-bold text-slate-400 uppercase">${p.umur} Thn • ${p.jk}</p>
                </div>
            `).join('');
        };

        // DETAIL PASIEN (LEMARI)
        window.openLemari = (id) => {
            SELECTED_PASIEN_ID = id;
            showPage('detail-pasien');
            renderDetailPasien(id);
        };

        function renderDetailPasien(id) {
            const p = PASIEN.find(x => x.id === id);
            if(!p) return;

            document.getElementById('detail-header').innerHTML = `
                <h2 class="text-4xl font-black">${p.nama}</h2>
                <p class="font-bold opacity-80 uppercase tracking-widest text-sm mt-2">${p.jk} • ${p.umur} Tahun • ID: ${p.id.slice(0,5)}</p>
            `;

            // Render TTV
            const patientTTV = TTV.filter(t => t.pasienId === id).sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal));
            document.getElementById('ttv-table-body').innerHTML = patientTTV.map(t => `
                <tr class="border-b border-slate-50">
                    <td class="py-4">${t.tanggal}</td>
                    <td class="py-4 text-indigo-600">${t.td}</td>
                    <td class="py-4">${t.nadi}</td>
                    <td class="py-4 text-red-500">${t.suhu}°</td>
                    <td class="py-4">
                        <button onclick="deleteData('ttv_new', '${t.id}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-times-circle"></i></button>
                    </td>
                </tr>
            `).join('');

            // Render Obat
            const patientObat = OBAT.filter(o => o.pasienId === id);
            document.getElementById('obat-list-detail').innerHTML = patientObat.map(o => `
                <div class="bg-slate-50 p-6 rounded-2xl flex justify-between items-center">
                    <div>
                        <p class="font-black text-slate-800">${o.nama}</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase italic">Masuk: ${o.tglMasuk}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-black text-indigo-600">${o.stok}</span>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">${o.satuan}</p>
                    </div>
                    <button onclick="deleteData('obat_new', '${o.id}')" class="ml-4 text-slate-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            `).join('') || '<p class="text-slate-400 text-center py-10 italic">Belum ada obat di lemari ini.</p>';
        }

        // INPUT TTV & OBAT SPESIFIK
        window.openModalTTV = () => {
            document.getElementById('form-ttv').reset();
            document.getElementById('ttv-tgl').value = new Date().toISOString().split('T')[0];
            document.getElementById('modal-ttv').classList.remove('hidden');
        };

        document.getElementById('form-ttv').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "ttv_new"), {
                pasienId: SELECTED_PASIEN_ID,
                td: document.getElementById('ttv-td').value,
                nadi: document.getElementById('ttv-nadi').value,
                suhu: document.getElementById('ttv-suhu').value,
                nafas: document.getElementById('ttv-nafas').value,
                tanggal: document.getElementById('ttv-tgl').value
            });
            closeAllModals();
        };

        window.openModalObat = () => {
            const namaObat = prompt("Nama Obat:");
            const stok = prompt("Jumlah Stok:");
            const satuan = prompt("Satuan (Tablet/Botol):");
            if(namaObat && stok) {
                addDoc(collection(db, "obat_new"), {
                    pasienId: SELECTED_PASIEN_ID,
                    nama: namaObat,
                    stok: parseInt(stok),
                    satuan: satuan,
                    tglMasuk: new Date().toLocaleDateString('id-ID')
                });
            }
        };

        window.deleteData = async (col, id) => { if(confirm('Hapus data?')) await deleteDoc(doc(db, col, id)); };
        window.closeAllModals = () => {
            document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));
        };

    </script>
</body>
    </html>
