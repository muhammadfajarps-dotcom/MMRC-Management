<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Stock 1999 - Medical System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            600: '#e11d48',
                            700: '#be123c', // Maroon Utama
                            800: '#9f1239',
                            900: '#881337',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>

<body class="text-slate-800 h-screen flex selection:bg-brand-200 selection:text-brand-900">

    <div id="auth-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-slate-900 to-brand-900">
        <div class="absolute inset-0 login-bg"></div> <div class="bg-white/95 backdrop-blur-xl p-10 rounded-3xl shadow-2xl w-full max-w-sm relative z-10 border border-white/20 transform transition-all hover:scale-[1.01]">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 bg-gradient-to-tr from-brand-700 to-brand-600 rounded-2xl flex items-center justify-center shadow-lg text-white text-3xl">
                    <i class="fas fa-heartbeat"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-center text-slate-800 mb-1">MMRC STOCK 1999</h1>
            <p class="text-center text-slate-500 text-xs font-semibold tracking-wider mb-8">MEDICAL MANAGEMENT SYSTEM</p>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-brand-800 uppercase ml-1">Username</label>
                    <input type="text" id="login-user" class="input-modern font-bold text-center" placeholder="Masukan ID Staff">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-brand-800 uppercase ml-1">Password</label>
                    <input type="password" id="login-pass" class="input-modern font-bold text-center" placeholder="••••••••">
                </div>
                <button onclick="app.login()" class="w-full bg-gradient-to-r from-brand-800 to-brand-600 hover:from-brand-700 hover:to-brand-500 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-brand-200/50 transition-all transform active:scale-95 mt-2">
                    MASUK SISTEM
                </button>
            </div>
            <div class="mt-8 pt-6 border-t border-slate-200 text-center">
                <p class="text-[10px] text-slate-400 font-medium">© 2024 MMRC SYSTEM V.5.0</p>
            </div>
        </div>
    </div>

    <div id="app-layer" class="hidden flex w-full h-full bg-slate-50">
        
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col z-20 shadow-xl hidden md:flex">
            <div class="p-8 pb-4">
                <div class="flex items-center gap-3 text-brand-800">
                    <i class="fas fa-clinic-medical text-3xl"></i>
                    <div>
                        <h2 class="font-extrabold text-xl leading-none tracking-tight">MMRC</h2>
                        <p class="text-[10px] font-bold text-slate-400 tracking-[0.2em]">STOCK 1999</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 overflow-y-auto px-4 py-2 space-y-1">
                <div class="text-[10px] font-bold text-slate-400 px-4 py-2 uppercase tracking-widest mt-4">Menu Pasien</div>
                <button id="btn-dashboard" onclick="app.nav('dashboard')" class="nav-item">
                    <i class="fas fa-users w-5"></i> Dashboard
                </button>
                <button id="btn-medicine" onclick="app.nav('medicine')" class="nav-item">
                    <i class="fas fa-pills w-5"></i> Data Obat
                </button>
                <button id="btn-ttv" onclick="app.nav('ttv')" class="nav-item">
                    <i class="fas fa-stethoscope w-5"></i> TTV & GDS
                </button>
                
                <div class="text-[10px] font-bold text-slate-400 px-4 py-2 uppercase tracking-widest mt-6">Layanan Medis</div>
                <button id="btn-visit" onclick="app.nav('visit')" class="nav-item">
                    <i class="fas fa-user-md w-5"></i> Visit Dokter
                </button>
                <button id="btn-crisis" onclick="app.nav('crisis')" class="nav-item">
                    <i class="fas fa-chart-area w-5"></i> Grafik Crisis
                </button>
                <button id="btn-program" onclick="app.nav('program')" class="nav-item">
                    <i class="fas fa-clipboard-list w-5"></i> Program
                </button>
                <button id="btn-therapy" onclick="app.nav('therapy')" class="nav-item">
                    <i class="fas fa-notes-medical w-5"></i> Catatan Terapi
                </button>
            </nav>

            <div class="p-4 border-t border-slate-100">
                <button onclick="location.reload()" class="w-full border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:text-red-600 py-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> KELUAR SISTEM
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10">
                <div>
                    <h2 id="page-title" class="text-2xl font-extrabold text-slate-800 tracking-tight">DASHBOARD</h2>
                    <p class="text-[10px] text-slate-400 font-semibold">Selamat Datang, Admin Operasional</p>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="relative group">
                        <i class="fas fa-search absolute left-4 top-3 text-slate-400 group-focus-within:text-brand-600 transition"></i>
                        <input id="global-search" onkeyup="app.search()" type="text" placeholder="Cari data pasien..." 
                            class="pl-10 pr-4 py-2.5 bg-slate-100 rounded-full text-xs font-bold w-64 focus:w-80 focus:bg-white focus:ring-2 focus:ring-brand-100 outline-none border-none transition-all">
                    </div>
                    
                    <div class="h-8 w-px bg-slate-200 mx-2"></div>
                    
                    <button onclick="app.exportToWord()" class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white transition flex items-center justify-center shadow-sm" title="Export Word">
                        <i class="fas fa-file-word"></i>
                    </button>
                    <button onclick="app.exportAllExcel()" class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white transition flex items-center justify-center shadow-sm" title="Export Excel">
                        <i class="fas fa-file-excel"></i>
                    </button>
                </div>
            </header>

            <div id="main-content" class="flex-1 overflow-y-auto p-8 scroll-smooth">
                </div>
        </main>
    </div>

    <div id="modal-container" class="hidden fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl flex flex-col max-h-[90vh] border border-white/50 animate-popup">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-gradient-to-r from-brand-50 to-white rounded-t-[2rem]">
                <div>
                    <h3 id="modal-title" class="font-bold text-brand-800 text-lg">FORM INPUT</h3>
                    <p class="text-[10px] text-slate-400">Silakan isi data dengan lengkap</p>
                </div>
                <button onclick="app.closeModal()" class="w-8 h-8 rounded-full bg-white text-slate-400 hover:bg-red-50 hover:text-red-500 transition shadow-sm flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-body" class="p-8 overflow-y-auto">
                </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.0/build/index.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
