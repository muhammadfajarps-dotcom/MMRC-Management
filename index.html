<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC PRO V5.6 - Device Upload Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F1F5F9; }
        .nav-btn { transition: all 0.3s; border-radius: 12px; }
        .nav-btn.active { background: #4F46E5; color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .card-medis { background: white; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; }
        .input-medis { border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 0.7rem 1rem; width: 100%; outline: none; transition: 0.2s; font-size: 14px; }
        .input-medis:focus { border-color: #4F46E5; }
        
        /* Style khusus Upload Foto */
        .photo-upload-box { border: 2px dashed #CBD5E1; border-radius: 20px; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; background: #F8FAFC; transition: 0.3s; }
        .photo-upload-box:hover { border-color: #4F46E5; background: #EEF2FF; }
        .photo-preview { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800">

    <div id="login-page" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl text-center">
            <h1 class="text-2xl font-black text-indigo-600 mb-1 italic">MMRC SYSTEM</h1>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-8">Admin Access V5.6</p>
            <form id="login-form" class="space-y-4">
                <input type="text" id="user-input" placeholder="Admin ID" class="input-medis text-center font-bold" required>
                <input type="password" id="pass-input" placeholder="Passcode" class="input-medis text-center font-bold" required>
                <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-xl shadow-lg">AKSES DATABASE</button>
            </form>
        </div>
    </div>

    <div id="main-content" class="hidden min-h-screen flex flex-col">
        <header class="bg-white border-b sticky top-0 z-50 p-4">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white"><i class="fas fa-brain"></i></div>
                    <h1 class="font-black text-xl italic tracking-tighter">MMRC <span class="text-indigo-600">PRO</span></h1>
                </div>
                <nav class="flex bg-slate-100 p-1 rounded-2xl gap-1 overflow-x-auto w-full md:w-auto">
                    <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn active px-4 py-2 text-[10px] font-black uppercase">Dashboard</button>
                    <button onclick="switchTab('visit')" id="btn-visit" class="nav-btn px-4 py-2 text-[10px] font-black uppercase">Visit Dokter</button>
                    <button onclick="switchTab('medicine')" id="btn-medicine" class="nav-btn px-4 py-2 text-[10px] font-black uppercase">Medicine</button>
                    <button onclick="switchTab('ttv')" id="btn-ttv" class="nav-btn px-4 py-2 text-[10px] font-black uppercase">TTV & GDS</button>
                </nav>
            </div>
        </header>

        <main class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full">
            <div id="search-section" class="mb-6">
                <div class="relative max-w-md mx-auto">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="global-search" oninput="handleSearch()" placeholder="Cari Nama Pasien..." class="w-full bg-white p-4 pl-12 rounded-2xl shadow-sm outline-none font-bold text-sm">
                </div>
            </div>

            <div id="tab-dashboard" class="tab-content space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-black italic border-l-4 border-indigo-600 pl-3 uppercase">DATABASE PASIEN</h2>
                    <button onclick="openModal('pasien')" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-black text-xs shadow-md">+ PASIEN BARU</button>
                </div>
                <div id="list-pasien" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div id="tab-visit" class="tab-content hidden space-y-6">
                <div id="visit-content"></div>
            </div>

            <div id="tab-medicine" class="tab-content hidden space-y-6"><div id="medicine-content"></div></div>
            <div id="tab-ttv" class="tab-content hidden space-y-6"><div id="ttv-content"></div></div>
        </main>
    </div>

    <div id="modal-pasien" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-6xl p-8 max-h-[90vh] overflow-y-auto custom-scroll">
            <form id="form-pasien" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <input type="hidden" id="p-id">
                <input type="hidden" id="p-foto-base64">
                
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-indigo-500 uppercase border-b pb-2">I. Foto & Biodata</p>
                    
                    <div class="photo-upload-box" onclick="document.getElementById('p-file').click()">
                        <img id="p-preview" class="photo-preview hidden">
                        <div id="p-upload-ui" class="text-center">
                            <i class="fas fa-camera text-2xl text-slate-300 mb-2"></i>
                            <p class="text-[10px] font-bold text-slate-400">TAP UNTUK FOTO</p>
                        </div>
                    </div>
                    <input type="file" id="p-file" class="hidden" accept="image/*" onchange="processImage(this, 'p-preview', 'p-upload-ui', 'p-foto-base64')">

                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="p-tgl-masuk" class="input-medis">
                        <input type="time" id="p-jam-masuk" class="input-medis">
                    </div>
                    <input type="text" id="p-nama" placeholder="Nama Lengkap" class="input-medis font-bold" required>
                    <input type="text" id="p-ttl" placeholder="TTL" class="input-medis">
                </div>

                <div class="space-y-4">
                    <p class="text-[10px] font-black text-red-500 uppercase border-b pb-2">II. Riwayat & Kondisi</p>
                    <textarea id="p-riwayat-psikis" placeholder="Riwayat Psikis" class="input-medis h-24"></textarea>
                    <textarea id="p-diagnosa-lama" placeholder="Diagnosa Lama" class="input-medis h-24"></textarea>
                    <textarea id="p-kondisi" placeholder="Kondisi Terkini" class="input-medis h-32 bg-blue-50"></textarea>
                </div>

                <div class="space-y-4">
                    <p class="text-[10px] font-black text-emerald-500 uppercase border-b pb-2">III. Diagnosa MMRC</p>
                    <textarea id="p-diagnosa-baru" placeholder="Diagnosa Baru" class="input-medis font-bold h-24"></textarea>
                    <textarea id="p-planning" placeholder="Planning" class="input-medis h-24"></textarea>
                    <div class="flex gap-2 pt-4">
                        <button type="button" onclick="closeModals()" class="flex-1 bg-slate-100 py-4 rounded-xl font-black text-xs">BATAL</button>
                        <button type="submit" class="flex-[2] bg-indigo-600 text-white py-4 rounded-xl font-black text-xs uppercase">Simpan Data</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-visit" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6 uppercase text-violet-600 italic">Hasil Visit Dokter</h3>
            <form id="form-visit" class="space-y-4">
                <input type="hidden" id="vst-id">
                <input type="hidden" id="vst-foto-base64">
                
                <div class="photo-upload-box" onclick="document.getElementById('vst-file').click()">
                    <img id="vst-preview" class="photo-preview hidden">
                    <div id="vst-upload-ui" class="text-center">
                        <i class="fas fa-image text-2xl text-slate-300 mb-2"></i>
                        <p class="text-[10px] font-bold text-slate-400">FOTO DOKUMENTASI VISIT</p>
                    </div>
                </div>
                <input type="file" id="vst-file" class="hidden" accept="image/*" onchange="processImage(this, 'vst-preview', 'vst-upload-ui', 'vst-foto-base64')">

                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="vst-tgl" class="input-medis">
                    <input type="time" id="vst-jam" class="input-medis">
                </div>
                <textarea id="vst-hasil" placeholder="Detail wawancara..." class="input-medis h-40 bg-violet-50" required></textarea>
                <button type="submit" class="w-full bg-violet-600 text-white py-4 rounded-xl font-black shadow-lg">SIMPAN VISIT</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdzWrKOBqrcu6talld7MN-2flHNibEWnE",
            authDomain: "mmrc-stock.firebaseapp.com",
            projectId: "mmrc-stock",
            storageBucket: "mmrc-stock.firebasestorage.app",
            messagingSenderId: "722563453659",
            appId: "1:722563453659:web:b9f867367ecadb7a1df2fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let DATA_PASIEN = [], DATA_VISIT = [];
        let ACTIVE_PASIEN_ID = null;

        // AUTH
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            if(document.getElementById('user-input').value === "ADMIN.MMRC" && document.getElementById('pass-input').value === "MMRC2026") {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                startSync();
            }
        };

        function startSync() {
            onSnapshot(collection(db, "patients_v5"), s => { DATA_PASIEN = s.docs.map(d => ({id:d.id, ...d.data()})); renderPatients(); if(ACTIVE_PASIEN_ID) updateViews(); });
            onSnapshot(collection(db, "visit_v5"), s => { DATA_VISIT = s.docs.map(d => ({id:d.id, ...d.data()})); if(ACTIVE_PASIEN_ID) updateViews(); });
        }

        // FUNGSI PROSES GAMBAR (PERANGKAT -> BASE64)
        window.processImage = (input, previewId, uiId, hiddenId) => {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById(previewId).src = e.target.result;
                    document.getElementById(previewId).classList.remove('hidden');
                    document.getElementById(uiId).classList.add('hidden');
                    document.getElementById(hiddenId).value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        window.switchTab = (t) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.remove('hidden');
            document.getElementById(`btn-${t}`).classList.add('active');
        };

        window.openModal = (type, id = null) => {
            const form = document.getElementById(`form-${type}`);
            form.reset();
            const pre = type === 'pasien' ? 'p' : 'vst';
            document.getElementById(`${pre}-id`).value = id || '';
            
            // Reset Preview Foto
            document.getElementById(`${pre}-preview`).classList.add('hidden');
            document.getElementById(`${pre}-upload-ui`).classList.remove('hidden');
            document.getElementById(`${pre}-foto-base64`).value = '';

            if(id) {
                const data = (type==='pasien'?DATA_PASIEN:DATA_VISIT).find(x => x.id === id);
                if(type === 'pasien') {
                    Object.keys(data).forEach(k => { if(document.getElementById(`p-${k}`)) document.getElementById(`p-${k}`).value = data[k]; });
                    if(data.foto) {
                        document.getElementById('p-preview').src = data.foto;
                        document.getElementById('p-preview').classList.remove('hidden');
                        document.getElementById('p-upload-ui').classList.add('hidden');
                        document.getElementById('p-foto-base64').value = data.foto;
                    }
                } else {
                    document.getElementById('vst-tgl').value = data.tgl;
                    document.getElementById('vst-jam').value = data.jam;
                    document.getElementById('vst-hasil').value = data.hasil;
                    if(data.foto) {
                        document.getElementById('vst-preview').src = data.foto;
                        document.getElementById('vst-preview').classList.remove('hidden');
                        document.getElementById('vst-upload-ui').classList.add('hidden');
                        document.getElementById('vst-foto-base64').value = data.foto;
                    }
                }
            }
            document.getElementById(`modal-${type}`).classList.remove('hidden');
        };

        window.renderPatients = (q = "") => {
            document.getElementById('list-pasien').innerHTML = DATA_PASIEN.filter(p => p.nama.toLowerCase().includes(q.toLowerCase()))
            .map(p => `
                <div class="card-medis p-4 hover:border-indigo-600 cursor-pointer transition-all" onclick="selectPatient('${p.id}')">
                    <div class="flex gap-4 items-center">
                        <div class="w-16 h-16 rounded-2xl bg-slate-100 overflow-hidden border">
                            ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-300 font-bold">${p.nama.charAt(0)}</div>`}
                        </div>
                        <div class="flex-1">
                            <h4 class="font-black text-slate-800 leading-none">${p.nama}</h4>
                            <p class="text-[9px] font-black text-indigo-500 uppercase italic mt-1">${p.diagnosaBaru || 'Belum Diagnosa'}</p>
                        </div>
                        <div class="flex flex-col gap-1">
                            <button onclick="event.stopPropagation(); openModal('pasien', '${p.id}')" class="text-amber-500 p-2 bg-amber-50 rounded-lg"><i class="fas fa-edit text-xs"></i></button>
                            <button onclick="event.stopPropagation(); deleteData('patients_v5', '${p.id}')" class="text-red-500 p-2 bg-red-50 rounded-lg"><i class="fas fa-trash text-xs"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.selectPatient = (id) => { ACTIVE_PASIEN_ID = id; updateViews(); switchTab('visit'); };

        function updateViews() {
            const p = DATA_PASIEN.find(x => x.id === ACTIVE_PASIEN_ID);
            if(!p) return;

            const visitP = DATA_VISIT.filter(v => v.pasienId === ACTIVE_PASIEN_ID).reverse();
            document.getElementById('visit-content').innerHTML = `
                <div class="card-medis p-8 space-y-6">
                    <div class="flex justify-between items-center border-b pb-4">
                        <h4 class="font-black text-violet-600 uppercase italic">Visit: ${p.nama}</h4>
                        <button onclick="openModal('visit')" class="bg-violet-600 text-white px-5 py-2 rounded-xl text-xs font-black shadow-md">+ VISIT BARU</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${visitP.map(v => `
                            <div class="bg-white rounded-3xl border group relative overflow-hidden flex flex-col">
                                ${v.foto ? `<div class="h-40 border-b overflow-hidden"><img src="${v.foto}" class="w-full h-full object-cover"></div>` : ''}
                                <div class="p-5">
                                    <div class="flex justify-between mb-2">
                                        <span class="text-[10px] font-black text-violet-600 uppercase">${v.tgl} | ${v.jam}</span>
                                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                            <button onclick="openModal('visit','${v.id}')" class="text-blue-500 text-xs"><i class="fas fa-edit"></i></button>
                                            <button onclick="deleteData('visit_v5','${v.id}')" class="text-red-400 text-xs"><i class="fas fa-trash"></i></button>
                                        </div>
                                    </div>
                                    <p class="text-sm font-medium text-slate-700">${v.hasil}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // SUBMITS
        document.getElementById('form-pasien').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = {
                nama: document.getElementById('p-nama').value,
                foto: document.getElementById('p-foto-base64').value,
                tglMasuk: document.getElementById('p-tgl-masuk').value,
                jamMasuk: document.getElementById('p-jam-masuk').value,
                diagnosaBaru: document.getElementById('p-diagnosa-baru').value,
                riwayatPsikis: document.getElementById('p-riwayat-psikis').value,
                kondisi: document.getElementById('p-kondisi').value,
                planning: document.getElementById('p-planning').value
            };
            id ? await updateDoc(doc(db, "patients_v5", id), data) : await addDoc(collection(db, "patients_v5"), data);
            closeModals();
        };

        document.getElementById('form-visit').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('vst-id').value;
            const data = {
                pasienId: ACTIVE_PASIEN_ID,
                foto: document.getElementById('vst-foto-base64').value,
                tgl: document.getElementById('vst-tgl').value,
                jam: document.getElementById('vst-jam').value,
                hasil: document.getElementById('vst-hasil').value
            };
            id ? await updateDoc(doc(db, "visit_v5", id), data) : await addDoc(collection(db, "visit_v5"), data);
            closeModals();
        };

        window.deleteData = async (col, id) => { if(confirm('Hapus data?')) await deleteDoc(doc(db, col, id)); };
        window.closeModals = () => document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));
        window.handleSearch = () => renderPatients(document.getElementById('global-search').value);

    </script>
</body>
</html>
