<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System - Full Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="auth-layer" class="fixed inset-0 z-[200] bg-slate-900 flex items-center justify-center">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center">
            <div class="w-20 h-20 bg-teal-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                <i class="fas fa-hand-holding-medical text-white text-4xl"></i>
            </div>
            <h1 class="text-2xl font-black mb-2 uppercase tracking-tighter">MMRC Operasional</h1>
            <p class="text-slate-400 text-sm mb-8 font-medium">Madani Mental Recovery Center</p>
            <div class="space-y-4">
                <input type="text" id="login-user" class="input-field" placeholder="Username">
                <input type="password" id="login-pass" class="input-field" placeholder="Password">
                <button onclick="app.login()" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-4 rounded-2xl font-bold transition-all shadow-lg">MASUK SISTEM</button>
            </div>
        </div>
    </div>

    <div id="app-layer" class="hidden h-screen flex overflow-hidden">
        <aside class="w-72 bg-white border-r flex flex-col shadow-xl z-50">
            <div class="p-8 border-b">
                <span class="text-2xl font-black text-teal-600 tracking-tighter">MMRC <span class="text-slate-300 font-light">PRO</span></span>
            </div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-2">
                <button onclick="app.nav('dashboard')" id="btn-dashboard" class="nav-btn active"><i class="fas fa-columns w-6"></i> Dashboard</button>
                <button onclick="app.nav('medicine')" id="btn-medicine" class="nav-btn"><i class="fas fa-pills w-6"></i> Medicine</button>
                <button onclick="app.nav('ttv')" id="btn-ttv" class="nav-btn"><i class="fas fa-heartbeat w-6"></i> TTV & GDS</button>
                <button onclick="app.nav('visit')" id="btn-visit" class="nav-btn"><i class="fas fa-user-md w-6"></i> Visit Dokter</button>
                <button onclick="app.nav('crisis')" id="btn-crisis" class="nav-btn"><i class="fas fa-radiation-alt w-6"></i> Pasien Crisis</button>
                <button onclick="app.nav('program')" id="btn-program" class="nav-btn"><i class="fas fa-tasks w-6"></i> Rencana Program</button>
                <button onclick="app.nav('therapy')" id="btn-therapy" class="nav-btn"><i class="fas fa-brain w-6"></i> Rencana Terapi</button>
            </nav>
            <div class="p-4 border-t">
                <button onclick="location.reload()" class="w-full flex items-center justify-center gap-2 p-3 text-red-500 hover:bg-red-50 rounded-xl font-bold transition-all text-sm"><i class="fas fa-power-off"></i> KELUAR</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-20 bg-white border-b flex items-center justify-between px-10">
                <h2 id="page-title" class="text-xl font-black text-slate-700 uppercase tracking-widest">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <input type="text" id="global-search" onkeyup="app.search()" placeholder="Cari Pasien..." class="px-6 py-2 bg-slate-100 rounded-full text-sm outline-none focus:ring-2 focus:ring-teal-500 w-64">
                    <button onclick="app.exportExcel()" class="bg-emerald-600 text-white px-5 py-2 rounded-full text-xs font-bold hover:bg-emerald-700 flex items-center gap-2">
                        <i class="fas fa-file-excel text-lg"></i> EXPORT DATA
                    </button>
                </div>
            </header>
            <div id="main-content" class="p-10 overflow-y-auto flex-1"></div>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[150] hidden items-center justify-center p-6">
        <div class="bg-white w-full max-w-5xl max-h-[90vh] rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl">
            <div class="px-8 py-6 border-b flex justify-between items-center bg-slate-50">
                <h3 id="modal-title" class="text-xl font-bold text-teal-800 tracking-tight">Formulir Data</h3>
                <button onclick="app.closeModal()" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:bg-red-50 hover:text-red-500 rounded-full transition-all text-2xl">&times;</button>
            </div>
            <div id="modal-body" class="p-10 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
