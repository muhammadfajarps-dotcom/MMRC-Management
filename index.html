<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMHC PRO V2 - Sistem Manajemen Obat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .page-section { transition: all 0.3s ease-in-out; }
        .nav-active { background-color: #4f46e5; color: white !important; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.2); }
        .modal-input { width: 100%; background-color: #f8fafc; padding: 1rem; border-radius: 1rem; outline: none; border: 1px solid #f1f5f9; font-weight: 600; }
        .modal-input:focus { border-color: #4f46e5; background-color: white; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <aside class="fixed left-0 top-0 h-screen w-72 bg-white border-r border-slate-100 p-8 hidden md:block z-40">
        <div class="mb-12">
            <h1 class="text-2xl font-black text-indigo-600 italic">MMHC PRO <span class="text-[10px] bg-indigo-100 px-2 py-1 rounded-lg not-italic text-indigo-600 ml-1">V2</span></h1>
        </div>
        <nav class="space-y-3">
            <button onclick="showPage('dashboard')" id="nav-dashboard" class="nav-link w-full flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-400 transition-all">
                <i class="fas fa-th-large"></i> Dashboard
            </button>
            <button onclick="showPage('obat')" id="nav-obat" class="nav-link w-full flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-400 transition-all">
                <i class="fas fa-pills"></i> Inventori Obat
            </button>
            <button onclick="showPage('pasien')" id="nav-pasien" class="nav-link w-full flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-400 transition-all">
                <i class="fas fa-user-injured"></i> Data Pasien
            </button>
            <button onclick="showPage('penggunaan')" id="nav-penggunaan" class="nav-link w-full flex items-center gap-4 p-4 rounded-2xl font-bold text-slate-400 transition-all">
                <i class="fas fa-history"></i> Log Aktivitas
            </button>
        </nav>
    </aside>

    <main class="md:ml-72 p-6 md:p-12 min-h-screen">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
            <div>
                <p id="header-date" class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-1"></p>
                <h2 id="header-title" class="text-3xl font-black text-slate-800 tracking-tight">Dashboard</h2>
            </div>
            <div class="flex gap-4 w-full md:w-auto">
                <div class="relative flex-1 md:w-64">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
                    <input type="text" id="global-search" oninput="renderCurrentPage()" placeholder="Cari data..." class="w-full bg-white border border-slate-100 p-4 pl-12 rounded-2xl outline-none shadow-sm font-medium focus:border-indigo-500 transition-all">
                </div>
                <button id="btn-main-action" class="bg-indigo-600 text-white px-6 py-4 rounded-2xl font-black shadow-lg shadow-indigo-100 hover:scale-105 transition-all">
                    + Input Data
                </button>
            </div>
        </header>

        <section id="page-dashboard" class="page-section grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></section>

        <section id="page-obat" class="page-section hidden">
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-50">
                            <th class="p-6 px-10">Informasi Obat</th>
                            <th class="p-6 text-center">Batch Stok</th>
                            <th class="p-6 text-center">Sisa</th>
                            <th class="p-6 text-right px-10">Opsi</th>
                        </tr>
                    </thead>
                    <tbody id="list-obat"></tbody>
                </table>
            </div>
        </section>

        <section id="page-pasien" class="page-section hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>

        <section id="page-penggunaan" class="page-section hidden">
            <div class="mb-6 flex gap-4">
                <input type="date" id="filter-date" onchange="renderCurrentPage()" class="bg-white p-4 rounded-xl border border-slate-100 font-bold text-slate-500 outline-none">
            </div>
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                <table class="w-full text-left">
                    <tbody id="list-penggunaan"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="global-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] w-full max-w-lg p-10 shadow-2xl relative">
            <h3 id="modal-title" class="text-2xl font-black text-slate-800 mb-2">Input Data</h3>
            <p id="modal-desc" class="text-slate-400 font-medium mb-8 text-sm italic">Silakan lengkapi formulir di bawah ini.</p>
            
            <form id="global-form" class="space-y-4">
                <input type="hidden" id="entry-id">
                <div id="modal-fields" class="space-y-4"></div>
                
                <div class="flex gap-4 pt-8 border-t border-slate-50 mt-8">
                    <button type="button" onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 hover:text-slate-600 transition-all">Batal</button>
                    <button type="submit" class="flex-[2] py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        // --- 1. KONFIGURASI FIREBASE ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            // MASUKKAN CONFIG ANDA DI SINI
            apiKey: "AIza...",
            authDomain: "mmhc-...",
            projectId: "mmhc-...",
            storageBucket: "mmhc-...",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 2. STATE DATA ---
        let DATA_OBAT = [], DATA_PASIEN = [], DATA_TRANSAKSI = [];
        let CURRENT_PAGE = 'dashboard';

        // --- 3. LISTENER DATABASE (REALTIME) ---
        onSnapshot(collection(db, "obat"), (s) => { DATA_OBAT = s.docs.map(d => ({id:d.id, ...d.data()})); renderCurrentPage(); });
        onSnapshot(collection(db, "pasien"), (s) => { DATA_PASIEN = s.docs.map(d => ({id:d.id, ...d.data()})); renderCurrentPage(); });
        onSnapshot(query(collection(db, "transaksi"), orderBy("tanggal", "desc")), (s) => { DATA_TRANSAKSI = s.docs.map(d => ({id:d.id, ...d.data()})); renderCurrentPage(); });

        // --- 4. FUNGSI NAVIGASI ---
        window.showPage = (page) => {
            CURRENT_PAGE = page;
            document.querySelectorAll('.page-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('page-' + page).classList.remove('hidden');
            
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('nav-active'));
            document.getElementById('nav-' + page).classList.add('nav-active');

            const btn = document.getElementById('btn-main-action');
            if(page === 'penggunaan') {
                btn.innerHTML = '<i class="fas fa-file-excel mr-2"></i> Rekap CSV';
                btn.onclick = downloadRekap;
            } else {
                btn.innerHTML = '+ Input ' + page.charAt(0).toUpperCase() + page.slice(1);
                btn.onclick = () => prepareModal(page);
            }
            
            document.getElementById('header-title').innerText = page === 'penggunaan' ? 'Log Aktivitas' : page === 'obat' ? 'Inventori Obat' : page.charAt(0).toUpperCase() + page.slice(1);
            renderCurrentPage();
        };

        // --- 5. RENDERER PER HALAMAN ---
        window.renderCurrentPage = () => {
            const search = document.getElementById('global-search').value.toLowerCase();

            if (CURRENT_PAGE === 'dashboard') {
                const grid = document.getElementById('page-dashboard');
                grid.innerHTML = `
                    ${renderStatCard('Total Pasien', DATA_PASIEN.length, 'fa-users', 'indigo')}
                    ${renderStatCard('Jenis Obat', DATA_OBAT.length, 'fa-pills', 'blue')}
                    ${renderStatCard('Log Hari Ini', DATA_TRANSAKSI.filter(t => t.tanggal === getToday()).length, 'fa-history', 'emerald')}
                    ${renderStatCard('Stok Kritis', DATA_OBAT.filter(o => getSisa(o) < 10).length, 'fa-exclamation-triangle', 'orange')}
                `;
            }

            if (CURRENT_PAGE === 'obat') {
                const container = document.getElementById('list-obat');
                container.innerHTML = "";
                const filtered = DATA_OBAT.filter(o => o.nama.toLowerCase().includes(search));
                const grouped = filtered.reduce((acc, o) => {
                    const match = o.nama.match(/\(([^)]+)\)/);
                    const folder = match ? match[1] : "Stok Umum";
                    if (!acc[folder]) acc[folder] = [];
                    acc[folder].push(o);
                    return acc;
                }, {});

                for (const [folder, items] of Object.entries(grouped)) {
                    container.innerHTML += `<tr class="bg-indigo-50/30"><td colspan="4" class="p-4 px-10 border-y border-indigo-50 font-black text-indigo-600 text-[10px] uppercase tracking-widest"><i class="fas fa-folder-open mr-2"></i> Pasien: ${folder}</td></tr>`;
                    items.forEach(o => {
                        const sisa = getSisa(o);
                        container.innerHTML += `
                        <tr class="hover:bg-slate-50 border-b border-slate-50 transition-all group">
                            <td class="p-6 px-12">
                                <p class="font-bold text-slate-800">${o.nama.split('(')[0].trim()}</p>
                                <p class="text-[10px] text-slate-400 font-bold">EXP: ${o.exp}</p>
                            </td>
                            <td class="p-6 text-center font-bold text-slate-400">${o.stokAwal}</td>
                            <td class="p-6 text-center">
                                <span class="px-4 py-1.5 rounded-xl font-black ${sisa < 10 ? 'bg-red-100 text-red-600' : 'bg-indigo-100 text-indigo-600'}">${sisa}</span>
                            </td>
                            <td class="p-6 text-right px-10 space-x-2">
                                <button onclick="prepareModal('obat', '${o.id}')" class="text-blue-500 p-2"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteData('obat', '${o.id}')" class="text-slate-200 hover:text-red-500 p-2"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>`;
                    });
                }
            }

            if (CURRENT_PAGE === 'pasien') {
                const container = document.getElementById('page-pasien');
                container.innerHTML = DATA_PASIEN.filter(p => p.nama.toLowerCase().includes(search)).map(p => `
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm relative group">
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-300"><i class="fas fa-id-badge"></i></div>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                <button onclick="prepareModal('pasien', '${p.id}')" class="text-blue-500"><i class="fas fa-pen"></i></button>
                                <button onclick="deleteData('pasien', '${p.id}')" class="text-red-300 hover:text-red-500"><i class="fas fa-times"></i></button>
                            </div>
                        </div>
                        <h4 class="text-xl font-black text-slate-800">${p.nama}</h4>
                        <p class="text-indigo-500 font-bold text-xs uppercase">${p.umur} Thn • ${p.jk || 'N/A'}</p>
                    </div>
                `).join('');
            }

            if (CURRENT_PAGE === 'penggunaan') {
                const dateFilter = document.getElementById('filter-date').value;
                const container = document.getElementById('list-penggunaan');
                container.innerHTML = DATA_TRANSAKSI.filter(t => {
                    const matchDate = dateFilter ? t.tanggal === dateFilter : true;
                    const p = DATA_PASIEN.find(x => x.id === t.pasienId)?.nama.toLowerCase() || "";
                    const o = DATA_OBAT.find(x => x.id === t.obatId)?.nama.toLowerCase() || "";
                    return matchDate && (p.includes(search) || o.includes(search));
                }).map(t => {
                    const p = DATA_PASIEN.find(x => x.id === t.pasienId)?.nama || 'N/A';
                    const o = DATA_OBAT.find(x => x.id === t.obatId)?.nama || 'N/A';
                    return `
                    <tr class="hover:bg-slate-50 border-b border-slate-50 transition-all">
                        <td class="p-6 px-10">
                            <p class="font-black text-slate-800">${p}</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase">${o} • ${t.tanggal}</p>
                        </td>
                        <td class="p-6 text-center text-slate-500 font-bold">${t.pagi}/${t.siang}/${t.malam}</td>
                        <td class="p-6 text-center"><span class="bg-slate-900 text-white px-4 py-1 rounded-xl text-xs font-black">${t.total}</span></td>
                        <td class="p-6 text-right px-10 space-x-3">
                            <button onclick="prepareModal('penggunaan', '${t.id}')" class="text-blue-500"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteData('transaksi', '${t.id}')" class="text-slate-200 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>`;
                }).join('');
            }
        };

        // --- 6. SISTEM MODAL (ADD & EDIT) ---
        window.prepareModal = (type, id = null) => {
            const form = document.getElementById('global-form');
            const fields = document.getElementById('modal-fields');
            form.reset();
            document.getElementById('entry-id').value = id || '';
            form.dataset.context = type;

            if (type === 'obat') {
                fields.innerHTML = `
                    <input type="text" name="nama" placeholder="Nama Obat (Nama Pasien)" class="modal-input" required>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" name="stokAwal" placeholder="Stok Awal" class="modal-input" required>
                        <input type="text" name="satuan" placeholder="Satuan (Tablet/Botol)" class="modal-input" required>
                    </div>
                    <input type="date" name="exp" class="modal-input" required>`;
            } else if (type === 'pasien') {
                fields.innerHTML = `
                    <input type="text" name="nama" placeholder="Nama Lengkap" class="modal-input" required>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" name="umur" placeholder="Umur" class="modal-input" required>
                        <select name="jk" class="modal-input"><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select>
                    </div>`;
            } else if (type === 'penggunaan') {
                fields.innerHTML = `
                    <select name="pasienId" class="modal-input">${DATA_PASIEN.map(p => `<option value="${p.id}">${p.nama}</option>`)}</select>
                    <select name="obatId" class="modal-input">${DATA_OBAT.map(o => `<option value="${o.id}">${o.nama}</option>`)}</select>
                    <div class="grid grid-cols-3 gap-2 bg-slate-50 p-4 rounded-2xl">
                        <input type="number" name="pagi" placeholder="Pagi" class="modal-input text-center">
                        <input type="number" name="siang" placeholder="Siang" class="modal-input text-center">
                        <input type="number" name="malam" placeholder="Malam" class="modal-input text-center">
                    </div>`;
            }

            if(id) {
                const coll = type === 'penggunaan' ? 'transaksi' : type;
                const d = (coll === 'obat' ? DATA_OBAT : coll === 'pasien' ? DATA_PASIEN : DATA_TRANSAKSI).find(x => x.id === id);
                Array.from(form.elements).forEach(el => { if(d[el.name] !== undefined) el.value = d[el.name]; });
                document.getElementById('modal-title').innerText = "Edit " + type;
            } else {
                document.getElementById('modal-title').innerText = "Tambah " + type;
            }

            document.getElementById('global-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('global-modal').classList.add('hidden');

        document.getElementById('global-form').onsubmit = async (e) => {
            e.preventDefault();
            const type = e.target.dataset.context;
            const id = document.getElementById('entry-id').value;
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            // Logika Khusus Transaksi
            if(type === 'penggunaan') {
                data.total = (parseInt(data.pagi)||0) + (parseInt(data.siang)||0) + (parseInt(data.malam)||0);
                data.tanggal = id ? DATA_TRANSAKSI.find(x => x.id === id).tanggal : getToday();
            }

            const collectionName = type === 'penggunaan' ? 'transaksi' : type;
            if(id) await updateDoc(doc(db, collectionName, id), data);
            else await addDoc(collection(db, collectionName), data);
            
            closeModal();
        };

        window.deleteData = async (coll, id) => {
            if(confirm('Hapus data ini?')) await deleteDoc(doc(db, coll, id));
        };

        // --- 7. HELPER FUNCTIONS ---
        function getSisa(o) {
            const used = DATA_TRANSAKSI.filter(t => t.obatId === o.id).reduce((a, b) => a + (parseInt(b.total) || 0), 0);
            return (parseInt(o.stokAwal) || 0) - used;
        }

        function getToday() { return new Date().toISOString().split('T')[0]; }

        function renderStatCard(t, v, i, c) {
            return `<div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
                <div class="w-12 h-12 bg-${c}-50 text-${c}-600 rounded-2xl flex items-center justify-center mb-6"><i class="fas ${i}"></i></div>
                <p class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-1">${t}</p>
                <h3 class="text-3xl font-black text-slate-800">${v}</h3>
            </div>`;
        }

        window.downloadRekap = () => {
            let csv = "Tanggal,Pasien,Obat,Pagi,Siang,Malam,Total\n";
            DATA_TRANSAKSI.forEach(t => {
                const p = DATA_PASIEN.find(x => x.id === t.pasienId)?.nama || 'N/A';
                const o = DATA_OBAT.find(x => x.id === t.obatId)?.nama || 'N/A';
                csv += `${t.tanggal},${p},${o},${t.pagi},${t.siang},${t.malam},${t.total}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `Rekap_MMHC_${getToday()}.csv`; a.click();
        };

        // Inisialisasi awal
        showPage('dashboard');
        document.getElementById('header-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    </script>
</body>
</html>
