<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMRC - Madani Mental Rehabilitation Centre</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-mmrc-cream text-slate-800 antialiased">

    <div id="auth-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-mmrc-maroon p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm animate-fade-up text-center">
            <img src="logo-mmrc.png" alt="MMRC Logo" class="h-20 mx-auto mb-6">
            <h2 class="font-bold text-xl text-mmrc-maroon mb-1">SISTEM OPERASIONAL</h2>
            <p class="text-xs text-slate-400 mb-6">Silakan login untuk melanjutkan</p>
            <div class="space-y-4">
                <input id="login-user" type="text" placeholder="Username ID" class="input-field text-center font-bold" autocomplete="off">
                <input id="login-pass" type="password" placeholder="Password" class="input-field text-center font-bold">
                <button onclick="app.login()" class="w-full btn-maroon py-4 rounded-xl font-bold shadow-lg transition-all active:scale-95">
                    LOGIN MASUK
                </button>
            </div>
        </div>
    </div>

    <div id="app-layer" class="hidden flex h-screen overflow-hidden relative">
        
        <aside class="w-64 bg-white border-r border-mmrc-cream-dark flex-col hidden md:flex z-20 shadow-sm">
            <div class="p-6 border-b border-mmrc-cream-dark flex justify-center">
                <img src="logo-mmrc.png" alt="MMRC Logo" class="h-12">
            </div>
            
            <nav class="flex-1 overflow-y-auto p-4 space-y-1">
                <p class="nav-section-title">Main Menu</p>
                <button onclick="app.nav('dashboard')" id="btn-dashboard" class="nav-btn active"><i class="fas fa-home w-6"></i> Dashboard</button>
                <button onclick="app.nav('medicine')" id="btn-medicine" class="nav-btn"><i class="fas fa-pills w-6"></i> Medicine</button>
                <button onclick="app.nav('ttv')" id="btn-ttv" class="nav-btn"><i class="fas fa-heart-pulse w-6"></i> TTV & GDS</button>
                
                <p class="nav-section-title mt-6">Monitoring</p>
                <button onclick="app.nav('visit')" id="btn-visit" class="nav-btn"><i class="fas fa-user-md w-6"></i> Visit Dokter</button>
                <button onclick="app.nav('crisis')" id="btn-crisis" class="nav-btn"><i class="fas fa-chart-line w-6"></i> Crisis Score</button>
                
                <p class="nav-section-title mt-6">Rehab</p>
                <button onclick="app.nav('program')" id="btn-program" class="nav-btn"><i class="fas fa-clipboard-list w-6"></i> Program</button>
                <button onclick="app.nav('therapy')" id="btn-therapy" class="nav-btn"><i class="fas fa-brain w-6"></i> Therapy Log</button>
            </nav>

            <div class="p-4 border-t border-mmrc-cream-dark">
                <button onclick="location.reload()" class="w-full bg-red-50 text-red-700 py-3 rounded-xl text-xs font-bold hover:bg-red-100 transition flex items-center justify-center gap-2">
                    <i class="fas fa-power-off"></i> LOGOUT
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative">
            <header class="h-16 bg-white border-b border-mmrc-cream-dark flex items-center justify-between px-6 sticky top-0 z-10 shadow-sm">
                <div class="flex items-center gap-4">
                    <button class="md:hidden text-mmrc-maroon text-xl" onclick="document.querySelector('aside').classList.toggle('hidden'); document.querySelector('aside').classList.toggle('absolute'); document.querySelector('aside').classList.toggle('h-full');">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 id="page-title" class="font-bold text-xl text-mmrc-maroon">DASHBOARD</h2>
                </div>

                <div class="flex items-center gap-3">
                    <div class="hidden md:flex items-center bg-mmrc-cream rounded-full px-4 py-2 border border-transparent focus-within:border-mmrc-maroon focus-within:bg-white transition-all w-64">
                        <i class="fas fa-search text-slate-400 text-xs"></i>
                        <input id="global-search" onkeyup="app.search()" type="text" placeholder="Cari Pasien..." class="bg-transparent border-none outline-none text-xs font-bold text-slate-700 ml-2 w-full placeholder:text-slate-400">
                    </div>
                    <button onclick="app.exportToWord()" class="bg-mmrc-grey hover:bg-slate-600 text-white w-9 h-9 rounded-full flex items-center justify-center shadow transition hover:scale-105" title="Download Word">
                        <i class="fas fa-file-word"></i>
                    </button>
                    <button onclick="app.exportAllExcel()" class="bg-mmrc-maroon hover:bg-red-900 text-white w-9 h-9 rounded-full flex items-center justify-center shadow transition hover:scale-105" title="Download Excel">
                        <i class="fas fa-file-excel"></i>
                    </button>
                </div>
            </header>

            <div id="main-content" class="flex-1 p-6 overflow-y-auto pb-20">
                </div>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl flex flex-col animate-modal-pop overflow-hidden">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-mmrc-cream">
                <h3 id="modal-title" class="font-bold text-lg text-mmrc-maroon">FORM INPUT</h3>
                <button onclick="app.closeModal()" class="w-8 h-8 rounded-full bg-white text-slate-400 hover:text-mmrc-maroon hover:bg-red-50 flex items-center justify-center transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
