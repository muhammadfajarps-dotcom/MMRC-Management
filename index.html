<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMHC PRO V3 - Integrated Clinical System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .glass-header { background: rgba(79, 70, 229, 0.9); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        input[type="checkbox"] { width: 1.2rem; height: 1.2rem; accent-color: #4f46e5; }
    </style>
</head>
<body class="text-slate-900 min-h-screen">

    <div id="login-page" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-10 text-center">
            <h1 class="text-3xl font-black text-indigo-600 mb-6 italic">MMHC PRO <span class="text-slate-800">V3</span></h1>
            <form id="login-form" class="space-y-4">
                <input type="text" id="user-input" placeholder="ID Admin" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border-2 border-transparent focus:border-indigo-500 font-bold" required>
                <input type="password" id="pass-input" placeholder="Passcode" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border-2 border-transparent focus:border-indigo-500 font-bold" required>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">Masuk Sistem</button>
            </form>
        </div>
    </div>

    <div id="main-content" class="hidden flex flex-col min-h-screen">
        <header class="glass-header text-white p-6 sticky top-0 z-40 flex justify-between items-center shadow-xl">
            <div class="flex items-center gap-3">
                <i class="fas fa-notes-medical text-2xl"></i>
                <h1 class="text-xl font-black tracking-tighter">MMHC INTEGRATED</h1>
            </div>
            <button onclick="location.reload()" class="bg-white/20 px-4 py-2 rounded-xl text-xs font-bold hover:bg-white/40">Logout</button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
            <div id="view-list" class="space-y-6">
                <div class="flex flex-col md:flex-row gap-4 justify-between">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="text" id="search-pasien" oninput="renderPasien()" placeholder="Cari nama atau diagnosa..." class="w-full bg-white p-5 pl-14 rounded-3xl shadow-sm outline-none border-2 border-transparent focus:border-indigo-500 font-bold">
                    </div>
                    <button onclick="openModalPasien()" class="bg-indigo-600 text-white px-8 py-5 rounded-3xl font-black shadow-lg">+ Registrasi Pasien</button>
                </div>
                <div id="list-pasien" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div id="view-detail" class="hidden space-y-6">
                <button onclick="closeDetail()" class="text-indigo-600 font-bold flex items-center gap-2 mb-4"><i class="fas fa-arrow-left"></i> Kembali</button>
                
                <div id="patient-identity-card" class="bg-white rounded-[3rem] p-8 card-shadow border border-slate-100 grid grid-cols-1 lg:grid-cols-2 gap-8"></div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white rounded-3xl p-6 card-shadow border border-slate-100 lg:col-span-1 space-y-6">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="font-black text-slate-800 text-xs uppercase tracking-widest"><i class="fas fa-heartbeat text-red-500 mr-2"></i> Monitor TTV</h3>
                                <button onclick="openModalTTV()" class="bg-red-50 text-red-600 p-2 rounded-lg text-xs font-bold">+ Input</button>
                            </div>
                            <div id="ttv-history" class="space-y-3 max-h-[300px] overflow-y-auto"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 card-shadow border border-slate-100 lg:col-span-2 space-y-6">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-slate-800 text-xs uppercase tracking-widest"><i class="fas fa-pills text-indigo-500 mr-2"></i> Inventory & Terapi Harian</h3>
                            <button onclick="openModalObat()" class="bg-indigo-50 text-indigo-600 p-2 rounded-lg text-xs font-bold">+ Stok Obat</button>
                        </div>
                        <div id="obat-inventory" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-pasien" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-4xl p-8 max-h-[90vh] overflow-y-auto shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Formulir Rekam Medis Terintegrasi</h3>
            <form id="form-pasien" class="space-y-6">
                <input type="hidden" id="p-id">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-4">
                        <label class="block text-[10px] font-black text-slate-400 uppercase">1. Profil Personal</label>
                        <input type="text" id="p-nama" placeholder="Nama Lengkap" class="w-full bg-slate-50 p-4 rounded-xl font-bold border-2 border-transparent focus:border-indigo-500 outline-none" required>
                        <div class="flex gap-2">
                            <input type="number" id="p-umur" placeholder="Usia" class="w-1/2 bg-slate-50 p-4 rounded-xl font-bold outline-none">
                            <select id="p-jk" class="w-1/2 bg-slate-50 p-4 rounded-xl font-bold outline-none">
                                <option>Laki-laki</option><option>Perempuan</option>
                            </select>
                        </div>
                        <input type="date" id="p-tgl-masuk" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                        <input type="time" id="p-jam-masuk" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    </div>

                    <div class="space-y-4">
                        <label class="block text-[10px] font-black text-slate-400 uppercase">2. Klinis Awal</label>
                        <textarea id="p-riwayat" placeholder="Riwayat Penyakit (Dahulu/Sekarang)" class="w-full bg-slate-50 p-4 rounded-xl font-medium h-24 outline-none border-2 border-transparent focus:border-indigo-500"></textarea>
                        <textarea id="p-diagnosa" placeholder="Diagnosa Dokter..." class="w-full bg-indigo-50 p-4 rounded-xl font-bold h-24 outline-none border-2 border-indigo-100 focus:border-indigo-500"></textarea>
                    </div>

                    <div class="space-y-4">
                        <label class="block text-[10px] font-black text-slate-400 uppercase">3. Intervensi & Bukti</label>
                        <div class="bg-slate-50 p-4 rounded-xl space-y-2">
                            <div class="flex items-center gap-2 text-xs font-bold">
                                <input type="checkbox" id="i-fiksasi"> Fiksasi Pasien
                            </div>
                            <div class="border-t pt-2">
                                <p class="text-[9px] font-black text-slate-400 mb-1 uppercase">Injeksi (Waktu & Ket)</p>
                                <input type="text" id="i-injeksi" placeholder="Contoh: 20/01/24 08:00 - Diazepam" class="w-full bg-white p-2 text-xs rounded border outline-none">
                            </div>
                            <div class="border-t pt-2">
                                <p class="text-[9px] font-black text-slate-400 mb-1 uppercase">Urine Test (Hasil)</p>
                                <input type="text" id="i-urine" placeholder="Hasil test urine..." class="w-full bg-white p-2 text-xs rounded border outline-none">
                            </div>
                        </div>
                        <input type="file" id="p-foto" accept="image/*" class="w-full text-[10px] file:bg-indigo-600 file:text-white file:border-0 file:rounded-lg file:px-3 file:py-2">
                        <input type="hidden" id="p-foto-base64">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">4. Rekomendasi Dokter</label>
                        <textarea id="p-rekomendasi" placeholder="Instruksi perawatan khusus..." class="w-full bg-slate-50 p-4 rounded-xl font-medium h-20 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">5. Resep Obat (Text)</label>
                        <textarea id="p-resep" placeholder="Daftar resep dari dokter..." class="w-full bg-slate-50 p-4 rounded-xl font-medium h-20 outline-none"></textarea>
                    </div>
                </div>

                <div class="flex gap-4 pt-6">
                    <button type="button" onclick="closeModals()" class="flex-1 font-bold text-slate-400">Tutup</button>
                    <button type="submit" class="flex-[3] bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl">SIMPAN REKAM MEDIS</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-obat" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6 italic">Manajemen Stok Obat Pasien</h3>
            <form id="form-obat" class="space-y-4">
                <input type="hidden" id="o-id">
                <input type="text" id="o-nama" placeholder="Nama Obat" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="o-tgl-beri" title="Tanggal Mulai Pakai" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="number" id="o-stok" placeholder="Jumlah Stok Awal" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none" required>
                </div>
                <div class="bg-indigo-50 p-5 rounded-2xl">
                    <label class="text-[10px] font-black text-indigo-400 uppercase block mb-3 text-center">Jadwal Minum Harian (Otomatis Kurangi Stok)</label>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="text-center">
                            <p class="text-[9px] font-bold mb-1">Pagi</p>
                            <input type="number" id="o-pagi" value="0" class="w-full p-3 rounded-xl text-center font-bold">
                        </div>
                        <div class="text-center">
                            <p class="text-[9px] font-bold mb-1">Siang</p>
                            <input type="number" id="o-siang" value="0" class="w-full p-3 rounded-xl text-center font-bold">
                        </div>
                        <div class="text-center">
                            <p class="text-[9px] font-bold mb-1">Malam</p>
                            <input type="number" id="o-malam" value="0" class="w-full p-3 rounded-xl text-center font-bold">
                        </div>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black shadow-lg">Update Persediaan</button>
            </form>
        </div>
    </div>

    <div id="modal-ttv" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6">Input Vital Sign</h3>
            <form id="form-ttv" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="v-td" placeholder="TD (120/80)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="number" id="v-nadi" placeholder="Nadi (bpm)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="text" id="v-suhu" placeholder="Suhu (°C)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="number" id="v-rr" placeholder="RR (x/mnt)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                </div>
                <input type="date" id="v-tgl" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                <button type="submit" class="w-full bg-red-500 text-white py-4 rounded-xl font-black">Simpan Hasil</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdzWrKOBqrcu6talld7MN-2flHNibEWnE",
            authDomain: "mmrc-stock.firebaseapp.com",
            projectId: "mmrc-stock",
            storageBucket: "mmrc-stock.firebasestorage.app",
            messagingSenderId: "722563453659",
            appId: "1:722563453659:web:b9f867367ecadb7a1df2fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let PASIEN = [], OBAT = [], TTV = [], SELECTED_ID = null;

        // AUTH & SYNC
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            if(document.getElementById('user-input').value === "MMRC.Stock1999" && document.getElementById('pass-input').value === "Madani1999") {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                startSync();
            }
        };

        function startSync() {
            onSnapshot(collection(db, "pasien_v3"), s => { PASIEN = s.docs.map(d => ({id:d.id, ...d.data()})); renderPasien(); if(SELECTED_ID) updateDetailUI(); });
            onSnapshot(collection(db, "obat_v3"), s => { OBAT = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) updateDetailUI(); });
            onSnapshot(collection(db, "ttv_v3"), s => { TTV = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) updateDetailUI(); });
        }

        // FOTO
        document.getElementById('p-foto').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = () => document.getElementById('p-foto-base64').value = reader.result;
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        };

        // PASIEN OPERATIONS
        window.openModalPasien = (id = null) => {
            const f = document.getElementById('form-pasien'); f.reset();
            document.getElementById('p-id').value = id || '';
            if(id) {
                const p = PASIEN.find(x => x.id === id);
                document.getElementById('p-nama').value = p.nama;
                document.getElementById('p-umur').value = p.umur;
                document.getElementById('p-jk').value = p.jk;
                document.getElementById('p-tgl-masuk').value = p.tglMasuk;
                document.getElementById('p-jam-masuk').value = p.jamMasuk;
                document.getElementById('p-riwayat').value = p.riwayat;
                document.getElementById('p-diagnosa').value = p.diagnosa || '';
                document.getElementById('p-rekomendasi').value = p.rekomendasi || '';
                document.getElementById('p-resep').value = p.resep || '';
                document.getElementById('i-fiksasi').checked = p.intervensi?.fiksasi || false;
                document.getElementById('i-injeksi').value = p.intervensi?.injeksi || '';
                document.getElementById('i-urine').value = p.intervensi?.urine || '';
            }
            document.getElementById('modal-pasien').classList.remove('hidden');
        };

        document.getElementById('form-pasien').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = {
                nama: document.getElementById('p-nama').value,
                umur: document.getElementById('p-umur').value,
                jk: document.getElementById('p-jk').value,
                tglMasuk: document.getElementById('p-tgl-masuk').value,
                jamMasuk: document.getElementById('p-jam-masuk').value,
                riwayat: document.getElementById('p-riwayat').value,
                diagnosa: document.getElementById('p-diagnosa').value,
                rekomendasi: document.getElementById('p-rekomendasi').value,
                resep: document.getElementById('p-resep').value,
                intervensi: {
                    fiksasi: document.getElementById('i-fiksasi').checked,
                    injeksi: document.getElementById('i-injeksi').value,
                    urine: document.getElementById('i-urine').value
                },
                foto: document.getElementById('p-foto-base64').value || (id ? PASIEN.find(x => x.id === id).foto : '')
            };
            id ? await updateDoc(doc(db, "pasien_v3", id), data) : await addDoc(collection(db, "pasien_v3"), data);
            closeModals();
        };

        window.renderPasien = () => {
            const s = document.getElementById('search-pasien').value.toLowerCase();
            document.getElementById('list-pasien').innerHTML = PASIEN.filter(p => p.nama.toLowerCase().includes(s) || (p.diagnosa && p.diagnosa.toLowerCase().includes(s))).map(p => `
                <div onclick="openDetail('${p.id}')" class="bg-white p-6 rounded-[2.5rem] card-shadow border border-slate-50 cursor-pointer hover:border-indigo-300 transition-all group">
                    <div class="flex gap-4 items-center">
                        <div class="w-16 h-16 rounded-2xl bg-slate-100 overflow-hidden flex-shrink-0">
                            ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover">` : `<i class="fas fa-user-circle text-slate-300 text-4xl m-3"></i>`}
                        </div>
                        <div>
                            <h4 class="font-black text-slate-800">${p.nama}</h4>
                            <p class="text-[10px] font-bold text-indigo-500 uppercase">${p.diagnosa || 'BELUM ADA DIAGNOSA'}</p>
                        </div>
                    </div>
                    <div class="mt-4 flex justify-between">
                        <button onclick="event.stopPropagation(); openModalPasien('${p.id}')" class="text-[9px] font-black bg-slate-100 px-3 py-1 rounded-lg">EDIT DATA</button>
                        <button onclick="event.stopPropagation(); deleteData('pasien_v3', '${p.id}')" class="text-[9px] font-black text-red-300 hover:text-red-500 uppercase">Hapus</button>
                    </div>
                </div>
            `).join('');
        };

        // UI DETAIL
        window.openDetail = (id) => { SELECTED_ID = id; document.getElementById('view-list').classList.add('hidden'); document.getElementById('view-detail').classList.remove('hidden'); updateDetailUI(); };
        window.closeDetail = () => { SELECTED_ID = null; document.getElementById('view-list').classList.remove('hidden'); document.getElementById('view-detail').classList.add('hidden'); };

        function updateDetailUI() {
            const p = PASIEN.find(x => x.id === SELECTED_ID);
            if(!p) return;

            document.getElementById('patient-identity-card').innerHTML = `
                <div class="space-y-4">
                    <div class="flex gap-4">
                        <div class="w-24 h-24 rounded-3xl bg-slate-100 overflow-hidden shadow-inner flex-shrink-0">
                            ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover">` : `<i class="fas fa-user text-slate-300 text-5xl p-6"></i>`}
                        </div>
                        <div>
                            <h2 class="text-3xl font-black text-indigo-600">${p.nama}</h2>
                            <p class="text-xs font-black text-slate-400 uppercase">${p.jk} • ${p.umur} TAHUN</p>
                            <div class="mt-2 flex gap-2">
                                ${p.intervensi?.fiksasi ? '<span class="bg-red-500 text-white text-[8px] px-2 py-1 rounded-full font-black">FIKSASI</span>' : ''}
                                ${p.intervensi?.urine ? '<span class="bg-blue-500 text-white text-[8px] px-2 py-1 rounded-full font-black">URINE TESTED</span>' : ''}
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-4 rounded-2xl">
                            <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Riwayat</p>
                            <p class="text-xs font-bold text-slate-600">${p.riwayat || '-'}</p>
                        </div>
                        <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
                            <p class="text-[9px] font-black text-indigo-400 uppercase mb-1">Diagnosa Utama</p>
                            <p class="text-xs font-black text-indigo-700 uppercase">${p.diagnosa || '-'}</p>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-900 text-white p-6 rounded-[2.5rem] space-y-4">
                    <div>
                        <p class="text-[9px] font-black text-indigo-300 uppercase tracking-widest mb-2">Instruksi & Rekomendasi Dokter</p>
                        <p class="text-xs font-medium leading-relaxed italic text-slate-300">"${p.rekomendasi || 'Tidak ada instruksi khusus.'}"</p>
                    </div>
                    <div class="pt-4 border-t border-white/10">
                        <p class="text-[9px] font-black text-indigo-300 uppercase mb-2">Resep Dokter</p>
                        <p class="text-xs font-bold">${p.resep || '-'}</p>
                    </div>
                </div>
            `;

            const ttvP = TTV.filter(t => t.pasienId === SELECTED_ID).sort((a,b) => new Date(b.tgl) - new Date(a.tgl));
            document.getElementById('ttv-history').innerHTML = ttvP.map(t => `
                <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center group">
                    <div>
                        <p class="text-xs font-black text-slate-700">${t.td} <span class="text-[10px] text-slate-400 font-medium">mmHg</span></p>
                        <p class="text-[9px] font-bold text-slate-400">${t.tgl} • ${t.suhu}°C • ${t.nadi}bpm</p>
                    </div>
                    <button onclick="deleteData('ttv_v3', '${t.id}')" class="opacity-0 group-hover:opacity-100 text-red-200 hover:text-red-500 transition-all"><i class="fas fa-trash"></i></button>
                </div>
            `).join('') || '<p class="text-center text-[10px] text-slate-300 py-10">Belum ada TTV</p>';

            const obatP = OBAT.filter(o => o.pasienId === SELECTED_ID);
            document.getElementById('obat-inventory').innerHTML = obatP.map(o => {
                const sisa = calculateStock(o);
                return `
                <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100">
                    <div class="flex justify-between items-start mb-4">
                        <h4 class="font-black text-slate-800">${o.nama} <span class="text-[10px] text-indigo-500 ml-2 font-normal">(Mulai: ${o.tglBeri})</span></h4>
                        <div class="flex gap-2">
                             <button onclick="openModalObat('${o.id}')" class="text-blue-500 text-[10px] font-black px-2 py-1 bg-blue-50 rounded-lg">EDIT STOK</button>
                             <button onclick="deleteData('obat_v3', '${o.id}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-3 rounded-xl shadow-sm text-center">
                            <p class="text-[8px] font-black text-slate-300 uppercase">Awal</p>
                            <p class="font-black text-slate-700">${o.stok}</p>
                        </div>
                        <div class="${sisa < 5 ? 'bg-red-500' : 'bg-indigo-600'} p-3 rounded-xl shadow-md text-center text-white">
                            <p class="text-[8px] font-black opacity-60 uppercase">Sisa Stok</p>
                            <p class="font-black text-xl">${sisa}</p>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow-sm col-span-2 flex items-center justify-around">
                            <div class="text-center"><p class="text-[8px] font-black text-slate-300 uppercase">P</p><p class="font-bold text-indigo-500">${o.pagi}</p></div>
                            <div class="text-center"><p class="text-[8px] font-black text-slate-300 uppercase">S</p><p class="font-bold text-indigo-500">${o.siang}</p></div>
                            <div class="text-center"><p class="text-[8px] font-black text-slate-300 uppercase">M</p><p class="font-bold text-indigo-500">${o.malam}</p></div>
                            <div class="border-l pl-3 text-center">
                                <p class="text-[8px] font-black text-slate-300 uppercase">Total/Hari</p>
                                <p class="font-black text-slate-700">${parseInt(o.pagi)+parseInt(o.siang)+parseInt(o.malam)}</p>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('') || '<p class="text-center text-[10px] text-slate-300 py-10">Belum ada planning obat</p>';
        }

        // HELPERS
        function calculateStock(o) {
            const start = new Date(o.tglBeri);
            const now = new Date();
            const diffTime = Math.max(0, now - start);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const consumed = diffDays * (parseInt(o.pagi) + parseInt(o.siang) + parseInt(o.malam));
            return Math.max(0, o.stok - consumed);
        }

        window.openModalTTV = () => { document.getElementById('form-ttv').reset(); document.getElementById('v-tgl').value = new Date().toISOString().split('T')[0]; document.getElementById('modal-ttv').classList.remove('hidden'); };
        document.getElementById('form-ttv').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "ttv_v3"), {
                pasienId: SELECTED_ID, td: document.getElementById('v-td').value, nadi: document.getElementById('v-nadi').value,
                suhu: document.getElementById('v-suhu').value, rr: document.getElementById('v-rr').value, tgl: document.getElementById('v-tgl').value
            });
            closeModals();
        };

        window.openModalObat = (id = null) => {
            const f = document.getElementById('form-obat'); f.reset();
            document.getElementById('o-id').value = id || '';
            if(id) {
                const o = OBAT.find(x => x.id === id);
                document.getElementById('o-nama').value = o.nama;
                document.getElementById('o-stok').value = o.stok;
                document.getElementById('o-tgl-beri').value = o.tglBeri;
                document.getElementById('o-pagi').value = o.pagi;
                document.getElementById('o-siang').value = o.siang;
                document.getElementById('o-malam').value = o.malam;
            }
            document.getElementById('modal-obat').classList.remove('hidden');
        };

        document.getElementById('form-obat').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('o-id').value;
            const data = {
                pasienId: SELECTED_ID, nama: document.getElementById('o-nama').value, stok: parseInt(document.getElementById('o-stok').value),
                tglBeri: document.getElementById('o-tgl-beri').value,
                pagi: document.getElementById('o-pagi').value || 0, siang: document.getElementById('o-siang').value || 0, malam: document.getElementById('o-malam').value || 0
            };
            id ? await updateDoc(doc(db, "obat_v3", id), data) : await addDoc(collection(db, "obat_v3"), data);
            closeModals();
        };

        window.deleteData = async (col, id) => { if(confirm('Hapus data ini?')) await deleteDoc(doc(db, col, id)); };
        window.closeModals = () => document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));

    </script>
</body>
</html>
