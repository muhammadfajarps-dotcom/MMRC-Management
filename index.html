<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMRC Management System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-layer" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Login MMRC</h2>
            <input type="password" id="login-pass" class="input-field mb-4" placeholder="Password">
            <button onclick="app.login()" class="w-full bg-teal-600 text-white py-3 rounded-xl">Masuk</button>
        </div>
    </div>

    <div id="app-layer" class="hidden h-screen flex overflow-hidden">
        <aside class="w-64 bg-white border-r flex flex-col">
            <div class="p-6 font-bold text-teal-600 border-b">MMRC SYSTEM</div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="app.nav('dashboard')" class="nav-btn">Dashboard</button>
                <button onclick="app.nav('medicine')" class="nav-btn">Medicine & Stock</button>
                <button onclick="app.nav('ttv')" class="nav-btn">TTV & GDS</button>
                <button onclick="app.nav('visit')" class="nav-btn">Visit Dokter</button>
                <button onclick="app.nav('crisis')" class="nav-btn">Pasien Crisis (BPSS)</button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
            <header class="h-16 bg-white border-b flex items-center justify-between px-8">
                <h2 id="page-title" class="font-bold text-gray-700">Dashboard</h2>
                <div class="flex gap-4">
                    <input type="text" id="global-search" onkeyup="app.search()" placeholder="Cari data..." class="border rounded-full px-4 py-1 text-sm">
                    <button onclick="app.exportAllExcel()" class="bg-green-600 text-white px-3 py-1 rounded text-sm">Excel</button>
                </div>
            </header>
            <div id="main-content" class="p-8 overflow-auto flex-1"></div>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-black/50 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl overflow-hidden flex flex-col">
            <div class="p-4 border-b flex justify-between bg-gray-50">
                <h3 id="modal-title" class="font-bold">Form</h3>
                <button onclick="app.closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
