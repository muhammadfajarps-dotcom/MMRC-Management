<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMHC PRO V3 - Integrated Clinical System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .glass-header { background: rgba(79, 70, 229, 0.9); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .nav-active { @apply bg-indigo-600 text-white shadow-lg; }
    </style>
</head>
<body class="text-slate-900 min-h-screen">

    <div id="login-page" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-10 text-center">
            <h1 class="text-3xl font-black text-indigo-600 mb-6 italic">MMHC PRO <span class="text-slate-800">V3</span></h1>
            <form id="login-form" class="space-y-4">
                <input type="text" id="user-input" placeholder="ID Admin" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border-2 border-transparent focus:border-indigo-500 font-bold" required>
                <input type="password" id="pass-input" placeholder="Passcode" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border-2 border-transparent focus:border-indigo-500 font-bold" required>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">Masuk Sistem</button>
            </form>
        </div>
    </div>

    <div id="main-content" class="hidden flex flex-col min-h-screen">
        
        <header class="glass-header text-white p-6 sticky top-0 z-40 flex justify-between items-center shadow-xl">
            <div class="flex items-center gap-3">
                <i class="fas fa-notes-medical text-2xl"></i>
                <h1 class="text-xl font-black tracking-tighter">MMHC INTEGRATED</h1>
            </div>
            <button onclick="location.reload()" class="bg-white/20 px-4 py-2 rounded-xl text-xs font-bold hover:bg-white/40">Logout</button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
            
            <div id="view-list" class="space-y-6">
                <div class="flex flex-col md:flex-row gap-4 justify-between">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="text" id="search-pasien" oninput="renderPasien()" placeholder="Cari nama pasien atau riwayat..." class="w-full bg-white p-5 pl-14 rounded-3xl shadow-sm outline-none border-2 border-transparent focus:border-indigo-500 font-bold">
                    </div>
                    <button onclick="openModalPasien()" class="bg-indigo-600 text-white px-8 py-5 rounded-3xl font-black shadow-lg shadow-indigo-100">+ Registrasi Pasien Baru</button>
                </div>

                <div id="list-pasien" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div id="view-detail" class="hidden space-y-6">
                <button onclick="closeDetail()" class="text-indigo-600 font-bold flex items-center gap-2 mb-4 hover:translate-x-1 transition-transform">
                    <i class="fas fa-arrow-left"></i> Kembali ke Daftar
                </button>

                <div id="patient-identity-card" class="bg-white rounded-[3rem] p-8 card-shadow border border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-8">
                    </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white rounded-3xl p-6 card-shadow border border-slate-100 lg:col-span-1">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-black text-slate-800 uppercase text-xs tracking-widest"><i class="fas fa-heartbeat text-red-500 mr-2"></i> Monitor TTV</h3>
                            <button onclick="openModalTTV()" class="bg-red-50 text-red-600 p-2 rounded-lg text-xs font-bold">+ Input</button>
                        </div>
                        <div id="ttv-history" class="space-y-3 max-h-[400px] overflow-y-auto pr-2"></div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 card-shadow border border-slate-100 lg:col-span-2">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-black text-slate-800 uppercase text-xs tracking-widest"><i class="fas fa-pills text-indigo-500 mr-2"></i> Inventory & Planning Terapi</h3>
                            <button onclick="openModalObat()" class="bg-indigo-50 text-indigo-600 p-2 rounded-lg text-xs font-bold">+ Tambah Obat</button>
                        </div>
                        <div id="obat-inventory" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-pasien" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-2xl p-8 max-h-[90vh] overflow-y-auto shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Formulir Rekam Medis</h3>
            <form id="form-pasien" class="space-y-4">
                <input type="hidden" id="p-id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Data Personal</label>
                        <input type="text" id="p-nama" placeholder="Nama Lengkap" class="w-full bg-slate-50 p-4 rounded-xl font-bold mb-2 outline-none border-2 border-transparent focus:border-indigo-500" required>
                        <div class="flex gap-2">
                            <input type="number" id="p-umur" placeholder="Usia" class="w-1/2 bg-slate-50 p-4 rounded-xl font-bold outline-none">
                            <select id="p-jk" class="w-1/2 bg-slate-50 p-4 rounded-xl font-bold outline-none">
                                <option>Laki-laki</option><option>Perempuan</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Kedatangan</label>
                        <input type="date" id="p-tgl-masuk" class="w-full bg-slate-50 p-4 rounded-xl font-bold mb-2 outline-none">
                        <input type="time" id="p-jam-masuk" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Riwayat & Diagnosa Awal</label>
                    <textarea id="p-riwayat" placeholder="Riwayat Penyakit Dahulu..." class="w-full bg-slate-50 p-4 rounded-xl font-medium h-20 outline-none mb-2"></textarea>
                    <textarea id="p-hasil-dok" placeholder="Hasil Konsultasi Pertama dengan Dokter..." class="w-full bg-slate-50 p-4 rounded-xl font-medium h-20 outline-none"></textarea>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Bukti Konsultasi (Foto)</label>
                    <input type="file" id="p-foto" accept="image/*" class="w-full text-xs font-bold text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-black file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
                    <input type="hidden" id="p-foto-base64">
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModals()" class="flex-1 font-bold text-slate-400">Batal</button>
                    <button type="submit" class="flex-[2] bg-indigo-600 text-white py-4 rounded-xl font-black shadow-lg">Simpan Data Pasien</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-obat" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6 italic">Tambah Stok & Planning Obat</h3>
            <form id="form-obat" class="space-y-4">
                <input type="hidden" id="o-id">
                <input type="text" id="o-nama" placeholder="Nama Obat" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="o-tgl-invoice" title="Tanggal Invoice" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="date" id="o-tgl-beri" title="Tanggal Diberikan" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="o-stok" placeholder="Jumlah Stok" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none" required>
                    <select id="o-satuan" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                        <option>Tablet</option><option>Botol</option><option>Sachet</option>
                    </select>
                </div>
                <div class="bg-indigo-50 p-4 rounded-xl">
                    <label class="text-[10px] font-black text-indigo-400 uppercase">Dosis (Otomatis Kurangi Stok per Hari)</label>
                    <div class="flex gap-2 mt-2">
                        <input type="number" id="o-pagi" placeholder="P" class="w-full p-3 rounded-lg text-center font-bold">
                        <input type="number" id="o-siang" placeholder="S" class="w-full p-3 rounded-lg text-center font-bold">
                        <input type="number" id="o-malam" placeholder="M" class="w-full p-3 rounded-lg text-center font-bold">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black">Simpan Planning</button>
            </form>
        </div>
    </div>

    <div id="modal-ttv" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <h3 class="text-xl font-black mb-6 italic">Monitoring Vitalitas</h3>
            <form id="form-ttv" class="space-y-4">
                <input type="hidden" id="v-id">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="v-td" placeholder="TD (120/80)" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="number" id="v-nadi" placeholder="Nadi" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="text" id="v-suhu" placeholder="Suhu" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                    <input type="number" id="v-rr" placeholder="RR" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                </div>
                <input type="date" id="v-tgl" class="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none">
                <button type="submit" class="w-full bg-red-500 text-white py-4 rounded-xl font-black">Input Hasil</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG (Tetap sama)
        const firebaseConfig = {
            apiKey: "AIzaSyBdzWrKOBqrcu6talld7MN-2flHNibEWnE",
            authDomain: "mmrc-stock.firebaseapp.com",
            projectId: "mmrc-stock",
            storageBucket: "mmrc-stock.firebasestorage.app",
            messagingSenderId: "722563453659",
            appId: "1:722563453659:web:b9f867367ecadb7a1df2fe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let PASIEN = [], OBAT = [], TTV = [], SELECTED_ID = null;

        // AUTH
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            if(document.getElementById('user-input').value === "MMRC.Stock1999" && document.getElementById('pass-input').value === "Madani1999") {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                startSync();
            }
        };

        function startSync() {
            onSnapshot(collection(db, "pasien_v3"), s => { PASIEN = s.docs.map(d => ({id:d.id, ...d.data()})); renderPasien(); if(SELECTED_ID) updateDetailUI(); });
            onSnapshot(collection(db, "obat_v3"), s => { OBAT = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) updateDetailUI(); });
            onSnapshot(collection(db, "ttv_v3"), s => { TTV = s.docs.map(d => ({id:d.id, ...d.data()})); if(SELECTED_ID) updateDetailUI(); });
        }

        // FOTO HANDLER (Base64)
        document.getElementById('p-foto').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = () => document.getElementById('p-foto-base64').value = reader.result;
            reader.readAsDataURL(e.target.files[0]);
        };

        // PASIEN CRUD
        window.openModalPasien = (id = null) => {
            const f = document.getElementById('form-pasien'); f.reset();
            document.getElementById('p-id').value = id || '';
            if(id) {
                const p = PASIEN.find(x => x.id === id);
                document.getElementById('p-nama').value = p.nama;
                document.getElementById('p-umur').value = p.umur;
                document.getElementById('p-jk').value = p.jk;
                document.getElementById('p-tgl-masuk').value = p.tglMasuk;
                document.getElementById('p-jam-masuk').value = p.jamMasuk;
                document.getElementById('p-riwayat').value = p.riwayat;
                document.getElementById('p-hasil-dok').value = p.hasilDokter;
            }
            document.getElementById('modal-pasien').classList.remove('hidden');
        };

        document.getElementById('form-pasien').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = {
                nama: document.getElementById('p-nama').value,
                umur: document.getElementById('p-umur').value,
                jk: document.getElementById('p-jk').value,
                tglMasuk: document.getElementById('p-tgl-masuk').value,
                jamMasuk: document.getElementById('p-jam-masuk').value,
                riwayat: document.getElementById('p-riwayat').value,
                hasilDokter: document.getElementById('p-hasil-dok').value,
                foto: document.getElementById('p-foto-base64').value || (id ? PASIEN.find(x => x.id === id).foto : '')
            };
            id ? await updateDoc(doc(db, "pasien_v3", id), data) : await addDoc(collection(db, "pasien_v3"), data);
            closeModals();
        };

        window.renderPasien = () => {
            const s = document.getElementById('search-pasien').value.toLowerCase();
            document.getElementById('list-pasien').innerHTML = PASIEN.filter(p => p.nama.toLowerCase().includes(s) || p.riwayat.toLowerCase().includes(s)).map(p => `
                <div onclick="openDetail('${p.id}')" class="bg-white p-6 rounded-[2.5rem] card-shadow border border-slate-50 cursor-pointer hover:border-indigo-300 transition-all group relative overflow-hidden">
                    <div class="flex gap-4 items-center">
                        <div class="w-16 h-16 rounded-2xl bg-slate-100 overflow-hidden flex-shrink-0">
                            ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover">` : `<i class="fas fa-user-circle text-slate-300 text-4xl m-3"></i>`}
                        </div>
                        <div>
                            <h4 class="font-black text-slate-800 text-lg">${p.nama}</h4>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${p.tglMasuk} • ${p.jamMasuk}</p>
                        </div>
                    </div>
                    <div class="mt-4 flex justify-between">
                        <button onclick="event.stopPropagation(); openModalPasien('${p.id}')" class="text-xs font-black text-blue-500 bg-blue-50 px-3 py-1 rounded-lg">EDIT PROFIL</button>
                        <button onclick="event.stopPropagation(); deleteData('pasien_v3', '${p.id}')" class="text-xs font-black text-red-300 hover:text-red-500">HAPUS</button>
                    </div>
                </div>
            `).join('');
        };

        // DETAIL SYSTEM
        window.openDetail = (id) => {
            SELECTED_ID = id;
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-detail').classList.remove('hidden');
            updateDetailUI();
        };

        window.closeDetail = () => {
            SELECTED_ID = null;
            document.getElementById('view-list').classList.remove('hidden');
            document.getElementById('view-detail').classList.add('hidden');
        };

        function updateDetailUI() {
            const p = PASIEN.find(x => x.id === SELECTED_ID);
            if(!p) return;

            document.getElementById('patient-identity-card').innerHTML = `
                <div class="space-y-4">
                    <div class="flex gap-4 items-start">
                        <div class="w-24 h-24 rounded-3xl bg-slate-100 overflow-hidden shadow-inner flex-shrink-0">
                            ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover">` : `<i class="fas fa-user text-slate-300 text-5xl p-6"></i>`}
                        </div>
                        <div>
                            <h2 class="text-3xl font-black text-indigo-600">${p.nama}</h2>
                            <p class="text-sm font-black text-slate-400 uppercase tracking-tighter">${p.jk} • ${p.umur} TAHUN</p>
                            <p class="text-[10px] font-bold text-slate-300 mt-1 italic">Masuk: ${p.tglMasuk} [${p.jamMasuk}]</p>
                        </div>
                    </div>
                    <div class="bg-indigo-50/50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-indigo-400 uppercase mb-1">Riwayat Penyakit</p>
                        <p class="text-sm font-bold text-slate-600">${p.riwayat || '-'}</p>
                    </div>
                </div>
                <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">Planning & Hasil Konsultasi Dokter</p>
                    <p class="text-sm font-bold text-slate-700 leading-relaxed italic">"${p.hasilDokter || 'Belum ada data konsultasi.'}"</p>
                </div>
            `;

            // Render TTV List
            const ttvP = TTV.filter(t => t.pasienId === SELECTED_ID).sort((a,b) => new Date(b.tgl) - new Date(a.tgl));
            document.getElementById('ttv-history').innerHTML = ttvP.map(t => `
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center group">
                    <div class="flex gap-3">
                        <div class="text-center bg-red-50 px-2 py-1 rounded-lg">
                            <p class="text-[8px] font-black text-red-400 uppercase">${t.tgl.split('-')[2]}</p>
                            <p class="text-[8px] font-black text-red-400 uppercase">${t.tgl.split('-')[1]}</p>
                        </div>
                        <div>
                            <p class="text-xs font-black text-slate-700">${t.td} <span class="text-[10px] text-slate-400 font-medium">mmHg</span></p>
                            <p class="text-[9px] font-bold text-slate-400">${t.suhu}°C • ${t.nadi}bpm • ${t.rr}rr</p>
                        </div>
                    </div>
                    <button onclick="deleteData('ttv_v3', '${t.id}')" class="opacity-0 group-hover:opacity-100 text-red-200 hover:text-red-500 transition-all"><i class="fas fa-trash"></i></button>
                </div>
            `).join('') || '<p class="text-center text-xs text-slate-300 py-10">Belum ada TTV</p>';

            // Render Inventory & Auto-Stock
            const obatP = OBAT.filter(o => o.pasienId === SELECTED_ID);
            document.getElementById('obat-inventory').innerHTML = obatP.map(o => {
                const sisa = calculateStock(o);
                return `
                <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h4 class="font-black text-slate-800">${o.nama}</h4>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Invoice: ${o.tglInvoice} • Beri: ${o.tglBeri}</p>
                        </div>
                        <div class="flex gap-2">
                             <button onclick="openModalObat('${o.id}')" class="text-blue-500 text-xs font-black px-2 py-1 bg-blue-50 rounded-lg">EDIT</button>
                             <button onclick="deleteData('obat_v3', '${o.id}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-3 rounded-xl shadow-sm text-center">
                            <p class="text-[9px] font-black text-slate-300 uppercase">Awal</p>
                            <p class="font-black text-slate-700">${o.stok}</p>
                        </div>
                        <div class="bg-indigo-600 p-3 rounded-xl shadow-md text-center text-white">
                            <p class="text-[9px] font-black opacity-60 uppercase">Sisa</p>
                            <p class="font-black text-xl">${sisa}</p>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow-sm col-span-2 flex items-center justify-around">
                            <div class="text-center"><p class="text-[8px] font-black text-slate-300 uppercase">P</p><p class="font-bold text-indigo-500">${o.pagi}</p></div>
                            <div class="text-center"><p class="text-[8px] font-black text-slate-300 uppercase">S</p><p class="font-bold text-indigo-500">${o.siang}</p></div>
                            <div class="text-center"><p class="text-[8px] font-black text-slate-300 uppercase">M</p><p class="font-bold text-indigo-500">${o.malam}</p></div>
                            <div class="border-l pl-3 text-center">
                                <p class="text-[8px] font-black text-slate-300 uppercase">Total/Hari</p>
                                <p class="font-black text-slate-700">${parseInt(o.pagi||0)+parseInt(o.siang||0)+parseInt(o.malam||0)}</p>
                            </div>
                        </div>
                    </div>
                    ${sisa < 5 ? `<p class="text-[9px] font-black text-red-500 mt-3 animate-pulse italic text-center">⚠️ STOK HAMPIR HABIS, SEGERA REFILL!</p>` : ''}
                </div>`;
            }).join('') || '<p class="text-center text-xs text-slate-300 py-10">Belum ada planning obat</p>';
        }

        // AUTO STOCK CALCULATOR
        function calculateStock(o) {
            const start = new Date(o.tglBeri);
            const now = new Date();
            const diffTime = Math.max(0, now - start);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            const totalDosePerDay = (parseInt(o.pagi)||0) + (parseInt(o.siang)||0) + (parseInt(o.malam)||0);
            const consumed = diffDays * totalDosePerDay;
            return Math.max(0, o.stok - consumed);
        }

        // TTV & OBAT SUBMIT
        window.openModalTTV = () => {
            document.getElementById('form-ttv').reset();
            document.getElementById('v-tgl').value = new Date().toISOString().split('T')[0];
            document.getElementById('modal-ttv').classList.remove('hidden');
        };

        document.getElementById('form-ttv').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "ttv_v3"), {
                pasienId: SELECTED_ID,
                td: document.getElementById('v-td').value,
                nadi: document.getElementById('v-nadi').value,
                suhu: document.getElementById('v-suhu').value,
                rr: document.getElementById('v-rr').value,
                tgl: document.getElementById('v-tgl').value
            });
            closeModals();
        };

        window.openModalObat = (id = null) => {
            const f = document.getElementById('form-obat'); f.reset();
            document.getElementById('o-id').value = id || '';
            if(id) {
                const o = OBAT.find(x => x.id === id);
                document.getElementById('o-nama').value = o.nama;
                document.getElementById('o-stok').value = o.stok;
                document.getElementById('o-tgl-invoice').value = o.tglInvoice;
                document.getElementById('o-tgl-beri').value = o.tglBeri;
                document.getElementById('o-pagi').value = o.pagi;
                document.getElementById('o-siang').value = o.siang;
                document.getElementById('o-malam').value = o.malam;
            }
            document.getElementById('modal-obat').classList.remove('hidden');
        };

        document.getElementById('form-obat').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('o-id').value;
            const data = {
                pasienId: SELECTED_ID,
                nama: document.getElementById('o-nama').value,
                stok: parseInt(document.getElementById('o-stok').value),
                satuan: document.getElementById('o-satuan').value,
                tglInvoice: document.getElementById('o-tgl-invoice').value,
                tglBeri: document.getElementById('o-tgl-beri').value,
                pagi: document.getElementById('o-pagi').value || 0,
                siang: document.getElementById('o-siang').value || 0,
                malam: document.getElementById('o-malam').value || 0,
            };
            id ? await updateDoc(doc(db, "obat_v3", id), data) : await addDoc(collection(db, "obat_v3"), data);
            closeModals();
        };

        window.deleteData = async (col, id) => { if(confirm('Hapus data ini selamanya?')) await deleteDoc(doc(db, col, id)); };
        window.closeModals = () => document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));

    </script>
</body>
</html>
